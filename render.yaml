services:
  - type: web
    name: sprout-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        value: https://nhatluan110.github.io/spourt/
      - key: COOKIE_CROSS_SITE
        value: "true"
      - key: COOKIE_SECRET
        generateValue: true
      - key: SECRET_ENCRYPTION_KEY
        generateValue: true
      - key: STORAGE_PUBLIC_URL
        value: /media
      - key: AI_PROVIDER
        value: gemini
      - key: AI_API_KEY
        sync: false
      - key: AI_SPEECH_PROVIDER
        value: gemini
      - key: GEMINI_MODEL_FAST
        value: gemini-3.5-flash
      - key: GEMINI_MODEL_DEEP
        value: gemini-3.5-flash
