  - slug: herbs-outside-classroom-four
    title: Herbs outside Classroom Four
    titleVi: Vườn rau thơm ngoài phòng học số bốn
    topic: education
    estimatedMinutes: 5
    source: Sprout original
    glossary: []
    body: >-
      Class Four wanted to grow something outside their classroom. There was a narrow sunny space
      beside the wall, but there was no garden soil. Their teacher suggested using old containers.
      Each group brought a clean container with small holes in the bottom.


      On Monday, the children filled the containers with soil and planted herbs. One group chose
      mint, another chose basil, and the third planted coriander. They wrote the names on wooden
      sticks because the small plants looked similar. The teacher put a watering chart beside the
      classroom door.


      For the first week, each group watered its own plants. Then one group forgot during a school
      trip. When they returned, the soil was very dry. The children discussed what had happened.
      They decided that two students would check all the containers each afternoon, including those
      belonging to other groups.


      A month later, the plants were bigger. The class picked a few leaves and smelled the
      differences. They did not sell the herbs or take all the plants home. Instead, they invited
      another class to look at the containers and read the labels. The children were proud,
      especially when they explained the new watering plan themselves.
    questions:
      - type: MCQ
        prompt: Why do the children use containers?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - The wall is too colourful.
          - There is no garden soil in the space.
          - They want to hide the plants indoors.
          - The teacher dislikes herbs.
        answer: There is no garden soil in the space.
        explanationVi: Không có đất vườn ở khoảng trống cạnh lớp nên các em dùng thùng, chậu cũ.
      - type: MCQ
        prompt: What problem occurs during a school trip?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - Some plants receive no water.
          - The labels blow away.
          - All containers break.
          - Another class takes the herbs.
        answer: Some plants receive no water.
        explanationVi: Một nhóm quên tưới cây trong đợt đi tham quan.
      - type: MCQ
        prompt: How does the class improve the plan?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
