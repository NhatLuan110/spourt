  - slug: a-picnic-on-the-living-room-floor
    title: A Picnic on the Living-room Floor
    titleVi: Buổi dã ngoại trên sàn phòng khách
    topic: daily-life
    estimatedMinutes: 5
    source: Sprout original
    glossary: []
    body: >-
      On Saturday morning, Tuan's family prepared for a picnic by the lake. His mother made
      sandwiches, his father filled bottles with water, and Tuan packed a ball. His younger sister,
      Ly, put three picture books in her bag. They planned to leave at ten.


      At half past nine, heavy rain began. The family watched the weather from the kitchen window.
      The sky was dark, and the path beside the lake would be muddy. Ly looked disappointed. She had
      talked about the picnic all week.


      Tuan suggested having it inside. They moved the coffee table and spread a large blanket on the
      living-room floor. His father opened the curtains so they could watch the rain. They put the
      food in the middle and ate without turning on the television.


      After lunch, Ly chose a book and asked everyone to make a different animal sound while she
      read. They laughed so loudly that their neighbour heard them through the open window. Later,
      Tuan put the ball away because there was not enough room to play safely. They played a
      guessing game instead. The lake could wait until another weekend; the family had already found
      a good way to spend this one together.
    questions:
      - type: MCQ
        prompt: Why does the family change its plan?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - They forget the food.
          - The lake disappears.
          - Heavy rain makes the outdoor picnic difficult.
          - Ly refuses to leave her room.
        answer: Heavy rain makes the outdoor picnic difficult.
        explanationVi: Mưa lớn và lối đi lầy khiến cả nhà chuyển buổi dã ngoại vào trong nhà.
      - type: MCQ
        prompt: What does Tuan suggest?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - Have the picnic inside
          - Go to a restaurant alone
          - Watch television all day
          - Throw away the sandwiches
        answer: Have the picnic inside
        explanationVi: Tuấn đề nghị trải đồ ăn và ngồi dã ngoại trong nhà.
      - type: MCQ
        prompt: Why does Tuan put the ball away?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - He no longer likes football.
          - The room is too small for safe ball games.
          - It belongs to the neighbour.
          - The ball is wet from the lake.
        answer: The room is too small for safe ball games.
        explanationVi: Trong phòng không đủ chỗ để chơi bóng an toàn.
