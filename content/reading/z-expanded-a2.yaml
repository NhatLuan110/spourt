  - slug: measuring-before-buying
    title: Measuring before Buying
    titleVi: Đo trước khi mua
    topic: daily-life
    estimatedMinutes: 5
    source: Sprout original
    glossary: []
    body: >-
      Hanh needed a kitchen table for her new flat. A furniture shop had a lovely round table, but
      it cost more than she could spend. Her colleague showed her a website where people sold used
      furniture. That evening, Hanh found a wooden table for half the shop price.


      The photographs looked good, and the seller lived nearby. Hanh nearly agreed to buy it
      immediately. Then her colleague asked about the size. Hanh measured her kitchen and sent the
      seller a message. The table was too wide. There would be no room to open the fridge door.


      Two days later, she found a smaller square table. The seller said one leg was loose, but the
      table was otherwise in good condition. Hanh visited after work with her uncle. He checked the
      leg and said a new screw would fix it. They also checked for marks on the top.


      The seller helped carry the table to her uncle's van. At home, Hanh cleaned it and tightened
      the leg. She put two chairs beside it and opened the fridge door to check the space. The table
      was not new, but it fitted her kitchen and left enough money for groceries.
    questions:
      - type: MCQ
        prompt: Why does Hanh look for used furniture?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - She wants a larger kitchen.
          - The new table is too expensive for her.
          - She dislikes all round tables.
          - Her uncle owns a furniture shop.
        answer: The new table is too expensive for her.
        explanationVi: Chiếc bàn mới vượt quá số tiền Hạnh có thể chi.
      - type: MCQ
        prompt: Why does Hanh reject the first used table?
        promptVi: Chọn đáp án đúng theo bài đọc.
