  - slug: the-first-swimming-lesson
    title: The First Swimming Lesson
    titleVi: Buổi học bơi đầu tiên
    topic: daily-life
    estimatedMinutes: 5
    source: Sprout original
    glossary: []
    body: >-
      Minh joined a beginner swimming class because he wanted to enjoy the pool with his friends. He
      could stand in shallow water, but he felt afraid when his feet left the floor. Before the
      first lesson, he bought goggles and packed a towel.


      There were six adults in the class. Their teacher, Rosa, asked everyone to explain what they
      hoped to learn. Minh was surprised that two other people were also afraid of deep water. Rosa
      said they would stay in the shallow end that day. Nobody had to hurry.


      They first practised breathing out into the water while holding the side. Minh lifted his head
      too quickly and got water in his nose. Rosa demonstrated the movement again. He tried more
      slowly and found it easier. After a short break, they used floating boards to practise moving
      their legs.


      At the end of the lesson, Minh had moved three metres with a board. He had not learned to swim
      alone, but he no longer wanted to leave the pool immediately. On the way home, he wrote the
      next lesson time in his calendar. He also reminded himself to bring a drink because his towel
      was not the only thing he needed.
    questions:
      - type: MCQ
        prompt: Why does Minh join the class?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - To become the teacher
          - To work at the pool
          - To enjoy the pool with friends
          - To buy a new calendar
        answer: To enjoy the pool with friends
        explanationVi: Minh muốn có thể vui chơi ở hồ bơi cùng bạn bè.
      - type: MCQ
        prompt: What does Minh discover about the other learners?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - Two share his fear of deep water.
          - All are expert swimmers.
          - None can stand in shallow water.
          - They all know his friends.
        answer: Two share his fear of deep water.
        explanationVi: Hai học viên khác cũng sợ nước sâu.
      - type: MCQ
        prompt: How does Minh feel at the end?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - Ready to teach swimming
          - Less eager to leave the pool
          - Angry that the class exists
          - Certain that practice is useless
        answer: Less eager to leave the pool
        explanationVi: Minh chưa tự bơi được nhưng không còn chỉ muốn rời hồ ngay.
      - type: TRUE_FALSE
        prompt: Is this statement true or false according to the passage?
