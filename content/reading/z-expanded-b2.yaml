        promptVi: Theo bài đọc, trạm giao hàng cung cấp thời gian nhận bưu phẩm trong khung giờ nào?
        explanationVi: "Đoạn 2 nêu rõ: 'collection hours between seven in the morning and ten at night' (7
          giờ sáng đến 10 giờ tối)."
