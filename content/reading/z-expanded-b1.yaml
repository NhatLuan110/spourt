        explanationVi: Các em sửa được hai mươi ba đồ vật.
  - slug: a-household-budget-everyone-could-read
    title: A Household Budget Everyone Could Read
    titleVi: Bảng chi tiêu cả nhà cùng hiểu
    topic: daily-life
    estimatedMinutes: 7
    source: Sprout original
    glossary: []
    body: >-
      When three cousins moved into a flat together, they agreed to divide shared expenses equally.
      For the first month, this seemed simple. Each person bought things when they noticed something
      was missing, and they planned to add up the costs later. By the time the first bills arrived,
      however, nobody could remember who had paid for several small purchases.


      The cousins arranged a conversation on Sunday afternoon. They brought receipts and made two
      lists: shared expenses and personal expenses. Rent, cleaning products and basic cooking
      ingredients went on the shared list. Lunches bought at work remained personal. One cousin,
      Duc, rarely ate dinner at home, so they agreed that special ingredients for group meals would
      be discussed separately.


      They created a shared spreadsheet with a column for the date, the item, the cost and the
      person who paid. A photograph of each receipt went in a shared folder. The spreadsheet did not
      decide what was fair; it simply made the information visible. The cousins still had to agree
      on how to handle unusual purchases.


      Their first disagreement involved a large lamp that Trang bought for the living room. She
      expected everyone to contribute, but the others had not known she was buying it. They decided
      she would keep ownership of the lamp. Future shared purchases above an agreed amount would
      need everyone's approval beforehand.


      After two months, they spent less time arguing over forgotten payments. They still met briefly
      after the main bills arrived, because their schedules and needs sometimes changed. Trang said
      the system worked because they talked before making assumptions. The spreadsheet was useful,
      but it could not replace the conversation.
