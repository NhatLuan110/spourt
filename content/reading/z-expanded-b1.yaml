  - slug: the-fridge-at-number-eighteen
    title: The Fridge at Number Eighteen
    titleVi: Chiếc tủ lạnh ở nhà số mười tám
    topic: daily-life
    estimatedMinutes: 7
    source: Sprout original
    glossary: []
    body: >-
      When the residents of Number Eighteen opened a shared food fridge, they expected the main
      difficulty to be finding donations. Within a week, however, the fridge was full. The real
      problem was knowing what was inside each container and how long it had been there.


      The fridge stood in a covered entrance that everyone in the building could reach. A bakery
      left unsold bread in a separate basket, while residents brought unopened food they would not
      use. People could take what they needed without writing down their names. The organisers
      wanted the project to feel like sharing between neighbours, rather than a service for one
      particular group.


      On the first Saturday, a volunteer found three unlabelled boxes. Nobody could identify who had
      brought them or what they contained. The volunteer removed the boxes and left a note
      explaining the problem. Some residents thought this was wasteful, but others said they needed
      clear information before taking food home.


      At a short meeting, the residents agreed on a simple system. Every donation needed a label
      showing its contents and the date it was added. Home-cooked meals would no longer be accepted
      under the project's own rules. Two volunteers would check the fridge each evening and record
      anything they removed. A printed list beside the door explained these decisions.


      A month later, fewer items were being removed during checks. One resident who had initially
      complained began helping with labels. She said the rules made donating easier because she no
      longer had to guess what was welcome. The organisers realised that a successful sharing
      project needed both generosity and clear arrangements.
    questions:
      - type: MCQ
        prompt: What unexpected difficulty does the project face?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - Too few people live nearby.
          - Residents cannot identify some donated food.
          - The building has no entrance.
          - The bakery refuses to share bread.
        answer: Residents cannot identify some donated food.
        explanationVi: Tủ nhanh đầy nhưng một số hộp không có thông tin về nội dung và ngày mang đến.
      - type: MCQ
        prompt: Why are people not asked to record their names?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - The organisers want sharing to feel open to all neighbours.
          - The fridge is a private shop.
          - Every visitor has already registered online.
          - The residents cannot write.
        answer: The organisers want sharing to feel open to all neighbours.
        explanationVi: Dự án hướng đến việc hàng xóm chia sẻ với nhau, không nhắm riêng một nhóm người.
      - type: MCQ
        prompt: How does the resident’s attitude change?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - She decides all rules are unnecessary.
          - She stops using every shared service.
          - She starts helping after finding the rules useful.
          - She asks the bakery to close.
        answer: She starts helping after finding the rules useful.
        explanationVi: Người từng phản đối đã hỗ trợ dán nhãn vì quy định giúp biết rõ món nào được nhận.
      - type: TRUE_FALSE
        prompt: Is this statement true or false according to the passage?
        promptVi: Nhận định này đúng hay sai theo bài đọc?
        statement: The bakery’s bread goes in a separate basket.
        answer: true
        explanationVi: Bánh mì được để trong giỏ riêng.
      - type: TRUE_FALSE
        prompt: Is this statement true or false according to the passage?
        promptVi: Nhận định này đúng hay sai theo bài đọc?
        statement: The new system requires everyone who takes food to give their name.
        answer: false
        explanationVi: Người lấy đồ không phải ghi tên; nhãn dành cho đồ được quyên góp.
      - type: SHORT_ANSWER
        prompt: How many unlabelled boxes does the volunteer find?
        promptVi: Trả lời ngắn bằng tiếng Anh, dùng từ trong bài đọc.
        accept:
          - three
          - "3"
        explanationVi: Tình nguyện viên tìm thấy ba hộp không nhãn.
      - type: SHORT_ANSWER
        prompt: When do volunteers check the fridge? Write two words.
        promptVi: Trả lời ngắn bằng tiếng Anh, dùng từ trong bài đọc.
        accept:
          - each evening
        explanationVi: Hai tình nguyện viên kiểm tra tủ vào mỗi tối.
      - type: SHORT_ANSWER
        prompt: What type of meals is no longer accepted? Write two words.
        promptVi: Trả lời ngắn bằng tiếng Anh, dùng từ trong bài đọc.
        accept:
          - home-cooked meals
        explanationVi: Quy định riêng của dự án không nhận đồ nấu tại nhà.
  - slug: four-commutes-and-one-quiet-morning
    title: Four Commutes and One Quiet Morning
    titleVi: Bốn ngày đi làm và một sáng yên tĩnh
    topic: work
    estimatedMinutes: 7
    source: Sprout original
    glossary: []
    body: >-
      For two years, Hoa spent nearly three hours travelling to and from her office each day. She
      liked her colleagues, but the journey left little time for evening classes. When her manager
      offered a one-month trial of working from home on Wednesdays, Hoa volunteered immediately.


      Before the trial began, they agreed on the tasks she would complete at home. Wednesday
      mornings usually involved checking reports, which required concentration but few
      conversations. Hoa would attend the afternoon team meeting by video. She also agreed to keep a
      short record of completed work and any difficulties. The purpose was to compare the new
      arrangement with a normal week, rather than simply ask whether she liked it.


      During the first Wednesday, Hoa finished her reports before lunch. However, she missed an
      important conversation when two colleagues changed a delivery plan at their desks. They
      assumed everyone nearby had heard. Hoa continued using the old date and had to correct her
      report the next morning.


      At the weekly review, the team decided to write changes in a shared document. This helped
      colleagues in the office as well, especially people who had been in another meeting. Hoa also
      discovered that working at her kitchen table hurt her concentration when her flatmate cooked
      lunch. She moved to a small desk in her bedroom for the remaining weeks.


      By the end of the month, Hoa had completed the same amount of work and attended four evening
      classes. Her manager agreed to continue the arrangement for another three months. Both
      understood that the saved travel time was useful, but reliable communication was what made the
      trial work.
    questions:
      - type: MCQ
        prompt: What is the main purpose of the trial record?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - To compare how the two arrangements work
          - To calculate train ticket prices
          - To list Hoa’s favourite meals
          - To replace every team meeting
        answer: To compare how the two arrangements work
        explanationVi: Bản ghi giúp so sánh công việc khi làm ở nhà với một tuần bình thường.
      - type: MCQ
        prompt: Why does Hoa use the wrong delivery date?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - She refuses to read reports.
          - Her flatmate changes it.
          - Colleagues do not record a change discussed in the office.
          - The team cancels all deliveries.
        answer: Colleagues do not record a change discussed in the office.
        explanationVi: Hai đồng nghiệp đổi kế hoạch qua trao đổi miệng nên Hoa không biết.
      - type: MCQ
        prompt: Who benefits from the shared document?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - Only Hoa’s flatmate
          - Only the manager’s customers
          - Nobody in the office
          - Both Hoa and colleagues who miss conversations
        answer: Both Hoa and colleagues who miss conversations
        explanationVi: Tài liệu chung giúp cả Hoa lẫn người ở văn phòng nhưng vắng mặt khi trao đổi.
      - type: TRUE_FALSE
        prompt: Is this statement true or false according to the passage?
        promptVi: Nhận định này đúng hay sai theo bài đọc?
        statement: Hoa attends the afternoon team meeting by video.
        answer: true
        explanationVi: Đó là một phần thỏa thuận trước thử nghiệm.
      - type: TRUE_FALSE
        prompt: Is this statement true or false according to the passage?
        promptVi: Nhận định này đúng hay sai theo bài đọc?
        statement: Hoa completes less work by the end of the month.
        answer: false
        explanationVi: Bài nêu Hoa hoàn thành cùng lượng công việc.
      - type: SHORT_ANSWER
        prompt: On which day does Hoa work from home? Write one word.
        promptVi: Trả lời ngắn bằng tiếng Anh, dùng từ trong bài đọc.
        accept:
          - Wednesday
          - Wednesdays
        explanationVi: Hoa làm ở nhà vào thứ Tư.
      - type: SHORT_ANSWER
        prompt: Where does Hoa move her workspace? Write two words.
        promptVi: Trả lời ngắn bằng tiếng Anh, dùng từ trong bài đọc.
        accept:
          - her bedroom
          - the bedroom
          - bedroom
        explanationVi: Cô chuyển sang bàn nhỏ trong phòng ngủ.
      - type: SHORT_ANSWER
        prompt: For how many more months will the arrangement continue?
        promptVi: Trả lời ngắn bằng tiếng Anh, dùng từ trong bài đọc.
        accept:
          - three
          - "3"
          - three months
          - 3 months
        explanationVi: Quản lý đồng ý tiếp tục thêm ba tháng.
  - slug: voices-behind-the-museum-objects
    title: Voices behind the Museum Objects
    titleVi: Những câu chuyện phía sau hiện vật
    topic: education
    estimatedMinutes: 7
    source: Sprout original
    glossary: []
    body: >-
      The small museum in Greenfield had many photographs of the old railway station, but visitors
      often walked past them without stopping. The labels explained when the buildings were
      constructed and what they cost. They said little about the people who had used them.


      To prepare a new display, the museum invited residents to share memories of the station. A
      volunteer named Eva recorded the interviews in a quiet room behind the entrance. She began
      each conversation with the same question: what do you remember seeing, hearing or doing there?
      Some people brought tickets, while others brought objects that seemed unrelated at first.


      Mr Harris arrived with a red lunch tin. As a teenager, he had delivered meals to his mother,
      who worked in the station office. He remembered the smell of soup mixing with smoke from the
      engines. Another resident described meeting her husband after his long journey home. These
      details made the place easier to imagine than dates alone had done.


      The interviews also disagreed about some events. Two people remembered the station café
      closing in different years. Instead of choosing the more confident speaker, Eva checked old
      newspapers. The café had stopped serving hot meals one year and closed completely the next.
      Both memories described part of the story.


      Before using any recording, the museum sent the speaker a copy and asked permission to share
      it. Residents could remove a section or choose to have their words displayed without their
      names. When the exhibition opened, the photographs remained, but visitors could now listen to
      short voices beside them. Many stayed longer, then added memories of their own on cards near
      the exit.
    questions:
      - type: MCQ
        prompt: What was missing from the original labels?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - The station’s construction dates
          - The cost of buildings
          - People’s experiences of the station
          - Photographs of trains
        answer: People’s experiences of the station
        explanationVi: Nhãn cũ có ngày xây dựng và chi phí nhưng ít nói về trải nghiệm của người dân.
      - type: MCQ
        prompt: How does Eva explain the different café dates?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - One person invented the café.
          - Hot meals ended before the café closed completely.
          - Both residents moved away as babies.
          - The newspaper gives no information.
        answer: Hot meals ended before the café closed completely.
        explanationVi: Quán ngừng bán món nóng trước khi đóng hẳn một năm; hai ký ức nói về hai mốc khác nhau.
      - type: MCQ
        prompt: What does the permission process show?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - Residents can control how their contributions are shared.
          - The museum owns every personal memory.
          - Speakers must publish their full names.
          - Only written interviews are accepted.
        answer: Residents can control how their contributions are shared.
        explanationVi: Người kể được bỏ đoạn hoặc chọn không ghi tên trước khi bảo tàng sử dụng.
      - type: TRUE_FALSE
        prompt: Is this statement true or false according to the passage?
        promptVi: Nhận định này đúng hay sai theo bài đọc?
        statement: Mr Harris brought a lunch tin to his interview.
        answer: true
        explanationVi: Ông mang hộp cơm màu đỏ gắn với ký ức đưa bữa ăn cho mẹ.
      - type: TRUE_FALSE
        prompt: Is this statement true or false according to the passage?
        promptVi: Nhận định này đúng hay sai theo bài đọc?
        statement: The new exhibition removes all the old photographs.
        answer: false
        explanationVi: Ảnh vẫn được giữ và bổ sung đoạn ghi âm bên cạnh.
      - type: SHORT_ANSWER
        prompt: What colour was Mr Harris’s lunch tin? Write one word.
        promptVi: Trả lời ngắn bằng tiếng Anh, dùng từ trong bài đọc.
        accept:
          - red
        explanationVi: Hộp cơm có màu đỏ.
      - type: SHORT_ANSWER
        prompt: What does Eva check to clarify the café dates? Write two words.
        promptVi: Trả lời ngắn bằng tiếng Anh, dùng từ trong bài đọc.
        accept:
          - old newspapers
        explanationVi: Eva kiểm tra báo cũ để làm rõ hai mốc thời gian.
      - type: SHORT_ANSWER
        prompt: Where can visitors leave cards with memories? Write three words.
        promptVi: Trả lời ngắn bằng tiếng Anh, dùng từ trong bài đọc.
        accept:
          - near the exit
          - the exit
        explanationVi: Thẻ ghi ký ức được đặt gần lối ra.
  - slug: choosing-between-two-part-time-jobs
    title: Choosing between Two Part-time Jobs
    titleVi: Chọn giữa hai công việc bán thời gian
    topic: work
    estimatedMinutes: 7
    source: Sprout original
    glossary: []
    body: >-
      In her second year at college, Nhi wanted a part-time job that would help cover transport and
      books. She received two offers in the same week. A café offered weekend work, while a printing
      shop needed someone on three weekday evenings. At first, the printing job seemed better
      because its hourly pay was higher.


      Nhi made a table instead of deciding immediately. She included travel time, the cost of
      getting home and the hours she needed for studying. The printing shop closed at ten, after the
      last direct bus to her neighbourhood. She could take two buses, but the journey would be long.
      A taxi would use much of the extra money she earned.


      The café was a twenty-minute walk from her flat. Its weekend shifts would mean missing some
      activities with friends. However, the owner said staff could request one free weekend a month
      if they arranged it early. Nhi asked whether that promise would appear in the written
      schedule. The owner showed her how the monthly rota was prepared.


      Nhi also spoke to a student who already worked at the printing shop. He enjoyed learning about
      design, but warned her that customers often arrived just before closing. This sometimes
      delayed his journey home. Nhi liked the work itself, yet she had an early class on two of the
      following mornings.


      She accepted the café job and explained her decision politely to the other employer. The
      printing job was not a bad offer; it simply fitted her timetable less well. After her first
      month, Nhi still checked her study time carefully. Choosing a job had solved one problem, but
      she needed to keep the balance working.
    questions:
      - type: MCQ
        prompt: Why does the printing job first attract Nhi?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - It pays more per hour.
          - It is inside her college.
          - It has no evening shifts.
          - Her best friend owns it.
        answer: It pays more per hour.
        explanationVi: Lương theo giờ ở tiệm in cao hơn.
      - type: MCQ
        prompt: What transport problem does she identify?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - The café is on an island.
          - All buses stop at midday.
          - The printing shop closes after her last direct bus.
          - She has lost every bus pass.
        answer: The printing shop closes after her last direct bus.
        explanationVi: Tiệm in đóng cửa lúc mười giờ, sau chuyến xe buýt thẳng cuối cùng về khu nhà cô.
      - type: MCQ
        prompt: What best describes her final decision?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - She selects the job with the highest advertised pay.
          - She considers how the job fits her wider routine.
          - She gives up college to work full-time.
          - She chooses without asking questions.
        answer: She considers how the job fits her wider routine.
        explanationVi: Nhi cân nhắc đi lại, lịch học và thời gian riêng trước khi chọn quán cà phê.
      - type: TRUE_FALSE
        prompt: Is this statement true or false according to the passage?
        promptVi: Nhận định này đúng hay sai theo bài đọc?
        statement: The café is within walking distance of Nhi’s flat.
        answer: true
        explanationVi: Nhi đi bộ khoảng hai mươi phút từ nhà đến quán.
      - type: TRUE_FALSE
        prompt: Is this statement true or false according to the passage?
        promptVi: Nhận định này đúng hay sai theo bài đọc?
        statement: The printing-shop student says work always ends exactly on time.
        answer: false
        explanationVi: Khách đến sát giờ đóng cửa đôi khi khiến anh về muộn.
      - type: SHORT_ANSWER
        prompt: At what time does the printing shop close?
        promptVi: Trả lời ngắn bằng tiếng Anh, dùng từ trong bài đọc.
        accept:
