  - slug: the-bakerys-last-tray
    title: The Bakery’s Last Tray
    titleVi: Khay bánh cuối ngày
    topic: work
    estimatedMinutes: 7
    source: Sprout original
    glossary: []
    body: >-
      At six every evening, the staff at Maple Bakery counted the bread that had not sold. Some days
      there were only a few rolls. On other days, whole trays remained. The owner, Yusuf, disliked
      the waste, but baking too little meant disappointing customers who came after work.


      He asked the team to keep a record for four weeks. They noted the weather, nearby events and
      the number of each product left at closing. The records showed that cheese rolls often
      remained on wet Tuesdays, while plain bread sold steadily throughout the week. A large sports
      event nearby caused extra demand, but only on the days when matches finished before the shop
      closed.


      The bakery made two changes. It reduced the first batch of cheese rolls on Tuesdays and kept
      ingredients ready for a smaller second batch if needed. It also introduced a collection box
      that customers could reserve after four o'clock. The contents varied with what was left, and
      the description made that clear. Customers seeking a particular product still bought it in the
      usual way.


      Yusuf considered simply lowering every price near closing time. However, a staff member
      pointed out that customers might then wait for discounts, making demand harder to predict.
      They decided to test the boxes first and review the results before changing anything else.


      After a month, the total amount of unsold bread had fallen, but the bakery still had difficult
      days. On one sunny Tuesday, an unexpected group bought every cheese roll by lunchtime. Yusuf
      wrote the exception in the record rather than abandoning the plan. He wanted a system that
      could learn from surprises, not a rule pretending surprises would never happen.
