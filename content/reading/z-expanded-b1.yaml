  - slug: borrowing-a-drill-from-the-library
    title: Borrowing a Drill from the Library
    titleVi: Mượn máy khoan ở thư viện
    topic: daily-life
    estimatedMinutes: 7
    source: Sprout original
    glossary: []
    body: >-
      Visitors to the West Lane Library used to ask only about books, magazines and computers. Now a
      cupboard behind the information desk also holds household tools. The idea came from residents
      who needed an item for one small job but did not want to buy something they would rarely use
      again.


      The librarian, Priya, began with a survey. Many people mentioned drills and sewing kits, but
      some requested large machines that the library had no room to store. Priya chose a limited
      collection that staff could check and explain. Each item came with its original instructions
      and a list of parts. Borrowers had to complete a short introduction before their first tool
      loan.


      The borrowing period was one week, the same for every tool. At first, items could be reserved
      only online. A regular visitor pointed out that she used the library precisely because she did
      not have reliable internet at home. The team added telephone bookings and reservations at the
      desk so that the new service would not exclude her.


      Not every donation was accepted. Someone offered an old drill without instructions, and
      another person brought a machine with a damaged cable. The library thanked them but declined
      both items. Priya explained that a useful collection depended on condition and support, not
      just the number of objects available.


      After three months, sewing kits were borrowed more often than drills. The staff had expected
      the opposite. They bought two additional kits using the small project budget and postponed
      buying more drills. For Priya, that adjustment was a sign of success. The service was
      beginning to follow what residents actually used rather than what the organisers had imagined
      they would need.
    questions:
      - type: MCQ
        prompt: Why did residents suggest a tool collection?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - They wanted to replace all books.
          - They needed occasional access to tools without buying them.
          - They wanted the library to become a factory.
          - They already owned every item.
        answer: They needed occasional access to tools without buying them.
        explanationVi: Người dân chỉ cần dụng cụ cho vài việc nhỏ nên muốn mượn thay vì mua.
      - type: MCQ
        prompt: Why are telephone and desk reservations added?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - To make the service available to people without reliable home internet
          - To prevent people from making reservations
          - To remove all online bookings
          - To sell more computers
        answer: To make the service available to people without reliable home internet
        explanationVi: Hai cách đặt thêm giúp người không có mạng ổn định ở nhà vẫn sử dụng được.
      - type: MCQ
        prompt: What guides the later purchase of sewing kits?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - A guess made before the project
          - A rule requiring identical numbers of tools
          - The actual pattern of borrowing
          - A request from the damaged-drill donor
        answer: The actual pattern of borrowing
        explanationVi: Bộ may vá được mượn nhiều hơn dự kiến nên thư viện mua thêm theo nhu cầu thật.
      - type: TRUE_FALSE
        prompt: Is this statement true or false according to the passage?
        promptVi: Nhận định này đúng hay sai theo bài đọc?
        statement: Borrowers complete an introduction before their first tool loan.
        answer: true
        explanationVi: Người mượn phải tham gia phần giới thiệu ngắn trước lần mượn dụng cụ đầu tiên.
      - type: TRUE_FALSE
