  - slug: asking-before-the-shutter-clicks
    title: Asking before the Shutter Clicks
    titleVi: Hỏi trước khi bấm máy
    topic: daily-life
    estimatedMinutes: 7
    source: Sprout original
    glossary: []
    body: >-
      When Adam joined a photography course, his first assignment was to show everyday life in a
      local market. He arrived early, hoping to capture sellers setting up their stalls. From the
      entrance, the colours and movement looked exciting. He raised his camera, but a woman
      arranging flowers turned away and covered her face.


      Adam lowered the camera and apologised. The woman, Mrs Lan, explained that she disliked
      strangers taking close photographs without asking. She was happy for him to photograph the
      flowers, but did not want to appear in the picture. Adam agreed and moved so that only the
      buckets and flowers were in the frame.


      At the next stall, he introduced himself before taking out his camera. He explained the class
      project and asked a fruit seller whether he could photograph him weighing oranges. The seller
      agreed, provided that Adam did not block customers. Adam waited beside a post and took three
      pictures when there was space.


      During the morning, he also photographed details that did not show faces: hands tying string,
      empty baskets under a table and chalk prices on a board. These images helped tell the story of
      the market without every picture being a portrait. Before leaving, Adam showed the fruit
      seller his favourite photograph and offered to bring a print the next week.


      In class, Adam described both the pictures and the conversations that came before them. His
      teacher asked whether permission had made the task slower. Adam said it had, but the slower
      pace had helped him notice more. He had returned with fewer photographs than expected and a
      clearer understanding of the people whose work he was showing.
    questions:
      - type: MCQ
        prompt: Why does Mrs Lan turn away?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
