          - Adam must not block customers.
          - The photograph must show no fruit.
          - Adam must finish the entire course first.
        answer: Adam must not block customers.
        explanationVi: Người bán đồng ý nếu Adam không cản khách mua hàng.
      - type: MCQ
        prompt: How does asking permission affect Adam’s work?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - It helps him pay closer attention despite taking longer.
