  - slug: repair-lessons-on-saturday-mornings
    title: Repair Lessons on Saturday Mornings
    titleVi: Những buổi học sửa đồ sáng thứ Bảy
    topic: education
    estimatedMinutes: 7
    source: Sprout original
    glossary: []
    body: >-
      Every Saturday morning, Mr Son opened the back room of his repair shop to local teenagers. The
      room was small, with four workbenches and a cupboard of hand tools. He had started the
      sessions after a student asked him to fix a schoolbag zip and then stayed to watch how he did
      it.


      The first rule was that learners would begin with simple objects. Mr Son kept electrical
      repairs for trained adults and chose items such as loose chair legs, torn bags and bicycle
      baskets. He wanted the teenagers to learn how to observe a problem before using a tool. At
      each bench, they wrote down what was wrong and what they thought might have caused it.


      During the third session, a group brought a wooden drawer that would not close properly. They
      immediately suggested cutting a piece from its side. Mr Son asked them to examine the runners
      first. One screw had become loose, leaving a runner at an angle. Tightening it allowed the
      drawer to close again without cutting any wood.


      Not every repair succeeded. A badly cracked plastic box broke again during a test. The group
      recorded what they had tried and why they would not return it as repaired. Mr Son said an
      honest explanation was part of the job, even when it disappointed the owner.


      By the end of the term, the teenagers had repaired twenty-three objects. They displayed
      before-and-after photographs at school, but also included the cracked box. Their teacher liked
      that choice. The exhibition showed useful skills and the limits of those skills, rather than
      suggesting that every damaged object could be saved.
    questions:
      - type: MCQ
        prompt: What does Mr Son want learners to do first?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - Buy the newest tool
          - Observe the problem carefully
          - Cut away damaged material
          - Promise a successful repair
        answer: Observe the problem carefully
        explanationVi: Ông muốn học sinh xem xét lỗi và nguyên nhân trước khi dùng dụng cụ.
      - type: MCQ
        prompt: What solves the drawer problem?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - Painting the cupboard
          - Buying another drawer
          - Tightening a loose screw
          - Cutting the drawer’s side
        answer: Tightening a loose screw
        explanationVi: Siết vít giúp thanh trượt về đúng vị trí và ngăn kéo đóng lại được.
      - type: MCQ
        prompt: Why include the cracked box in the exhibition?
        promptVi: Chọn đáp án đúng theo bài đọc.
        options:
          - To show that repair has limits
          - To advertise the box as repaired
          - To hide the successful repairs
          - To blame its owner
        answer: To show that repair has limits
        explanationVi: Chiếc hộp cho thấy có những đồ không thể sửa bền và cần nói rõ điều đó.
      - type: TRUE_FALSE
        prompt: Is this statement true or false according to the passage?
        promptVi: Nhận định này đúng hay sai theo bài đọc?
        statement: Electrical repairs are kept for trained adults.
        answer: true
        explanationVi: Các việc sửa điện được giao cho người lớn đã được đào tạo.
      - type: TRUE_FALSE
        prompt: Is this statement true or false according to the passage?
        promptVi: Nhận định này đúng hay sai theo bài đọc?
        statement: The teenagers return the cracked box as successfully repaired.
        answer: false
        explanationVi: Họ ghi lý do không thể coi chiếc hộp là đã sửa xong.
      - type: SHORT_ANSWER
        prompt: How many workbenches are in the room?
        promptVi: Trả lời ngắn bằng tiếng Anh, dùng từ trong bài đọc.
        accept:
          - four
          - "4"
        explanationVi: Phòng có bốn bàn làm việc.
      - type: SHORT_ANSWER
        prompt: What part of a schoolbag first interested a student? Write one word.
        promptVi: Trả lời ngắn bằng tiếng Anh, dùng từ trong bài đọc.
        accept:
          - zip
        explanationVi: Học sinh nhờ sửa khóa kéo của cặp.
      - type: SHORT_ANSWER
        prompt: How many objects have the teenagers repaired by the end of term?
        promptVi: Trả lời ngắn bằng tiếng Anh, dùng từ trong bài đọc.
        accept:
