          - She cannot see the camera.
          - She does not want a close photograph taken without permission.
          - She is waiting for Adam’s teacher.
        answer: She does not want a close photograph taken without permission.
        explanationVi: Bà Lan không thích người lạ chụp cận mặt khi chưa hỏi.
      - type: MCQ
