  - slug: rethinking-a-charity-run-route
    title: Rethinking a Charity Run Route
    titleVi: Xem xét lại lộ trình cuộc đua từ thiện
    topic: daily-life
    estimatedMinutes: 4
    source: Sprout original
    glossary:
      - term: bottleneck
        definitionVi: nút cổ chai, điểm tắc nghẽn giao thông
      - term: reroute
        definitionVi: đổi lộ trình, chuyển hướng đường đi
    body: >-
      Organising the annual Maple City Charity Run always requires careful planning, but this year's
      committee faced an unexpected challenge regarding the main course. Initially, the race
      directors mapped a five-kilometer path that looped through Oak Street and past the old market
      square. They believed this scenic route would attract more spectators and provide plenty of
      space for runners. However, a group of local volunteers and residents raised serious concerns
      after walking the proposed path during a busy Saturday morning simulation.


      During the test run, participants quickly discovered major bottlenecks. The narrow pavement
      near the historic bakeries could not safely accommodate both heavy weekend foot traffic and
      hundreds of fast-moving runners. Furthermore, delivery vans regularly blocked the loading zone
      on Oak Street around nine o'clock, creating a dangerous obstacle for anyone trying to maintain
      a steady pace. Residents also worried that closing the market square would completely trap
      local shop owners and shoppers, cutting off access to essential parking spaces.


      Listening closely to this valuable feedback, the planning committee decided to make a swift
      adjustment. They collaborated with the city council to reroute the second half of the race.
      Instead of turning down Oak Street, the updated path now guides participants north along River
      Road, passing through the quieter Green Park before rejoining the final straightaway.


      River Road offers wider lanes, fewer morning commercial deliveries, and ample room for water
      stations. This thoughtful revision prevents congestion and keeps local businesses happy while
      still maintaining the exact same total distance for the competitors. Registration numbers have
      already reached a record high, although organisers cannot attribute that increase to the route
      change alone. They plan to record delays and ask local businesses for feedback after the
      event.
    questions:
      - type: MCQ
        prompt: What was the original plan for the race's path?
        promptVi: Kế hoạch ban đầu cho đường chạy của cuộc đua là gì?
        options:
          - North along River Road and through Green Park
          - Through Oak Street and past the old market square
          - Around the industrial estate and the central station
          - Straight down the riverside avenue and the sports complex
        answer: Through Oak Street and past the old market square
        explanationVi: Đoạn văn nêu rõ ban đầu các giám đốc cuộc đua đã vạch ra con đường đi qua phố Oak và
          qua quảng trường chợ cũ ('looped through Oak Street and past the old market square').
      - type: MCQ
        prompt: Why did volunteers and residents raise concerns about the original route?
        promptVi: Tại sao tình nguyện viên và cư dân lại nêu lên lo ngại về lộ trình ban đầu?
        options:
          - It was too short for a proper five-kilometer race
          - It lacked enough water stations for the runners
          - It caused bottlenecks near bakeries and delivery blocks on Saturday mornings
          - It crossed private property without the owner's permission
        answer: It caused bottlenecks near bakeries and delivery blocks on Saturday mornings
        explanationVi: Đoạn văn giải thích rằng con đường gây ra tắc nghẽn gần các tiệm bánh và các phương
          tiện giao hàng vào sáng thứ Bảy ('bottlenecks near the historic bakeries... delivery vans
          regularly blocked...').
      - type: MCQ
        prompt: What time of day did delivery vans regularly block the loading zone on Oak Street?
        promptVi: Vào thời gian nào trong ngày xe giao hàng thường xuyên chặn khu vực bốc dỡ hàng trên phố
          Oak?
        options:
          - Late in the afternoon
          - Around seven o'clock
          - Around midday
          - Around nine o'clock
        answer: Around nine o'clock
        explanationVi: Bài đọc chỉ rõ xe giao hàng thường xuyên chặn khu vực bốc dỡ vào khoảng chín giờ
          ('around nine o'clock').
      - type: MCQ
        prompt: Where does the updated path guide participants instead of Oak Street?
        promptVi: Lộ trình cập nhật hướng dẫn người tham gia đi đâu thay vì phố Oak?
        options:
          - North along River Road
          - South toward the harbour
          - East past the railway station
          - West through the industrial park
        answer: North along River Road
        explanationVi: Đoạn văn nêu rằng đường đi mới hướng dẫn người tham gia đi về phía bắc dọc theo đường
          River ('guides participants north along River Road').
      - type: TRUE_FALSE
        prompt: The planning committee collaborated with the city council to reroute the second half of the
          race.
        promptVi: Ban tổ chức đã phối hợp với hội đồng thành phố để đổi lộ trình nửa sau của cuộc đua.
        answer: true
        explanationVi: Bài đọc xác nhận ban tổ chức phối hợp với hội đồng thành phố để đổi lộ trình nửa sau
          cuộc đua.
        statement: The planning committee collaborated with the city council to reroute the second half of
          the race.
      - type: TRUE_FALSE
        prompt: The updated route changes the total distance of the charity run for competitors.
        promptVi: Lộ trình mới thay đổi tổng quãng đường của cuộc đua từ thiện đối với các vận động viên.
        answer: false
        explanationVi: Bài đọc khẳng định lộ trình mới vẫn giữ nguyên tổng quãng đường ('maintaining the
          exact same total distance').
        statement: The updated route changes the total distance of the charity run for competitors.
      - type: SHORT_ANSWER
        prompt: What park does the updated path pass through? (Name the park, exactly 1-2 words)
        promptVi: Đường chạy mới đi qua công viên nào? (Nêu tên công viên, chính xác 1-2 từ)
        accept:
          - Green Park
        explanationVi: Đoạn văn nêu rõ đường chạy đi qua Green Park ('passing through the quieter Green Park').
      - type: SHORT_ANSWER
        prompt: What is the total race distance after the route change? Give a number and unit.
        promptVi: Sau khi đổi lộ trình, tổng quãng đường chạy là bao nhiêu? Viết số và đơn vị.
        accept:
          - five kilometers
          - five kilometres
          - 5 kilometers
          - 5 kilometres
          - 5 km
          - five km
        explanationVi: Đường chạy ban đầu dài five kilometers và phần cuối bài nói lộ trình mới giữ nguyên
          tổng quãng đường.
