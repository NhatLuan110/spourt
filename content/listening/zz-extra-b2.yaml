          những sinh viên có động lực tương tự.
      - speaker: Dr. Helen Vance
        text: Agreed completely. We should match mentees with non-mentored peers who share identical entry
          grades and historical attendance patterns from previous academic terms.
        vi: Hoàn toàn đồng ý. Chúng ta nên ghép đôi các sinh viên được cố vấn với những bạn đồng trang lứa
          không được cố vấn nhưng có điểm đầu vào và xu hướng chuyên cần lịch sử giống hệt nhau từ
          các học kỳ trước.
      - speaker: Mark Davies
        text: That will give us a far more accurate baseline. I can restructure the evaluation metrics by
