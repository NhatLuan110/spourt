  - slug: planning-an-accessible-museum-exhibition
    title: Planning an Accessible Museum Exhibition
    titleVi: Lập kế hoạch cho một triển lãm bảo tàng dễ tiếp cận
    topic: education
    accent: US
    format: dialogue
    speakerCount: 2
    glossary: []
    segments:
      - speaker: Sarah
        text: David, we need to review the layout plans for our upcoming modern art exhibition to ensure
          full accessibility for everyone.
        vi: David, chúng ta cần xem xét các bản vẽ bố trí cho triển lãm nghệ thuật hiện đại sắp tới để đảm
          bảo khả năng tiếp cận đầy đủ cho mọi người.
      - speaker: David
        text: Thanks for scheduling this, Sarah. I checked the current blueprints, and honestly, the spacing
          between display pedestals is far too narrow for wheelchairs.
        vi: Cảm ơn vì đã sắp xếp việc này, Sarah. Tôi đã kiểm tra bản thiết kế hiện tại, và thành thật mà
          nói, khoảng cách giữa các bục trưng bày quá hẹp đối với xe lăn.
      - speaker: Sarah
        text: I was afraid you might say that, but the gallery space is quite limited, and we have nearly
          eighty distinct pieces to exhibit.
        vi: Tôi đã sợ bạn sẽ nói thế, nhưng không gian phòng trưng bày khá hạn chế và chúng ta có gần tám
          mươi tác phẩm riêng biệt để trưng bày.
      - speaker: David
        text: I recognize space is at a premium, but compliance with disability standards isn't optional; we
          must widen those main pathways.
        vi: Tôi nhận thấy không gian rất quý giá, nhưng việc tuân thủ các tiêu chuẩn người khuyết tật không
          phải là tùy chọn; chúng ta phải mở rộng các lối đi chính đó.
      - speaker: Sarah
        text: Fair enough. If we remove the central sculpture installation, that should give us the extra
          clearance we need without dropping too many artworks.
        vi: Được rồi. Nếu chúng ta gỡ bỏ cụm tác phẩm điêu khắc ở trung tâm, điều đó sẽ mang lại cho chúng
          ta khoảng không gian bổ sung cần thiết mà không phải loại bỏ quá nhiều tác phẩm nghệ
          thuật.
      - speaker: David
        text: That compromise preserves the core collection nicely. What about the informational plaques and
          wall texts? Are they mounted at a proper height?
        vi: Thỏa hiệp đó giữ lại bộ sưu tập cốt lõi rất tốt. Còn về các bảng thông tin và văn bản trên tường
          thì sao? Chúng có được gắn ở độ cao phù hợp không?
      - speaker: Sarah
        text: They are currently at standard eye level, which I thought was correct, though I realize now it
          might exclude children and seated visitors.
        vi: Chúng hiện đang ở tầm mắt tiêu chuẩn, điều mà tôi nghĩ là đúng, mặc dù bây giờ tôi nhận ra nó có
          thể loại trừ trẻ em và khách tham quan ngồi xe lăn.
      - speaker: David
        text: Exactly. We should lower them slightly and also provide high-contrast large print versions for
          visually impaired attendees near every major display.
        vi: Đúng vậy. Chúng ta nên hạ chúng xuống một chút, đồng thời đặt các bản chữ lớn có độ tương phản
          cao gần mỗi khu trưng bày chính để hỗ trợ khách có thị lực kém.
      - speaker: Sarah
        text: That makes complete sense. We can print those booklets in-house to keep within our very tight
          department budget constraints.
        vi: Điều đó hoàn toàn có lý. Chúng ta có thể tự in những cuốn sách nhỏ đó trong nội bộ để nằm trong
          hạn mức ngân sách phòng ban rất chặt chẽ của chúng ta.
      - speaker: David
        text: Excellent. Finally, have we arranged sign language interpretation for the opening night gala
          and the weekend guided tours?
        vi: Tuyệt vời. Cuối cùng, chúng ta đã sắp xếp phiên dịch ngôn ngữ ký hiệu cho buổi gala khai mạc và
          các chuyến tham quan có hướng dẫn vào cuối tuần chưa?
      - speaker: Sarah
        text: Not yet, but I can contact the local community translation service tomorrow morning to secure
          two certified interpreters for those events.
        vi: Vẫn chưa, nhưng tôi có thể liên hệ với dịch vụ dịch thuật cộng đồng địa phương vào sáng mai để
          đảm bảo có hai thông dịch viên được chứng nhận cho các sự kiện đó.
      - speaker: David
        text: Wonderful. With those adjustments in place, this exhibition will be genuinely inclusive and
          welcoming to all visitors.
        vi: Tuyệt vời. Với những điều chỉnh đó được áp dụng, triển lãm này sẽ thực sự hòa nhập và chào đón
