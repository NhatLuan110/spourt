cefr: B2
tracks:
  - slug: campus-radio-on-recycling
    title: Campus Radio - Does Our Recycling Actually Work?
    titleVi: Radio trường - Việc phân loại rác của chúng ta có thật sự hiệu quả?
    topic: environment
    accent: US
    format: podcast
    speakerCount: 2
    glossary:
      - recycle
      - recycling
      - landfill
      - contaminate
      - sustainable
      - recyclable
      - conservation
    segments:
      - speaker: Host
        text: "You're listening to Green Hour. This week, a question a listener sent in: does the recycling
          we do on campus actually go anywhere?"
        vi: "Bạn đang nghe Green Hour. Tuần này là câu hỏi của một thính giả gửi tới: rác phân loại trong
          trường có thật sự đi đến đâu không?"
      - speaker: Host
        text: I'm here with Trang, who spent last semester following the bins. Trang, what did you find?
        vi: Cùng tôi hôm nay là Trang, người đã dành cả học kỳ trước để theo dõi các thùng rác. Trang, bạn
          tìm ra điều gì?
      - speaker: Trang
        text: The short answer is yes, but a lot less of it than people assume, and the reason is not the
          one most students guess.
        vi: Câu trả lời ngắn là có, nhưng ít hơn nhiều so với mọi người tưởng, và lý do không phải điều sinh
          viên hay đoán.
      - speaker: Host
        text: Most people would guess the university just throws it all in one truck.
        vi: Phần lớn sẽ đoán là nhà trường đổ tất cả lên cùng một xe.
      - speaker: Trang
        text: That's the myth, and it's not true here. The trucks are separate. The problem happens earlier,
          at the bin itself.
        vi: Đó là điều đồn thổi, và ở đây thì không đúng. Xe tải là riêng biệt. Vấn đề xảy ra sớm hơn, ngay
          tại thùng rác.
      - speaker: Trang
        text: If one person puts a half-full cup of milk tea into the paper bin, the liquid soaks the paper
          around it. That whole bag is then contaminated and goes to landfill.
        vi: Nếu một người bỏ cốc trà sữa còn nửa vào thùng giấy, chất lỏng thấm vào giấy xung quanh. Cả túi
          đó bị nhiễm bẩn và bị đưa ra bãi rác.
      - speaker: Host
        text: So one cup can ruin an entire bag.
        vi: Vậy một cái cốc có thể làm hỏng cả một túi.
      - speaker: Trang
        text: One cup, yes. And in the buildings we sampled, contamination was running at about thirty
          percent, which is roughly the national average and much worse than it needs to be.
        vi: Đúng, một cái cốc. Và ở những toà nhà chúng tôi lấy mẫu, tỷ lệ nhiễm bẩn khoảng ba mươi phần
          trăm, xấp xỉ mức trung bình cả nước và tệ hơn mức đáng lẽ phải có.
      - speaker: Host
        text: What would move that number?
        vi: Điều gì sẽ thay đổi con số đó?
      - speaker: Trang
        text: Honestly, not posters. What worked in the trial was putting a liquid disposal bucket next to
          the bins, so people had somewhere to empty a drink before sorting the cup.
        vi: Thật lòng thì không phải áp phích. Thứ hiệu quả trong đợt thử nghiệm là đặt một xô đổ chất lỏng
          ngay cạnh thùng rác, để người ta có chỗ đổ đồ uống trước khi phân loại cái cốc.
      - speaker: Trang
        text: Contamination in those two buildings dropped to about eleven percent in six weeks. It cost
          almost nothing.
        vi: Tỷ lệ nhiễm bẩn ở hai toà đó giảm còn khoảng mười một phần trăm sau sáu tuần. Chi phí gần như
          bằng không.
      - speaker: Host
        text: Which is a nice reminder that the sustainable answer is often boring and cheap rather than
          clever.
        vi: Đó là một lời nhắc dễ chịu rằng giải pháp bền vững thường nhàm chán và rẻ tiền, chứ không phải
          thông minh.
    dictation:
      - 6
      - 8
      - 11
    questions:
      - type: MCQ
        prompt: What does Trang say is the real cause of the problem?
        options:
          - Contamination at the bin, before collection
          - The university mixing everything into one truck
          - A shortage of recycling plants
          - Students not knowing which bin to use at all
        answer: Contamination at the bin, before collection
        explanationVi: Trang nói xe tải là riêng biệt; vấn đề xảy ra sớm hơn, ngay tại thùng rác, khi rác bị
          nhiễm bẩn.
      - type: MCQ
        prompt: What intervention worked in the trial?
        options:
          - A bucket for emptying liquids next to the bins
          - More posters explaining the rules
          - Fines for students who sort incorrectly
          - Removing the paper bins entirely
        answer: A bucket for emptying liquids next to the bins
        explanationVi: '"putting a liquid disposal bucket next to the bins" — và Trang nói rõ áp phích thì
          không hiệu quả.'
      - type: MCQ
        prompt: What is the host's closing point?
        options:
          - Effective solutions are often cheap and unexciting
          - Recycling is not worth the effort
          - Students should be taught more about conservation
          - The national average is a good target
        answer: Effective solutions are often cheap and unexciting
        explanationVi: '"the sustainable answer is often boring and cheap rather than clever".'
      - type: TRUE_FALSE
        prompt: Đúng hay sai theo đoạn hội thoại?
        statement: The university does put recyclables and general waste in the same truck.
        answer: false
        explanationVi: Sai. Trang gọi đó là lời đồn và nói "The trucks are separate".
      - type: TRUE_FALSE
        prompt: Đúng hay sai theo đoạn hội thoại?
        statement: The campus contamination rate was close to the national average.
        answer: true
        explanationVi: Đúng. Khoảng ba mươi phần trăm, "roughly the national average".
      - type: SHORT_ANSWER
        prompt: What did contamination fall to in the trial buildings?
        accept:
          - eleven percent
          - 11%
          - 11 percent
          - about eleven percent
          - eleven per cent
        explanationVi: '"dropped to about eleven percent in six weeks".'
      - type: SHORT_ANSWER
        prompt: How long did the trial take to produce that result?
        accept:
          - six weeks
          - 6 weeks
          - six
        explanationVi: '"in six weeks" — sáu tuần.'
  - slug: the-first-five-minutes-of-an-interview
    title: The First Five Minutes of an Interview
    titleVi: Năm phút đầu của một buổi phỏng vấn
    topic: work
    accent: UK
    format: interview
    speakerCount: 2
    glossary:
      - recruit
      - applicant
      - promotion
      - freelance
      - startup
      - negotiate
      - application
    segments:
      - speaker: Interviewer
        text: Thanks for coming in. Before we start properly, how much do you already know about what the
          team does?
        vi: Cảm ơn bạn đã đến. Trước khi bắt đầu chính thức, bạn đã biết gì về công việc của nhóm này rồi?
      - speaker: Candidate
        text: A reasonable amount, I think. You build the payments layer that the rest of the product sits
          on, and you moved off a third-party provider last year.
        vi: Tôi nghĩ là khá nhiều. Nhóm xây tầng thanh toán mà cả sản phẩm dựa lên, và năm ngoái các anh chị
          đã chuyển khỏi nhà cung cấp bên thứ ba.
      - speaker: Interviewer
        text: That's right. What made you look at us rather than staying freelance? Your last three years
          have been independent work.
        vi: Đúng vậy. Điều gì khiến bạn nhìn về phía chúng tôi thay vì tiếp tục làm tự do? Ba năm qua bạn
          làm độc lập mà.
      - speaker: Candidate
        text: Honestly, the range of problems. Freelance work paid well and I chose my hours, but each
          project ended before anything got difficult in an interesting way.
        vi: Thật lòng là vì phạm vi vấn đề. Làm tự do trả tiền tốt và tôi chọn được giờ giấc, nhưng dự án
          nào cũng kết thúc trước khi có gì khó theo kiểu thú vị.
      - speaker: Candidate
        text: I'd hand over a working system and never see what it looked like after two years of real
          traffic.
        vi: Tôi bàn giao một hệ thống chạy được rồi không bao giờ thấy nó ra sao sau hai năm chịu lưu lượng
          thật.
      - speaker: Interviewer
        text: That's a fair answer, and a more useful one than most. Let me push on it though. Small
          startups also end quickly, sometimes faster than a contract.
        vi: Đó là câu trả lời hợp lý, và hữu ích hơn phần lớn câu khác. Nhưng để tôi hỏi tới. Công ty khởi
          nghiệp nhỏ cũng kết thúc nhanh, đôi khi còn nhanh hơn một hợp đồng.
      - speaker: Candidate
        text: They do. That's why I looked at the engineering blog before I applied, and at how long the
          people writing it had been here.
        vi: Đúng thế. Vì vậy trước khi nộp đơn tôi đã đọc blog kỹ thuật, và xem những người viết nó đã ở đây
          bao lâu.
      - speaker: Interviewer
        text: And what did that tell you?
        vi: Và điều đó nói lên gì?
      - speaker: Candidate
        text: That the average was about four years, which for a company your size is unusual. People stay
          when the work keeps changing under them.
        vi: Rằng trung bình khoảng bốn năm, một con số bất thường với công ty quy mô như anh chị. Người ta ở
          lại khi công việc liên tục thay đổi bên dưới họ.
      - speaker: Interviewer
        text: We'll come back to that at the end, because I suspect you'll have better questions than we
          usually get. Shall we start with the technical part?
        vi: Cuối buổi ta sẽ quay lại chuyện đó, vì tôi nghĩ bạn sẽ có những câu hỏi hay hơn thường lệ. Bắt
          đầu phần kỹ thuật nhé?
    dictation:
      - 4
      - 7
      - 9
    questions:
      - type: MCQ
        prompt: What reason does the candidate give for leaving freelance work?
        options:
          - Projects ended before the problems became interesting
          - The pay was too low
          - Clients did not respect their working hours
          - They could not find enough contracts
        answer: Projects ended before the problems became interesting
        explanationVi: Ứng viên nói tiền tốt và giờ giấc tự chủ, nhưng dự án luôn kết thúc trước khi có gì
          khó theo kiểu thú vị.
      - type: MCQ
        prompt: How did the candidate check whether the company was stable?
        options:
          - They read the engineering blog and looked at how long authors had stayed
          - They asked a recruiter for financial reports
          - They spoke to a former employee
          - They compared salaries with competitors
        answer: They read the engineering blog and looked at how long authors had stayed
        explanationVi: '"I looked at the engineering blog before I applied, and at how long the people
          writing it had been here."'
      - type: MCQ
        prompt: What does the interviewer suggest at the end?
        options:
          - Moving on to the technical part and returning to the topic later
          - Ending the interview early
          - Bringing in another interviewer
          - Discussing salary immediately
        answer: Moving on to the technical part and returning to the topic later
        explanationVi: "\"We'll come back to that at the end ... Shall we start with the technical part?\""
      - type: TRUE_FALSE
        prompt: Đúng hay sai theo đoạn phỏng vấn?
        statement: The candidate says freelance work paid badly.
        answer: false
        explanationVi: Sai. Ứng viên nói "Freelance work paid well" — vấn đề là phạm vi công việc, không
          phải thu nhập.
      - type: TRUE_FALSE
        prompt: Đúng hay sai theo đoạn phỏng vấn?
        statement: The interviewer challenges the candidate's reasoning rather than accepting it.
        answer: true
        explanationVi: Đúng. "Let me push on it though" — người phỏng vấn phản biện bằng việc chỉ ra startup
          cũng kết thúc nhanh.
      - type: SHORT_ANSWER
        prompt: What was the average time the blog authors had stayed at the company?
        accept:
          - four years
          - about four years
          - 4 years
          - four
        explanationVi: '"the average was about four years".'
  - slug: why-we-forget-what-we-learn
    title: Why We Forget What We Learn
    titleVi: Vì sao ta quên những gì đã học
    topic: education
    accent: UK
    format: podcast
    speakerCount: 1
    glossary:
      - revision
      - memorise
      - research
      - analyse
    segments:
      - speaker: Host
        text: If you have ever studied hard for an exam and forgotten everything a week later, you are not
          lazy. You are normal.
        vi: Nếu bạn từng học rất chăm cho một kỳ thi rồi một tuần sau quên sạch, bạn không lười đâu. Bạn
          bình thường thôi.
      - speaker: Host
        text: In the eighteen eighties a German researcher named Hermann Ebbinghaus tested this on himself.
        vi: Vào những năm 1880, một nhà nghiên cứu người Đức tên Hermann Ebbinghaus đã tự thử nghiệm điều
          này trên chính mình.
      - speaker: Host
        text: He memorised lists of meaningless syllables, then measured how much he could recall over the
          following days.
        vi: Ông học thuộc các danh sách âm tiết vô nghĩa, rồi đo xem những ngày sau còn nhớ được bao nhiêu.
      - speaker: Host
        text: What he found is now called the forgetting curve, and it is steeper than most people expect.
        vi: Điều ông tìm ra nay gọi là đường cong quên lãng, và nó dốc hơn hầu hết mọi người tưởng.
      - speaker: Host
        text: Within twenty-four hours he had lost roughly half of what he learned. Within a week, close to
          eighty percent.
        vi: Trong vòng hai mươi bốn giờ, ông mất khoảng một nửa những gì đã học. Trong một tuần, gần tám
          mươi phần trăm.
      - speaker: Host
        text: But there was a second finding, and it matters more than the first.
        vi: Nhưng còn một phát hiện thứ hai, và nó quan trọng hơn phát hiện đầu.
      - speaker: Host
        text: Each time he reviewed the same list, the curve became flatter. Forgetting slowed down.
        vi: Mỗi lần ông ôn lại cùng danh sách đó, đường cong lại thoải ra. Việc quên chậm lại.
      - speaker: Host
        text: The lesson is not that repetition works. Everybody knows that. It is that the timing of
          repetition matters more than the amount.
        vi: Bài học không phải là lặp lại thì có ích. Ai cũng biết rồi. Mà là thời điểm lặp lại quan trọng
          hơn số lần lặp.
      - speaker: Host
        text: Reviewing something just as you are about to forget it is far more effective than reviewing it
          while you still remember it well.
        vi: Ôn lại đúng lúc sắp quên hiệu quả hơn nhiều so với ôn khi vẫn còn nhớ rõ.
      - speaker: Host
        text: Which is an uncomfortable conclusion, because it means the study session that feels easiest is
          usually the one teaching you least.
        vi: Đó là một kết luận khó chịu, vì nó có nghĩa buổi học nào thấy dễ nhất thường là buổi dạy bạn
          được ít nhất.
    dictation:
      - 5
      - 7
      - 9
    questions:
      - type: MCQ
        prompt: What did Ebbinghaus memorise in his experiment?
        options:
          - Lists of meaningless syllables
          - Poems in German
          - Lists of foreign words
          - Mathematical formulas
        answer: Lists of meaningless syllables
        explanationVi: '"He memorised lists of meaningless syllables".'
      - type: MCQ
        prompt: According to the podcast, roughly how much was forgotten within a week?
        options:
          - Eighty percent
          - Half
          - A third
          - Twenty percent
        answer: Eighty percent
        explanationVi: '"Within a week, close to eighty percent." Một nửa là con số của hai mươi bốn giờ đầu.'
      - type: MCQ
        prompt: What does the host say matters most about repetition?
        options:
          - When you repeat, not how much
          - How much you repeat
          - Where you study
          - How long each session is
        answer: When you repeat, not how much
        explanationVi: '"the timing of repetition matters more than the amount".'
      - type: TRUE_FALSE
        prompt: Đúng hay sai theo bài nghe?
        statement: The host says a study session that feels easy is usually the most effective one.
        answer: false
        explanationVi: Ngược lại. Người dẫn nói buổi học thấy dễ nhất thường là buổi dạy được ít nhất.
      - type: TRUE_FALSE
        prompt: Đúng hay sai theo bài nghe?
        statement: Reviewing made the forgetting curve flatter each time.
        answer: true
        explanationVi: '"Each time he reviewed the same list, the curve became flatter."'
      - type: SHORT_ANSWER
        prompt: What is the curve Ebbinghaus discovered called?
        accept:
          - the forgetting curve
          - forgetting curve
        explanationVi: '"What he found is now called the forgetting curve".'
  - slug: negotiating-a-project-deadline
    title: Negotiating a Project Deadline
    titleVi: Thương lượng hạn chót dự án
    topic: work
    accent: UK
    format: dialogue
    speakerCount: 2
    glossary: []
    segments:
      - speaker: Mark
        text: Sarah, do you have a few minutes to discuss the timeline for the Apex marketing campaign?
        vi: Sarah, bạn có vài phút để thảo luận về tiến độ của chiến dịch tiếp thị Apex không?
      - speaker: Sarah
        text: Of course, Mark. I was actually going to bring that up. We need the final deliverables by this
          Friday.
        vi: Chắc chắn rồi, Mark. Tôi thực ra cũng định nhắc đến chuyện đó. Chúng ta cần các sản phẩm bàn
          giao cuối cùng vào thứ Sáu tuần này.
      - speaker: Mark
        text: To be completely honest, Friday is going to be extremely tight for the design team. We ran
          into some unexpected rendering issues yesterday.
        vi: Thành thật mà nói, thứ Sáu sẽ rất gấp đối với đội ngũ thiết kế. Chúng tôi đã gặp một số sự cố
          kết xuất không mong muốn vào ngày hôm qua.
      - speaker: Sarah
        text: I understand technical hiccups happen, but the client explicitly booked the presentation for
          next Monday morning. We cannot push the main meeting back.
        vi: Tôi hiểu là trục trặc kỹ thuật có thể xảy ra, nhưng khách hàng đã đặt lịch thuyết trình vào sáng
          thứ Hai tuần tới một cách rõ ràng. Chúng ta không thể lùi cuộc họp chính lại được.
      - speaker: Mark
        text: What if we deliver the core branding assets by Friday, but leave the secondary social media
          graphics for early next week?
        vi: Thế nếu chúng ta bàn giao các tài sản thương hiệu cốt lõi trước thứ Sáu, nhưng để lại các đồ họa
          mạng xã hội phụ vào đầu tuần tới thì sao?
      - speaker: Sarah
        text: That partially helps, but the client wants to review everything together before the weekend so
          they can prepare their board notes.
        vi: Điều đó giúp ích phần nào, nhưng khách hàng muốn xem xét mọi thứ cùng nhau trước cuối tuần để họ
          có thể chuẩn bị ghi chú cho ban quản trị.
      - speaker: Mark
        text: We could pull in two freelance designers from the London office to speed up the secondary
          graphics tonight. Would that bridge the gap?
        vi: Chúng ta có thể huy động hai nhà thiết kế tự do từ văn phòng Luân Đôn để đẩy nhanh tiến độ đồ
          họa phụ vào tối nay. Điều đó có thu hẹp khoảng cách được không?
      - speaker: Sarah
        text: That would definitely relieve the pressure. Can you guarantee those freelancers will start
          immediately and finish by Thursday evening?
        vi: Điều đó chắc chắn sẽ giảm bớt áp lực. Anh có thể đảm bảo những người làm tự do đó sẽ bắt đầu
          ngay lập tức và hoàn thành trước tối thứ Năm không?
      - speaker: Mark
        text: Yes, I spoke with them this morning. They are available and already familiar with our brand
          guidelines.
        vi: Vâng, tôi đã nói chuyện với họ sáng nay. Họ rảnh và đã quen thuộc với hướng dẫn thương hiệu của
          chúng ta.
      - speaker: Sarah
        text: Alright, if you can secure them by noon today, I will agree to a phased delivery where the
          final review happens at 4 PM on Friday.
        vi: Được thôi, nếu anh có thể tuyển họ trước trưa nay, tôi sẽ đồng ý giao hàng theo từng giai đoạn,
          trong đó buổi đánh giá cuối cùng diễn ra vào lúc 4 giờ chiều thứ Sáu.
      - speaker: Mark
        text: That sounds fair and achievable. I will send over the contracts and briefing notes right away.
        vi: Nghe có vẻ công bằng và có thể đạt được. Tôi sẽ gửi hợp đồng và ghi chú tóm tắt ngay lập tức.
      - speaker: Sarah
        text: Perfect. Let's touch base tomorrow morning to confirm everything is on track.
        vi: Hoàn hảo. Chúng ta hãy liên lạc vào sáng mai để xác nhận mọi thứ vẫn đúng tiến độ.
    dictation:
      - 3
      - 6
      - 9
      - 11
    questions:
      - type: MCQ
        prompt: What is the main deadline issue discussed in the conversation?
        promptVi: Vấn đề hạn chót chính được thảo luận trong cuộc trò chuyện là gì?
        options:
          - A) The client moved the meeting to Wednesday
          - B) The design team faces tight deadlines for Friday
          - C) The London office is closed
          - D) The freelancers quit
        answer: B) The design team faces tight deadlines for Friday
        explanationVi: Đoạn hội thoại nêu rõ Mark cho biết thứ Sáu sẽ rất gấp đối với đội ngũ thiết kế do sự
          cố kỹ thuật.
      - type: MCQ
