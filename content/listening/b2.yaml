        promptVi: Mark đồng ý cập nhật sổ tay vận hành và lưu hành tài liệu trước chiều mai.
        explanationVi: Đúng, Mark khẳng định anh ấy sẽ cập nhật sổ tay và lưu hành tài liệu vào chiều hôm
