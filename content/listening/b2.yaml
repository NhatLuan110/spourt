  - slug: debating-a-car-free-city-centre
    title: Debating a Car-Free City Centre
    titleVi: Tranh luận về khu trung tâm thành phố không có ô tô
    topic: environment
    accent: US
    format: dialogue
    speakerCount: 2
    glossary: []
    segments:
      - speaker: David
        text: Elena, have you looked at the city council's new proposal to make the entire downtown area
          car-free by next year?
        vi: Elena, bạn đã xem đề xuất mới của hội đồng thành phố về việc biến toàn bộ khu vực trung tâm
          thành phố thành khu vực không có ô tô vào năm tới chưa?
      - speaker: Elena
        text: Yes, I have, David. While I support better air quality, I am really concerned about how local
          retail shops will survive without drive-by customers.
        vi: Rồi, David ạ. Mặc dù tôi ủng hộ chất lượng không khí tốt hơn, nhưng tôi thực sự lo lắng về cách
          các cửa hàng bán lẻ địa phương sẽ sống sót nếu không có khách hàng lái xe ghé qua.
      - speaker: David
        text: The council's draft forecast suggests that pedestrian zones could increase local foot traffic
          and spending by up to thirty percent. That is an estimate, rather than a result measured
          here.
        vi: Bản dự báo dự thảo của hội đồng cho rằng khu đi bộ có thể tăng lượng người đi bộ và chi tiêu tại
          địa phương lên tới 30%. Đó là con số ước tính, chưa phải kết quả đo được ở đây.
      - speaker: Elena
        text: That sounds promising in theory, but our public transit network is still limited. I would want
          to see the assumptions behind that forecast.
        vi: Về lý thuyết thì có triển vọng, nhưng mạng lưới giao thông công cộng của chúng ta vẫn hạn chế.
          Tôi muốn xem những giả định làm cơ sở cho dự báo đó.
      - speaker: David
        text: That is a fair point. The council is planning to add ten new electric bus routes and
          subsidized bike-sharing stations before the ban takes effect.
        vi: Đó là một ý kiến hợp lý. Hội đồng đang có kế hoạch bổ sung mười tuyến xe buýt điện mới và các
          trạm chia sẻ xe đạp được trợ giá trước khi lệnh cấm có hiệu lực.
      - speaker: Elena
        text: Ten routes might not be enough for commuters coming from the eastern suburbs. What about
          delivery trucks servicing restaurants and supermarkets?
        vi: Mười tuyến có thể không đủ cho những người đi làm đến từ các vùng ngoại ô phía đông. Còn những
          chiếc xe tải giao hàng phục vụ nhà hàng và siêu thị thì sao?
      - speaker: David
        text: Commercial deliveries would still be permitted during designated early morning hours, between
          four and seven AM.
        vi: Việc giao hàng thương mại vẫn sẽ được phép trong khung giờ sáng sớm được chỉ định, từ bốn đến
          bảy giờ sáng.
      - speaker: Elena
        text: Four to seven is awfully early for small boutique owners to receive stock and manage inventory
          before opening.
        vi: Từ bốn đến bảy giờ là quá sớm để các chủ cửa hàng nhỏ nhận hàng và quản lý kho trước khi mở cửa.
      - speaker: David
        text: Perhaps the window could be extended until nine AM, or restricted loading bays could be
          installed on the outer edges.
        vi: Có lẽ khoảng thời gian này có thể kéo dài đến 9 giờ sáng, hoặc các khu vực bốc dỡ hàng hóa hạn
          chế có thể được lắp đặt ở rìa ngoài.
      - speaker: Elena
        text: Extending it to nine AM would make a huge difference for small businesses. If they make that
          adjustment, I would back the initiative.
        vi: Kéo dài đến 9 giờ sáng sẽ tạo ra sự khác biệt lớn cho các doanh nghiệp nhỏ. Nếu họ điều chỉnh
          đó, tôi sẽ ủng hộ sáng kiến này.
      - speaker: David
        text: Excellent. I am attending the public hearing on Thursday, so I will voice support for that
          specific compromise.
        vi: Tuyệt vời. Tôi sẽ tham dự phiên điều trần công khai vào thứ Năm, vì vậy tôi sẽ lên tiếng ủng hộ
          thỏa hiệp cụ thể đó.
      - speaker: Elena
        text: Thank you, David. Let's write a joint letter to the council member representing our district
          as well.
        vi: Cảm ơn bạn, David. Chúng ta cũng hãy viết một bức thư chung gửi cho ủy viên hội đồng đại diện
          cho quận của chúng ta nhé.
    dictation:
      - 2
      - 5
      - 8
      - 10
    questions:
      - type: MCQ
        prompt: What is the main topic of discussion between David and Elena?
        promptVi: Chủ đề thảo luận chính giữa David và Elena là gì?
        options:
          - A) Building a new subway station
          - B) Making the downtown area car-free
          - C) Increasing parking fees
          - D) Opening a new park
        answer: B) Making the downtown area car-free
        explanationVi: Cuộc thảo luận tập trung vào đề xuất của hội đồng thành phố về việc biến toàn bộ khu
          vực trung tâm thành khu vực không có ô tô.
      - type: MCQ
        prompt: What maximum increase in foot traffic and spending does the council's draft forecast
          suggest?
        promptVi: Bản dự báo dự thảo của hội đồng ước tính lượng người đi bộ và chi tiêu có thể tăng tối đa
          bao nhiêu?
        options:
          - A) Ten percent
          - B) Twenty percent
          - C) Thirty percent
          - D) Fifty percent
        answer: C) Thirty percent
        explanationVi: David nhắc mức tăng ước tính tối đa là 30%, đồng thời nói rõ đây chưa phải kết quả
          được đo tại địa phương.
      - type: MCQ
        prompt: How many new electric bus routes are planned by the council?
        promptVi: Hội đồng thành phố lên kế hoạch bổ sung bao nhiêu tuyến xe buýt điện mới?
        options:
          - A) Five
          - B) Ten
          - C) Fifteen
          - D) Twenty
        answer: B) Ten
        explanationVi: David cho biết hội đồng đang lên kế hoạch bổ sung mười tuyến xe buýt điện mới.
      - type: MCQ
        prompt: Which proposed change to delivery hours would make Elena support the plan?
        promptVi: Thay đổi nào về giờ giao hàng sẽ khiến Elena ủng hộ kế hoạch?
        options:
          - A) Extend delivery hours until 9 AM
          - B) Allow deliveries all day
          - C) Move deliveries to the evening
          - D) Restrict deliveries to weekends
        answer: A) Extend delivery hours until 9 AM
        explanationVi: Elena đề xuất kéo dài thời gian giao hàng đến 9 giờ sáng để giúp ích cho các doanh
          nghiệp nhỏ.
      - type: TRUE_FALSE
        prompt: Elena completely opposes any form of pedestrian zone in the city.
        promptVi: Elena hoàn toàn phản đối mọi hình thức khu vực dành cho người đi bộ trong thành phố.
        answer: false
        explanationVi: Elena bày tỏ sự ủng hộ đối với chất lượng không khí tốt hơn nhưng lo lắng về các cửa
          hàng bán lẻ và việc giao hàng.
        statement: Elena completely opposes any form of pedestrian zone in the city.
      - type: TRUE_FALSE
        prompt: David plans to attend the public hearing on Thursday.
        promptVi: David dự định tham dự phiên điều trần công khai vào thứ Năm.
        answer: true
        explanationVi: David xác nhận anh sẽ tham dự phiên điều trần công khai vào thứ Năm.
        statement: David plans to attend the public hearing on Thursday.
      - type: SHORT_ANSWER
        prompt: From which part of the city do the commuters Elena mentions travel? Give the two-word
          phrase.
        promptVi: Những người đi làm mà Elena nhắc đến xuất phát từ khu vực nào của thành phố? Viết cụm hai
          từ.
        accept:
          - eastern suburbs
          - the eastern suburbs
        explanationVi: Elena lo mười tuyến mới chưa đủ cho người đi làm từ eastern suburbs, tức vùng ngoại ô
          phía đông.
      - type: SHORT_ANSWER
        prompt: On what day is the public hearing taking place?
        promptVi: Phiên điều trần công khai diễn ra vào ngày nào trong tuần?
        accept:
          - Thursday
          - on Thursday
        explanationVi: David nói anh sẽ tham dự phiên điều trần công khai vào thứ Năm.
  - slug: discussing-digital-privacy-at-work
    title: Discussing Digital Privacy at Work
    titleVi: Thảo luận về quyền riêng tư kỹ thuật số tại nơi làm việc
    topic: technology
    accent: US
    format: dialogue
    speakerCount: 2
    glossary: []
    segments:
      - speaker: Mark
        text: Have you seen the new monitoring software the company is installing on our work laptops
          tomorrow?
        vi: Bạn đã thấy phần mềm giám sát mới mà công ty cài đặt trên máy tính xách tay công việc của chúng
          ta vào ngày mai chưa?
      - speaker: Sarah
        text: Yes, I got the memo this morning. Honestly, I'm quite concerned about how much data they will
          be collecting on our daily activity.
        vi: Rồi, tôi nhận được thông báo sáng nay. Thành thật mà nói, tôi khá lo lắng về lượng dữ liệu họ sẽ
          thu thập về hoạt động hàng ngày của chúng ta.
      - speaker: Mark
        text: Management claims it is strictly for productivity analysis and security enhancement, but it
          feels like an overreach into personal boundaries.
        vi: Ban quản lý tuyên bố nó hoàn toàn dùng để phân tích năng suất và tăng cường bảo mật, nhưng có
          cảm giác như sự vượt quyền xâm phạm ranh giới cá nhân.
      - speaker: Sarah
        text: Exactly. While I understand they need to protect proprietary information, logging keystrokes
          and taking random screenshots goes far beyond standard network security.
        vi: Chính xác. Mặc dù tôi hiểu họ cần bảo vệ thông tin độc quyền, việc ghi lại thao tác phím và chụp
          ảnh màn hình ngẫu nhiên vượt xa bảo mật mạng tiêu chuẩn.
      - speaker: Mark
        text: On the other hand, the IT director mentioned during the briefing that personal browsing during
          work hours has increased significantly this quarter.
        vi: Mặt khác, giám đốc CNTT nói trong buổi trao đổi rằng việc lướt web cho mục đích cá nhân trong
          giờ làm đã tăng đáng kể trong quý này.
      - speaker: Sarah
        text: That might be true for some departments, but penalizing everyone for a few exceptions is
          unfair. What about checking a personal banking app during a break?
        vi: Điều đó có thể đúng với một số phòng ban, nhưng việc phạt tất cả mọi người vì một vài ngoại lệ
          là không công bằng. Còn việc kiểm tra ứng dụng ngân hàng cá nhân trong giờ nghỉ thì sao?
      - speaker: Mark
        text: The policy document states that personal tabs can be kept open as long as they don't interfere
          with core tasks, though the software itself doesn't automatically filter out private data.
        vi: Tài liệu chính sách nêu rõ rằng các tab cá nhân có thể được mở miễn là chúng không cản trở các
          nhiệm vụ cốt lõi, mặc dù bản thân phần mềm không tự động lọc dữ liệu riêng tư.
      - speaker: Sarah
        text: That lack of automated filtering is precisely my main reservation. It creates a massive
          security liability on our end if private credentials get captured.
        vi: Việc thiếu bộ lọc tự động chính là điều tôi băn khoăn nhất. Nếu thông tin đăng nhập cá nhân bị
          ghi lại, chúng ta sẽ đối mặt với rủi ro bảo mật rất lớn.
      - speaker: Mark
        text: We do have the option to log out of personal accounts entirely and use our smartphones for any
          urgent private matters during the day.
        vi: Chúng ta có tùy chọn đăng xuất hoàn toàn khỏi các tài khoản cá nhân và sử dụng điện thoại thông
          minh cho bất kỳ việc riêng khẩn cấp nào trong ngày.
      - speaker: Sarah
        text: True, but relying on a workaround shouldn't be necessary if the core monitoring tool was
          designed with employee privacy in mind.
        vi: Đúng vậy, nhưng việc dựa vào giải pháp tạm thời lẽ ra không cần thiết nếu công cụ giám sát chính
          được thiết kế với sự tôn trọng quyền riêng tư của nhân viên.
      - speaker: Mark
        text: Perhaps we can draft a formal request asking HR to clarify how long this collected data is
          retained before deletion.
        vi: Có lẽ chúng ta có thể soạn thảo một yêu cầu chính thức đề nghị nhân sự làm rõ thời gian lưu giữ
          dữ liệu được thu thập này trước khi xóa.
      - speaker: Sarah
        text: That sounds like a constructive step forward. Let's write up a shared proposal and discuss it
          with the team leads this afternoon.
        vi: Nghe có vẻ là một bước tiến mang tính xây dựng. Hãy cùng viết một bản đề xuất chung và thảo luận
          với các trưởng nhóm vào chiều nay.
    dictation:
      - 2
      - 4
      - 8
      - 12
    questions:
      - type: MCQ
        prompt: When is the company installing the new monitoring software?
        promptVi: Công ty lắp đặt phần mềm giám sát mới khi nào?
        options:
          - Next week
          - Tomorrow
          - This morning
          - Next month
        answer: Tomorrow
        explanationVi: Trong đoạn đầu tiên, Mark hỏi Sarah về phần mềm giám sát mà công ty sẽ cài đặt vào
          ngày mai ('tomorrow').
      - type: MCQ
        prompt: What reason does management give for installing the software?
        promptVi: Ban quản lý đưa ra lý do gì để cài đặt phần mềm?
        options:
          - Cost reduction and efficiency
          - Productivity analysis and security enhancement
          - Employee performance tracking for bonuses
          - Remote work compliance
        answer: Productivity analysis and security enhancement
        explanationVi: Mark nêu rõ ban quản lý tuyên bố phần mềm dùng cho việc phân tích năng suất và tăng
          cường bảo mật ('productivity analysis and security enhancement').
      - type: MCQ
        prompt: According to the IT director, what has increased significantly this quarter?
        promptVi: Theo giám đốc CNTT, điều gì đã tăng lên đáng kể trong quý này?
        options:
          - Personal browsing during work hours
          - Overtime hours requested by staff
          - Software license complaints
          - Network security breaches
        answer: Personal browsing during work hours
        explanationVi: Mark đề cập rằng giám đốc CNTT lưu ý việc lướt web cá nhân trong giờ làm việc đã tăng
          đáng kể trong quý này.
      - type: MCQ
        prompt: What final action do Mark and Sarah decide to take?
        promptVi: Hành động cuối cùng nào mà Mark và Sarah quyết định thực hiện?
        options:
          - Resign from their positions
          - Ignore the software installation
          - Write a shared proposal for team leads
          - File a lawsuit against HR
        answer: Write a shared proposal for team leads
        explanationVi: Ở lượt cuối, Sarah đề nghị viết một bản đề xuất chung và thảo luận với các trưởng
          nhóm vào chiều nay.
      - type: TRUE_FALSE
        prompt: Sarah received the memo regarding the monitoring software this morning.
        promptVi: Sarah đã nhận được thông báo về phần mềm giám sát vào sáng nay.
        answer: true
        explanationVi: Sarah xác nhận cô đã nhận được thông báo vào sáng nay ('memo this morning') ở lượt thứ hai.
        statement: Sarah received the memo regarding the monitoring software this morning.
      - type: TRUE_FALSE
        prompt: The monitoring software automatically filters out private data to protect employees.
        promptVi: Phần mềm giám sát tự động lọc dữ liệu riêng tư để bảo vệ nhân viên.
        answer: false
        explanationVi: Mark thừa nhận rằng bản thân phần mềm không tự động lọc dữ liệu riêng tư ('doesn't
          automatically filter out private data').
        statement: The monitoring software automatically filters out private data to protect employees.
      - type: SHORT_ANSWER
        prompt: Whom do Mark and Sarah plan to talk to this afternoon?
        promptVi: Mark và Sarah dự định nói chuyện với ai vào chiều nay?
        accept:
          - team leads
          - The team leads
          - team leaders
        explanationVi: Sarah đề xuất thảo luận bản đề xuất với các trưởng nhóm ('team leads') vào chiều nay.
      - type: SHORT_ANSWER
        prompt: What specific device do Mark and Sarah suggest using for urgent private matters?
        promptVi: Thiết bị cụ thể nào mà Mark và Sarah đề xuất sử dụng cho các việc riêng khẩn cấp?
        accept:
          - smartphones
          - smartphone
          - phones
          - phone
        explanationVi: Mark đề cập đến việc sử dụng điện thoại thông minh ('smartphones') cho bất kỳ vấn đề
          riêng tư khẩn cấp nào trong ngày.
  - slug: evaluating-a-student-research-survey
    title: Evaluating a Student Research Survey
    titleVi: Đánh giá một khảo sát nghiên cứu của sinh viên
    topic: education
    accent: UK
    format: dialogue
    speakerCount: 2
    glossary: []
    segments:
      - speaker: Dr. Evans
        text: Come in, Alex. I have looked over the draft of your undergraduate research survey on campus
          study habits.
        vi: Vào đi, Alex. Tôi đã xem qua bản nháp khảo sát nghiên cứu bậc đại học của bạn về thói quen học
          tập trong khuôn viên trường.
      - speaker: Alex
        text: Thank you, Dr. Evans. I am quite anxious to hear your feedback before I release the
          questionnaire to the student body.
        vi: Cảm ơn thầy, Tiến sĩ Evans. Em rất mong được nghe nhận xét của thầy trước khi phát hành bảng hỏi
          cho sinh viên toàn trường.
      - speaker: Dr. Evans
        text: Your research question is useful, but your sampling plan is too narrow to represent study
          habits across the college.
        vi: Câu hỏi nghiên cứu của em có ích, nhưng kế hoạch chọn mẫu quá hẹp để phản ánh thói quen học tập
          của toàn trường.
      - speaker: Alex
        text: I initially planned to survey only final-year biology majors, believing it would keep the data
          focused and manageable.
        vi: Ban đầu em dự định chỉ khảo sát sinh viên năm cuối chuyên ngành sinh học, vì tin rằng nó sẽ giữ
          cho dữ liệu tập trung và dễ quản lý.
      - speaker: Dr. Evans
        text: While manageability is important, restricting it to one single major introduces a severe
          selection bias. You need cross-departmental representation.
        vi: Mặc dù tính dễ quản lý là quan trọng, việc giới hạn nó trong một chuyên ngành duy nhất tạo ra sự
          thiên vị lựa chọn nghiêm trọng. Bạn cần có đại diện liên khoa.
      - speaker: Alex
        text: That makes sense. If I expand it to include humanities and engineering students, would a total
          of two hundred respondents be sufficient?
        vi: Điều đó hợp lý. Nếu em mở rộng nó để bao gồm sinh viên ngành nhân văn và kỹ thuật, tổng cộng hai
          trăm người trả lời có đủ không?
      - speaker: Dr. Evans
        text: Two hundred is a much healthier target. However, look closely at your question phrasing,
          particularly question twelve regarding screen time.
        vi: Hai trăm là mục tiêu khả quan hơn nhiều. Tuy nhiên, hãy xem kỹ cách diễn đạt câu hỏi của bạn,
          đặc biệt là câu hỏi số mười hai về thời gian sử dụng màn hình.
      - speaker: Alex
        text: Is it too ambiguous? I asked students to estimate how many hours they spend studying online
          daily.
        vi: Nó quá mơ hồ phải không ạ? Em đã yêu cầu sinh viên ước tính họ dành bao nhiêu giờ học trực tuyến
          mỗi ngày.
      - speaker: Dr. Evans
        text: Exactly. 'Studying' can overlap with casual web browsing or social media use, skewing your
          metrics completely.
        vi: Chính xác. 'Học tập' có thể chồng chéo với việc lướt web thông thường hoặc dùng mạng xã hội, làm
          sai lệch hoàn toàn số liệu của bạn.
      - speaker: Alex
        text: I see your point. I should separate academic platform access from general internet usage to
          keep the variables distinct.
        vi: Em hiểu ý thầy. Em nên tách việc sử dụng các nền tảng học tập khỏi hoạt động dùng Internet thông
          thường để các biến số được phân biệt rõ.
      - speaker: Dr. Evans
        text: Spot on. Revise those definitions, expand your participant pool, and send me the updated draft
          by Friday morning.
        vi: Chuẩn xác. Hãy sửa lại các định nghĩa đó, mở rộng nhóm người tham gia và gửi cho tôi bản nháp
          cập nhật trước sáng thứ Sáu.
      - speaker: Alex
        text: I will make those revisions right away and email you the updated document before the weekend.
          Thank you for your guidance.
        vi: Em sẽ thực hiện các chỉnh sửa đó ngay lập tức và gửi email tài liệu cập nhật cho thầy trước cuối
          tuần. Cảm ơn sự hướng dẫn của thầy.
