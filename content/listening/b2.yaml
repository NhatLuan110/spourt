        answer: Six hours
      - type: MCQ
        prompt: How do they plan to offset higher train ticket expenses?
        promptVi: Họ dự định bù đắp chi phí vé tàu cao hơn bằng cách nào?
        explanationVi: Elena đề xuất bù đắp bằng cách giảm nhẹ trợ cấp khách sạn tiêu chuẩn (reducing
          standard hotel allowances slightly).
        options:
          - Reducing standard hotel allowances slightly
          - Cutting conference budgets
          - Increasing employee salaries
          - Canceling other trips
        answer: Reducing standard hotel allowances slightly
      - type: TRUE_FALSE
        prompt: Elena suggests making eco-certified accommodations a strict mandatory rule without
          exceptions.
        promptVi: Elena đề xuất biến các cơ sở lưu trú đạt chuẩn sinh thái thành quy định bắt buộc nghiêm
