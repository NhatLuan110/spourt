          - Carbon emissions reporting
        answer: Banning domestic short-haul flights
      - type: MCQ
        prompt: What is the agreed time threshold for allowing flights instead of trains?
        promptVi: Ngưỡng thời gian được thỏa thuận để cho phép đi máy bay thay vì đi tàu là bao lâu?
        explanationVi: Họ đồng ý cho phép đi máy bay nếu hành trình tàu thay thế vượt quá sáu giờ (exceeds
          six hours).
        options:
          - Two hours
