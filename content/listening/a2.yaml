cefr: A2
tracks:
  - slug: ordering-coffee-to-take-away
    title: Ordering Coffee to Take Away
    titleVi: Gọi cà phê mang đi
    topic: daily-life
    accent: US
    format: dialogue
    speakerCount: 2
    glossary:
      - queue
      - bargain
      - appliance
    segments:
      - speaker: Barista
        text: Hi there. What can I get for you?
        vi: Chào bạn. Bạn dùng gì ạ?
      - speaker: Customer
        text: Could I have a large iced coffee, please? To take away.
        vi: Cho tôi một cốc cà phê đá cỡ lớn nhé. Mang đi ạ.
      - speaker: Barista
        text: Sure. Would you like milk in that?
        vi: Vâng. Bạn có thêm sữa không?
      - speaker: Customer
        text: Just a little, thanks. And no sugar.
        vi: Cho ít thôi ạ. Và không đường.
      - speaker: Barista
        text: No problem. Anything to eat this morning?
        vi: Được ạ. Sáng nay bạn có ăn gì không?
      - speaker: Customer
        text: No, thank you. How much is that altogether?
        vi: Không ạ, cảm ơn. Tất cả bao nhiêu tiền ạ?
      - speaker: Barista
        text: That comes to fifty-five thousand dong. Are you paying by card?
        vi: Tổng cộng năm mươi lăm nghìn đồng. Bạn thanh toán bằng thẻ chứ ạ?
      - speaker: Customer
        text: Yes, by card. Do I need to sign anything?
        vi: Vâng, bằng thẻ. Tôi có cần ký gì không ạ?
      - speaker: Barista
        text: No, just tap here. It will be ready in about three minutes.
        vi: Không, bạn chỉ cần chạm vào đây. Khoảng ba phút nữa là xong ạ.
      - speaker: Customer
        text: Great. I will wait over there by the window.
        vi: Tuyệt. Tôi sẽ đợi ở chỗ cửa sổ đằng kia.
    dictation:
      - 2
      - 4
      - 7
    questions:
      - type: MCQ
        prompt: What size of coffee does the customer order?
        options:
          - Large
          - Small
          - Medium
          - Two large
        answer: Large
        explanationVi: Khách nói "a large iced coffee" — cỡ lớn.
      - type: MCQ
        prompt: How does the customer want the coffee?
        options:
          - With a little milk and no sugar
          - With milk and sugar
          - Black with sugar
          - With extra sugar and no milk
        answer: With a little milk and no sugar
        explanationVi: '"Just a little, thanks. And no sugar." — chút sữa, không đường.'
      - type: MCQ
        prompt: How long will the drink take?
        options:
          - About three minutes
          - About ten minutes
          - About one minute
          - It is ready now
        answer: About three minutes
        explanationVi: '"It will be ready in about three minutes."'
      - type: TRUE_FALSE
        prompt: Đúng hay sai theo đoạn hội thoại?
        statement: The customer buys something to eat as well.
        answer: false
        explanationVi: Sai. Khi được hỏi có ăn gì không, khách trả lời "No, thank you".
      - type: SHORT_ANSWER
        prompt: How much does the customer pay?
        accept:
          - fifty-five thousand dong
          - "55000"
          - fifty five thousand dong
          - 55,000
          - fifty-five thousand
        explanationVi: '"That comes to fifty-five thousand dong."'
  - slug: checking-in-at-the-airport
    title: Checking In at the Airport
    titleVi: Làm thủ tục ở sân bay
    topic: travel
    accent: UK
    format: dialogue
    speakerCount: 2
    glossary:
      - boarding
      - luggage
      - departure
      - passport
      - delay
      - check-in
    segments:
      - speaker: Agent
        text: Good afternoon. May I see your passport and booking reference, please?
        vi: Chào buổi chiều. Cho tôi xem hộ chiếu và mã đặt chỗ ạ?
      - speaker: Traveller
        text: Here you are. I am flying to Singapore this evening.
        vi: Đây ạ. Tôi bay đi Singapore tối nay.
      - speaker: Agent
        text: Thank you. Are you checking in any luggage today?
        vi: Cảm ơn. Hôm nay anh có gửi hành lý không ạ?
      - speaker: Traveller
        text: Just one suitcase. Is twenty-three kilos still the limit?
        vi: Chỉ một vali thôi. Giới hạn vẫn là hai mươi ba cân đúng không ạ?
      - speaker: Agent
        text: It is. Please put it on the belt for me. That is twenty-one point four, so you are fine.
        vi: Đúng vậy ạ. Anh đặt lên băng chuyền giúp tôi. Hai mươi mốt phẩy bốn, anh vẫn ổn.
      - speaker: Traveller
        text: Good. Could I have a seat near the front, if there is one?
        vi: Tốt quá. Cho tôi ghế phía trước được không ạ, nếu còn?
      - speaker: Agent
        text: I can offer you seat 8C. It is an aisle seat.
        vi: Tôi có thể xếp anh ghế 8C. Đó là ghế cạnh lối đi ạ.
      - speaker: Traveller
        text: That is perfect. What time does boarding start?
        vi: Vậy được ạ. Mấy giờ bắt đầu lên máy bay ạ?
      - speaker: Agent
        text: Boarding is at six forty from gate twelve, but please check the departure screens. There is a
          short delay on some flights this evening.
        vi: Lên máy bay lúc sáu giờ bốn mươi ở cửa số mười hai, nhưng anh nhớ xem bảng khởi hành. Tối nay
          một số chuyến bị chậm một chút.
      - speaker: Traveller
        text: Understood. Thank you very much for your help.
        vi: Tôi hiểu rồi. Cảm ơn chị nhiều ạ.
    dictation:
      - 4
      - 7
      - 9
    questions:
      - type: MCQ
        prompt: How heavy is the traveller's suitcase?
        options:
          - 21.4 kilos
          - 23 kilos
          - 20 kilos
          - 24.1 kilos
        answer: 21.4 kilos
        explanationVi: Nhân viên nói "That is twenty-one point four" — 21,4 cân, dưới giới hạn 23 cân.
      - type: MCQ
        prompt: Which seat is the traveller given?
        options:
          - 8C
          - 8A
          - 12C
          - 6C
        answer: 8C
        explanationVi: '"I can offer you seat 8C. It is an aisle seat."'
      - type: MCQ
        prompt: What does the agent tell the traveller to check?
        options:
          - The departure screens
          - The boarding pass
          - The luggage tag
          - The passport expiry date
        answer: The departure screens
        explanationVi: '"please check the departure screens" vì tối đó vài chuyến bị chậm.'
      - type: TRUE_FALSE
        prompt: Đúng hay sai theo đoạn hội thoại?
        statement: The traveller asked for a window seat.
        answer: false
        explanationVi: Sai. Khách xin ghế phía trước, và được xếp ghế cạnh lối đi (aisle).
      - type: SHORT_ANSWER
        prompt: What time does boarding start?
        accept:
          - six forty
          - "6.40"
          - 6:40
          - six forty pm
          - 18:40
        explanationVi: '"Boarding is at six forty from gate twelve."'
      - type: SHORT_ANSWER
        prompt: Which gate is the flight boarding from?
        accept:
          - twelve
          - "12"
          - gate twelve
          - gate 12
        explanationVi: '"from gate twelve" — cửa số mười hai.'
  - slug: asking-for-directions
    title: Asking for Directions
    titleVi: Hỏi đường
    topic: travel
    accent: UK
    format: dialogue
    speakerCount: 2
    glossary:
      - direction
      - landmark
      - transport
    segments:
      - speaker: Tourist
        text: Excuse me, could you help me? I am looking for the post office.
        vi: Xin lỗi, bạn giúp tôi được không? Tôi đang tìm bưu điện.
      - speaker: Local
        text: Of course. Are you walking or taking a bus?
        vi: Tất nhiên rồi. Bạn đi bộ hay đi xe buýt?
      - speaker: Tourist
        text: Walking. Is it far from here?
        vi: Đi bộ ạ. Từ đây tới đó có xa không?
      - speaker: Local
        text: About ten minutes. Go straight down this road until you reach the traffic lights.
        vi: Khoảng mười phút. Bạn đi thẳng con đường này tới chỗ đèn giao thông.
      - speaker: Tourist
        text: Straight down to the traffic lights. And then?
        vi: Đi thẳng tới đèn giao thông. Rồi sao nữa ạ?
      - speaker: Local
        text: Turn left there. The post office is on your right, next to a bakery.
        vi: Rẽ trái ở đó. Bưu điện nằm bên tay phải, cạnh một tiệm bánh.
      - speaker: Tourist
        text: Left at the lights, then on the right. Is there a sign outside?
        vi: Rẽ trái ở đèn, rồi bên phải. Ngoài cửa có biển không ạ?
      - speaker: Local
        text: Yes, a big yellow one. You cannot miss it.
        vi: Có, biển vàng to lắm. Không thể nhầm được đâu.
      - speaker: Tourist
        text: Thank you so much. One more thing — what time does it close?
        vi: Cảm ơn bạn nhiều. À còn một điều nữa — mấy giờ thì đóng cửa ạ?
      - speaker: Local
        text: Half past five on weekdays. Earlier on Saturdays, I think.
        vi: Năm giờ rưỡi các ngày trong tuần. Thứ Bảy thì sớm hơn, tôi nghĩ vậy.
    dictation:
      - 3
      - 5
      - 9
    questions:
      - type: MCQ
        prompt: How is the tourist travelling to the post office?
        options:
          - On foot
          - By bus
          - By taxi
          - By bicycle
        answer: On foot
        explanationVi: Du khách trả lời "Walking" khi được hỏi đi bộ hay xe buýt.
      - type: MCQ
        prompt: Where should the tourist turn left?
        options:
          - At the traffic lights
          - At the bakery
          - At the post office
          - At the bus stop
        answer: At the traffic lights
        explanationVi: '"Go straight ... until you reach the traffic lights. Turn left there."'
      - type: MCQ
        prompt: What is next to the post office?
        options:
          - A bakery
          - A bank
          - A school
          - A market
        answer: A bakery
        explanationVi: '"The post office is on your right, next to a bakery."'
      - type: TRUE_FALSE
        prompt: Đúng hay sai theo bài nghe?
        statement: The local is completely sure about the Saturday closing time.
        answer: false
        explanationVi: Sai. Người dân nói "Earlier on Saturdays, I think" — chữ I think cho thấy họ không chắc.
      - type: SHORT_ANSWER
        prompt: What time does the post office close on weekdays?
        accept:
          - half past five
          - "5.30"
          - 5:30
          - half five
          - 17:30
        explanationVi: '"Half past five on weekdays."'
      - type: SHORT_ANSWER
        prompt: What colour is the sign outside the post office?
        accept:
          - yellow
          - a big yellow one
          - big yellow
        explanationVi: '"Yes, a big yellow one."'
  - slug: buying-a-train-ticket
    title: Buying a Train Ticket
    titleVi: Mua vé tàu
    topic: travel
    accent: UK
    format: dialogue
    speakerCount: 2
    glossary: []
    segments:
      - speaker: Passenger
        text: Good morning. I would like a ticket to Brighton for tomorrow, please.
        vi: Chào buổi sáng. Tôi muốn mua một vé đến Brighton cho ngày mai.
      - speaker: Clerk
        text: Certainly. Would you like a single ticket or a return?
        vi: Vâng. Bạn muốn vé một chiều hay khứ hồi?
      - speaker: Passenger
        text: A return, please. I want to come back on Sunday evening.
        vi: Vé khứ hồi ạ. Tôi muốn quay về vào tối Chủ Nhật.
      - speaker: Clerk
        text: The morning trains leave at nine fifteen and ten thirty.
        vi: Các chuyến tàu buổi sáng khởi hành lúc chín giờ mười lăm và mười giờ ba mươi.
      - speaker: Passenger
        text: The earlier one, please. Is there a train back at six on Sunday?
        vi: Cho tôi chuyến sớm hơn. Có tàu về lúc sáu giờ vào Chủ Nhật không?
      - speaker: Clerk
        text: Yes, at six in the evening. The return ticket costs eighteen pounds.
        vi: Có, lúc sáu giờ tối. Vé khứ hồi giá mười tám bảng.
      - speaker: Passenger
        text: That is fine. Can I pay by card?
        vi: Được ạ. Tôi trả bằng thẻ được không?
      - speaker: Clerk
        text: Of course. Your train tomorrow leaves from platform four.
        vi: Được chứ. Chuyến tàu của bạn ngày mai khởi hành từ sân ga số bốn.
      - speaker: Passenger
        text: Thank you. Where can I buy some water before I get on?
        vi: Cảm ơn. Tôi có thể mua nước ở đâu trước khi lên tàu?
      - speaker: Clerk
        text: There is a small shop next to the ticket office.
        vi: Có một cửa hàng nhỏ bên cạnh phòng bán vé.
      - speaker: Passenger
        text: Great. Do I need to print this ticket at home?
        vi: Tốt quá. Tôi có cần in vé này ở nhà không?
      - speaker: Clerk
        text: No. You can show the ticket on your phone.
        vi: Không. Bạn có thể đưa vé trên điện thoại cho nhân viên xem.
    dictation:
      - 2
      - 4
      - 8
      - 12
    questions:
      - type: MCQ
        prompt: Where is the passenger going?
        options:
          - London
          - Brighton
          - Oxford
          - York
        answer: Brighton
        explanationVi: Hành khách yêu cầu vé đến Brighton ngay ở đầu hội thoại.
      - type: MCQ
        prompt: What type of ticket does the passenger buy?
        options:
          - A single ticket
          - A weekly ticket
          - A return ticket
          - A family ticket
        answer: A return ticket
        explanationVi: Hành khách chọn vé khứ hồi và nói muốn quay về tối Chủ Nhật.
      - type: MCQ
        prompt: Which train will the passenger take tomorrow?
        options:
          - The 9:15 train
          - The 10:30 train
          - The 18:00 train
          - The 8:45 train
        answer: The 9:15 train
        explanationVi: Trong hai chuyến 9:15 và 10:30, hành khách chọn chuyến sớm hơn, tức 9:15.
      - type: MCQ
        prompt: Where can the passenger buy water?
        options:
          - On platform two
          - Outside the station
          - Opposite the cafe
          - Next to the ticket office
        answer: Next to the ticket office
        explanationVi: Nhân viên chỉ cửa hàng nhỏ bên cạnh phòng bán vé.
      - type: TRUE_FALSE
        prompt: Is the statement true or false?
        promptVi: Nhận định sau đúng hay sai theo bài nghe?
        statement: The passenger will return on Sunday evening.
        answer: true
        explanationVi: Hành khách nói muốn quay về tối Chủ Nhật và đồng ý với chuyến 6 giờ tối.
      - type: TRUE_FALSE
        prompt: Is the statement true or false?
        promptVi: Nhận định sau đúng hay sai theo bài nghe?
        statement: The passenger must print the ticket at home.
        answer: false
        explanationVi: Nhân viên nói có thể đưa vé trên điện thoại cho nhân viên xem.
      - type: SHORT_ANSWER
        prompt: How much does the return ticket cost?
        accept:
          - eighteen pounds
          - 18 pounds
          - £18
          - "18"
        explanationVi: Nhân viên báo giá vé khứ hồi là mười tám bảng.
      - type: SHORT_ANSWER
        prompt: Which platform does the train leave from tomorrow?
        accept:
          - four
          - "4"
          - platform four
          - platform 4
        explanationVi: Chuyến ngày mai khởi hành từ sân ga số bốn.
  - slug: joining-the-library
    title: Joining the Library
    titleVi: Đăng ký thẻ thư viện
    topic: education
    accent: UK
    format: dialogue
    speakerCount: 2
    glossary: []
    segments:
      - speaker: Visitor
        text: Hello. I live nearby, and I would like to join the library.
        vi: Xin chào. Tôi sống gần đây và muốn đăng ký thẻ thư viện.
      - speaker: Librarian
        text: Welcome. Please complete this form with your name and address.
        vi: Chào bạn. Hãy điền tên và địa chỉ vào mẫu đơn này.
      - speaker: Visitor
        text: Sure. Do I need to pay for a library card?
        vi: Vâng. Tôi có phải trả tiền làm thẻ thư viện không?
      - speaker: Librarian
        text: No, it is free. Have you got anything that shows your address?
        vi: Không, thẻ miễn phí. Bạn có giấy tờ gì ghi địa chỉ của mình không?
      - speaker: Visitor
        text: Yes, I have a letter from my college with my address on it.
        vi: Có, tôi có một lá thư từ trường cao đẳng có ghi địa chỉ của mình.
      - speaker: Librarian
        text: That is fine. You can borrow up to six books for three weeks.
        vi: Như vậy được rồi. Bạn có thể mượn tối đa sáu cuốn sách trong ba tuần.
      - speaker: Visitor
        text: Can I borrow magazines as well? I enjoy reading about travel.
        vi: Tôi có thể mượn cả tạp chí không? Tôi thích đọc về du lịch.
      - speaker: Librarian
        text: You can read magazines here, but you cannot take them home.
        vi: Bạn có thể đọc tạp chí tại đây, nhưng không được mang về nhà.
      - speaker: Visitor
        text: I understand. Where can I find books for English learners?
        vi: Tôi hiểu rồi. Tôi có thể tìm sách cho người học tiếng Anh ở đâu?
      - speaker: Librarian
        text: On the first floor, beside the stairs. They have green labels.
        vi: Ở tầng trên tầng trệt, cạnh cầu thang. Chúng có nhãn màu xanh lá.
      - speaker: Visitor
        text: Thank you. What time do you close today?
        vi: Cảm ơn. Hôm nay thư viện đóng cửa lúc mấy giờ?
      - speaker: Librarian
        text: At seven this evening. Here is your new library card.
        vi: Lúc bảy giờ tối nay. Đây là thẻ thư viện mới của bạn.
    dictation:
      - 2
      - 4
      - 8
      - 12
    questions:
      - type: MCQ
        prompt: What must the visitor write on the form?
        options:
          - A phone password
          - A book review
          - A name and address
          - A course timetable
        answer: A name and address
        explanationVi: Thủ thư yêu cầu điền tên và địa chỉ.
      - type: MCQ
        prompt: What does the visitor use to show their address?
        options:
          - A college letter
          - A train ticket
          - A magazine
          - A bank card
        answer: A college letter
        explanationVi: Người đăng ký có thư từ trường cao đẳng ghi địa chỉ của mình.
      - type: MCQ
        prompt: Where may visitors read the magazines?
        options:
          - Only at home
          - Only on a bus
          - At a nearby cafe
          - Inside the library
        answer: Inside the library
        explanationVi: Tạp chí được đọc tại thư viện và không được mang về.
      - type: MCQ
        prompt: Where are the books for English learners?
        options:
          - Behind the front desk
          - Beside the stairs on the first floor
          - In the garden
          - Next to the main entrance
        answer: Beside the stairs on the first floor
        explanationVi: Thủ thư nói sách ở tầng trên tầng trệt, cạnh cầu thang.
      - type: TRUE_FALSE
        prompt: Is the statement true or false?
        promptVi: Nhận định sau đúng hay sai theo bài nghe?
        statement: The library card is free.
        answer: true
        explanationVi: Khi khách hỏi về phí, thủ thư trả lời thẻ miễn phí.
      - type: TRUE_FALSE
        prompt: Is the statement true or false?
        promptVi: Nhận định sau đúng hay sai theo bài nghe?
        statement: The books for English learners have red labels.
        answer: false
        explanationVi: Sách cho người học tiếng Anh có nhãn xanh lá.
      - type: SHORT_ANSWER
        prompt: How many books can a member borrow at one time?
        accept:
          - six
          - "6"
          - six books
          - 6 books
        explanationVi: Mỗi thành viên có thể mượn tối đa sáu cuốn.
      - type: SHORT_ANSWER
        prompt: How long can a member keep the books?
        accept:
          - three weeks
          - 3 weeks
        explanationVi: Thời hạn mượn sách là ba tuần.
  - slug: changing-a-shirt-at-a-shop
    title: Changing a Shirt at a Shop
    titleVi: Đổi áo tại cửa hàng
    topic: daily-life
    accent: US
    format: dialogue
    speakerCount: 2
    glossary: []
    segments:
      - speaker: Sarah
        text: Hello! How can I help you today?
        vi: Xin chào! Tôi có thể giúp gì cho bạn hôm nay?
      - speaker: Minh
        text: Hi. I bought this blue shirt yesterday, but it is too small.
        vi: Chào bạn. Tôi đã mua chiếc áo sơ mi màu xanh dương này hôm qua, nhưng nó quá nhỏ.
      - speaker: Sarah
        text: Oh, I see. Do you have the receipt with you?
        vi: Ồ, tôi hiểu rồi. Bạn có mang theo hóa đơn không?
      - speaker: Minh
        text: Yes, here it is. I paid thirty dollars for it.
        vi: Có, nó đây. Tôi đã trả ba mươi đô la cho nó.
      - speaker: Sarah
        text: Perfect. Would you like a larger size in the same color?
        vi: Tuyệt vời. Bạn có muốn đổi sang cỡ lớn hơn cùng màu không?
      - speaker: Minh
        text: Yes, please. Do you have a medium size? This one is small.
        vi: Vâng, làm ơn. Bạn có cỡ vừa (M) không? Chiếc này là cỡ nhỏ (S).
      - speaker: Sarah
        text: Let me check our computer. Yes, we have one medium left.
        vi: Để tôi kiểm tra máy tính nhé. Vâng, chúng tôi còn lại một chiếc cỡ vừa.
      - speaker: Minh
        text: That is great! Can I try it on in the fitting room?
        vi: Tuyệt quá! Tôi có thể mặc thử nó trong phòng thay đồ không?
      - speaker: Sarah
        text: Of course. The fitting rooms are right behind you on the left.
