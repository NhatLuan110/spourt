    questions:
      - type: MCQ
        prompt: How many boxes does the customer buy?
        options:
          - One
          - Three
          - Four
          - Two
        answer: Two
        explanationVi: Khách chọn hai hộp dâu tây.
      - type: MCQ
        prompt: When did the strawberries arrive at the stall?
        options:
          - Yesterday evening
          - This morning
          - Last Friday
          - At lunchtime
        answer: This morning
        explanationVi: Người bán nói dâu được chuyển đến sáng nay.
      - type: MCQ
        prompt: Which fruit is unavailable?
        options:
          - Pears
          - Apples
          - Bananas
          - Strawberries
        answer: Pears
        explanationVi: Người bán nói hôm nay không có lê.
      - type: MCQ
        prompt: What does the customer use to carry the fruit?
        options:
          - A new paper bag
          - A borrowed basket
          - Their own bag
          - A large suitcase
        answer: Their own bag
        explanationVi: Khách nói đã mang túi của mình.
      - type: TRUE_FALSE
        prompt: Is the statement true or false?
        promptVi: Nhận định sau đúng hay sai theo bài nghe?
        statement: The customer pays in cash.
        answer: true
        explanationVi: Khách đưa một tờ mười bảng.
      - type: TRUE_FALSE
        prompt: Is the statement true or false?
        promptVi: Nhận định sau đúng hay sai theo bài nghe?
        statement: The seller also works at this market on Sundays.
        answer: false
        explanationVi: Người bán chỉ bán tại đây vào thứ Bảy.
      - type: SHORT_ANSWER
        prompt: How much change does the customer receive?
        accept:
          - five pounds
          - 5 pounds
          - £5
          - "5"
        explanationVi: Khách trả mười bảng cho hàng giá năm bảng, nhận lại năm bảng.
      - type: SHORT_ANSWER
        prompt: What time does the stall finish trading?
        accept:
          - two
          - "2"
          - two pm
          - two in the afternoon
          - 2 pm
          - 2 p.m.
          - 2:00
          - 2:00 pm
          - 14:00
        explanationVi: Quầy bán đến hai giờ chiều.
