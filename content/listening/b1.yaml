# Bài nghe B1 — tốc độ tự nhiên, có thông tin cần suy luận.
cefr: B1
tracks:
  - slug: a-voicemail-about-a-deadline
    title: A Voicemail About a Deadline
    titleVi: Tin nhắn thoại về hạn nộp
    topic: work
    accent: US
    format: monologue
    speakerCount: 1
    glossary: [deadline, colleague, agenda, attach, workload, schedule, invoice]
    segments:
      - speaker: Linh
        text: Hi Duc, it's Linh. Sorry to call so late on a Friday.
        vi: Chào Đức, Linh đây. Xin lỗi vì gọi muộn vào tối thứ Sáu.
      - speaker: Linh
        text: I wanted to catch you before the weekend about the Nguyen account.
        vi: Mình muốn nói với bạn về khách hàng Nguyễn trước khi nghỉ cuối tuần.
      - speaker: Linh
        text: The client moved the deadline forward. It's now Wednesday morning, not Friday.
        vi: Khách đã dời hạn lên sớm hơn. Bây giờ là sáng thứ Tư, không phải thứ Sáu nữa.
      - speaker: Linh
        text: I know that sounds bad, but I think it's manageable if we change the order of things.
        vi: Mình biết nghe có vẻ tệ, nhưng mình nghĩ vẫn xoay được nếu đổi thứ tự công việc.
      - speaker: Linh
        text: The design review was scheduled for Tuesday. Could we move that to Monday afternoon instead?
        vi: Buổi duyệt thiết kế đang xếp vào thứ Ba. Mình dời sang chiều thứ Hai được không?
      - speaker: Linh
        text: That leaves all of Tuesday for the final numbers, which is the part that always takes longer than we expect.
        vi: Như vậy cả ngày thứ Ba dành cho phần số liệu cuối, phần luôn tốn thời gian hơn mình tưởng.
      - speaker: Linh
        text: I've attached the revised agenda to an email, so have a look when you get a chance.
        vi: Mình đã đính kèm chương trình họp đã sửa vào email, khi nào rảnh bạn xem nhé.
      - speaker: Linh
        text: One more thing. Don't worry about the invoice from the printers. I've already dealt with it.
        vi: Còn một việc nữa. Bạn đừng lo hoá đơn của nhà in. Mình xử lý xong rồi.
      - speaker: Linh
        text: Anyway, enjoy your weekend. Call me Monday morning if the new plan doesn't work for you.
        vi: Thôi, chúc bạn cuối tuần vui vẻ. Sáng thứ Hai gọi mình nếu kế hoạch mới không hợp với bạn nhé.
    dictation: [3, 6, 8]
    questions:
      - type: MCQ
        prompt: What has changed about the deadline?
        options:
          - It has moved earlier, from Friday to Wednesday
          - It has moved later, from Wednesday to Friday
          - It has been cancelled by the client
          - It is now Monday afternoon
        answer: It has moved earlier, from Friday to Wednesday
        explanationVi: "\"It's now Wednesday morning, not Friday\" — hạn được dời lên sớm hơn."
      - type: MCQ
        prompt: What does Linh want to move to Monday afternoon?
        options: [The design review, The final numbers, The client call, The invoice]
        answer: The design review
        explanationVi: "\"The design review was scheduled for Tuesday. Could we move that
          to Monday afternoon instead?\""
      - type: MCQ
        prompt: Why does Linh want the whole of Tuesday free?
        options:
          - The final numbers always take longer than expected
          - The client visits the office on Tuesday
          - The printers deliver on Tuesday
          - She is out of the office on Wednesday
        answer: The final numbers always take longer than expected
        explanationVi: "Cô nói phần số liệu cuối \"always takes longer than we expect\"."
      - type: TRUE_FALSE
        prompt: Đúng hay sai theo tin nhắn?
        statement: Duc still needs to handle the invoice from the printers.
        answer: false
        explanationVi: "Sai. Linh nói \"Don't worry about the invoice ... I've already
          dealt with it.\""
      - type: TRUE_FALSE
        prompt: Đúng hay sai theo tin nhắn?
        statement: Linh sent the revised agenda by email.
        answer: true
        explanationVi: "Đúng. \"I've attached the revised agenda to an email.\""
      - type: SHORT_ANSWER
        prompt: When does Linh ask Duc to call her if the plan does not work?
        accept: ["Monday morning", "on Monday morning", "Monday"]
        explanationVi: "\"Call me Monday morning if the new plan doesn't work for you.\""

  - slug: a-doctors-appointment
    title: A Doctor's Appointment
    titleVi: Buổi khám bệnh
    topic: health
    accent: UK
    format: dialogue
    speakerCount: 2
    glossary: [symptom, prescription, appointment, infection, recover, painkiller, diagnose]
    segments:
      - speaker: Doctor
        text: Come in and take a seat. What seems to be the trouble?
        vi: Mời anh vào ngồi. Anh thấy trong người thế nào?
      - speaker: Patient
        text: I've had a sore throat for about a week, and since Tuesday I've had a temperature as well.
        vi: Tôi đau họng khoảng một tuần rồi, và từ thứ Ba thì bị sốt nữa.
      - speaker: Doctor
        text: Any cough? Any difficulty swallowing?
        vi: Anh có ho không? Nuốt có khó không?
      - speaker: Patient
        text: A little cough at night. Swallowing is uncomfortable but not painful.
        vi: Ban đêm ho một chút. Nuốt thì hơi khó chịu nhưng không đau.
      - speaker: Doctor
        text: Let me have a look. Open wide for me. Yes, it's quite red, but there's no infection I can see.
        vi: Để tôi xem nào. Anh há to giúp tôi. Đúng là khá đỏ, nhưng tôi không thấy dấu hiệu nhiễm khuẩn.
      - speaker: Patient
        text: So I don't need antibiotics?
        vi: Vậy tôi không cần kháng sinh phải không ạ?
      - speaker: Doctor
        text: No, and they wouldn't help. This looks viral, which means your body will clear it on its own.
        vi: Không, và kháng sinh cũng không giúp gì. Trường hợp này có vẻ do virus, cơ thể anh sẽ tự khỏi.
      - speaker: Patient
        text: How long should it take?
        vi: Bao lâu thì khỏi ạ?
      - speaker: Doctor
        text: Most people recover within ten days. I'll write you a prescription for a stronger painkiller so you can sleep.
        vi: Phần lớn khỏi trong vòng mười ngày. Tôi sẽ kê cho anh một loại giảm đau mạnh hơn để anh ngủ được.
      - speaker: Doctor
        text: But come back if the temperature is still there on Friday, or if it goes above thirty-nine.
        vi: Nhưng nếu thứ Sáu vẫn còn sốt, hoặc sốt trên ba mươi chín độ, thì anh quay lại nhé.
      - speaker: Patient
        text: Right. Should I stay off work?
        vi: Vâng ạ. Tôi có nên nghỉ làm không?
      - speaker: Doctor
        text: Two or three days would be sensible, mostly so you don't pass it around the office.
        vi: Nghỉ hai ba ngày là hợp lý, chủ yếu để anh không lây cho cả văn phòng.
    dictation: [2, 7, 10]
    questions:
      - type: MCQ
        prompt: Why does the doctor say antibiotics are not needed?
        options:
          - The illness appears to be viral
          - The patient is allergic to them
          - The pharmacy has run out
          - The symptoms are too mild to treat
        answer: The illness appears to be viral
        explanationVi: "\"This looks viral, which means your body will clear it on its
          own\" — kháng sinh không có tác dụng với virus."
      - type: MCQ
        prompt: What does the doctor prescribe?
        options: [A stronger painkiller, Antibiotics, A cough syrup, Nothing at all]
        answer: A stronger painkiller
        explanationVi: "\"I'll write you a prescription for a stronger painkiller so you
          can sleep.\""
      - type: MCQ
        prompt: What is the doctor's main reason for suggesting time off work?
        options:
          - To avoid infecting colleagues
          - Because the patient cannot walk
          - Because the medicine causes drowsiness
          - To allow time for more tests
        answer: To avoid infecting colleagues
        explanationVi: "\"mostly so you don't pass it around the office\" — chủ yếu để
          không lây cho đồng nghiệp."
      - type: TRUE_FALSE
        prompt: Đúng hay sai theo đoạn hội thoại?
        statement: The patient has had a temperature for a full week.
        answer: false
        explanationVi: "Sai. Đau họng một tuần, nhưng sốt chỉ từ thứ Ba."
      - type: TRUE_FALSE
        prompt: Đúng hay sai theo đoạn hội thoại?
        statement: The doctor found signs of a bacterial infection in the throat.
        answer: false
        explanationVi: "Sai. Bác sĩ nói họng đỏ nhưng \"there's no infection I can see\"."
      - type: SHORT_ANSWER
        prompt: Above what temperature should the patient come back?
        accept: ["thirty-nine", "39", "thirty nine", "39 degrees", "above thirty-nine"]
        explanationVi: "\"or if it goes above thirty-nine\" — trên 39 độ."

  - slug: a-call-about-a-late-delivery
    title: A Call About a Late Delivery
    titleVi: Gọi điện hỏi đơn hàng đến muộn
    topic: work
    accent: US
    format: dialogue
    speakerCount: 2
    glossary: [invoice, deadline, schedule, refund]
    segments:
      - speaker: Agent
        text: Good afternoon, customer support. How can I help?
        vi: Chào buổi chiều, bộ phận hỗ trợ khách hàng. Tôi giúp gì được ạ?
      - speaker: Customer
        text: Hi. I placed an order two weeks ago and it still has not arrived.
        vi: Chào bạn. Tôi đặt hàng hai tuần trước mà vẫn chưa nhận được.
      - speaker: Agent
        text: I am sorry to hear that. Could you give me the order number?
        vi: Tôi rất tiếc về việc này. Bạn cho tôi xin mã đơn hàng được không?
      - speaker: Customer
        text: It is four eight one two zero. The invoice says it shipped on the twelfth.
        vi: Mã là bốn tám một hai không. Hoá đơn ghi hàng gửi đi ngày mười hai.
      - speaker: Agent
        text: Let me check. Yes, it left our warehouse but it seems to be stuck at the sorting centre.
        vi: Để tôi kiểm tra. Đúng rồi, hàng đã rời kho nhưng có vẻ đang kẹt ở trung tâm phân loại.
      - speaker: Customer
        text: Stuck for how long? I needed it before the end of the month.
        vi: Kẹt bao lâu rồi ạ? Tôi cần hàng trước cuối tháng.
      - speaker: Agent
        text: Since Tuesday. I can either send a replacement today or process a full refund.
        vi: Từ hôm thứ Ba. Tôi có thể gửi hàng thay thế ngay hôm nay, hoặc hoàn tiền toàn bộ.
      - speaker: Customer
        text: If you send a replacement, when would it arrive?
        vi: Nếu gửi hàng thay thế thì bao giờ tới ạ?
      - speaker: Agent
        text: Thursday at the latest. And we would not charge you for the delivery.
        vi: Muộn nhất là thứ Năm. Và chúng tôi sẽ không tính phí giao hàng.
      - speaker: Customer
        text: Let's do the replacement then. Could you email me the new tracking number?
        vi: Vậy gửi hàng thay thế đi ạ. Bạn gửi mã vận đơn mới qua email cho tôi nhé?
      - speaker: Agent
        text: Of course. You will have it within the hour.
        vi: Tất nhiên rồi. Trong vòng một tiếng bạn sẽ nhận được.
    dictation: [4, 6, 8]
    questions:
      - type: MCQ
        prompt: Where is the parcel currently stuck?
        options: [At the sorting centre, At the warehouse, At the airport, At the customer's building]
        answer: At the sorting centre
        explanationVi: "\"it seems to be stuck at the sorting centre\"."
      - type: MCQ
        prompt: What two options does the agent offer?
        options:
          - A replacement or a full refund
          - A discount or a refund
          - A replacement or a discount
          - Faster shipping or a refund
        answer: A replacement or a full refund
        explanationVi: "\"I can either send a replacement today or process a full refund.\""
      - type: MCQ
        prompt: What does the customer ask the agent to email?
        options: [The new tracking number, A new invoice, A refund receipt, The delivery address]
        answer: The new tracking number
        explanationVi: "\"Could you email me the new tracking number?\""
      - type: TRUE_FALSE
        prompt: Đúng hay sai theo bài nghe?
        statement: The customer will have to pay for the replacement delivery.
        answer: false
        explanationVi: "Sai. Nhân viên nói \"we would not charge you for the delivery\"."
      - type: TRUE_FALSE
        prompt: Đúng hay sai theo bài nghe?
        statement: The parcel has been stuck since Tuesday.
        answer: true
        explanationVi: "Đúng — \"Since Tuesday.\""
      - type: SHORT_ANSWER
        prompt: When would the replacement arrive, at the latest?
        accept: [Thursday, "on Thursday", "Thursday at the latest"]
        explanationVi: "\"Thursday at the latest.\""

  - slug: moving-a-team-meeting
    title: Moving a Team Meeting
    titleVi: Đổi lịch họp nhóm
    topic: work
    accent: UK
    format: dialogue
    speakerCount: 2
    glossary: []
    segments:
      - speaker: Linh
        text: David, could we move our planning meeting? The client has asked me to join a call at ten on
          Tuesday.
        vi: David, mình đổi lịch họp lập kế hoạch được không? Khách hàng vừa nhờ tôi tham gia cuộc gọi lúc
          mười giờ thứ Ba.
      - speaker: David
        text: That is when we were due to meet. Could you make Tuesday afternoon instead, perhaps at three?
        vi: Đó là giờ họp mình đã định. Bạn có tham gia được chiều thứ Ba không, khoảng ba giờ chẳng hạn?
      - speaker: Linh
        text: I could, but Mai will be visiting the warehouse all afternoon. She needs to explain the stock
          figures.
        vi: Tôi thì được, nhưng Mai sẽ đến kho cả buổi chiều. Cô ấy cần giải thích các số liệu hàng tồn.
      - speaker: David
        text: Then Wednesday morning sounds better. I have checked the shared calendar, and everyone is free
          at nine thirty.
        vi: Vậy sáng thứ Tư có vẻ hợp hơn. Tôi đã xem lịch chung, mọi người đều rảnh lúc chín giờ ba mươi.
      - speaker: Linh
        text: That works for me. Our usual room is being painted, though. Could we use the small room
          upstairs?
        vi: Giờ đó tôi được. Nhưng phòng họp thường dùng đang sơn lại. Mình dùng phòng nhỏ trên tầng được
          không?
      - speaker: David
        text: It only holds four people, and there are six of us. I will book room twelve instead.
        vi: Phòng đó chỉ chứa được bốn người mà nhóm có sáu người. Tôi sẽ đặt phòng mười hai.
      - speaker: Linh
        text: Good idea. Let us keep the meeting to forty-five minutes so that Mai can leave for another
          appointment.
        vi: Ý hay. Mình họp trong bốn mươi lăm phút thôi để Mai kịp đi cuộc hẹn khác.
      - speaker: David
        text: Agreed. Please send the agenda by four tomorrow. Everyone can read it before we meet.
        vi: Đồng ý. Bạn gửi chương trình họp trước bốn giờ ngày mai nhé. Mọi người có thể đọc trước khi họp.
      - speaker: Linh
        text: I will attach the sales report too. The new product photographs are not ready, so we can
          discuss those next week.
        vi: Tôi sẽ đính kèm cả báo cáo bán hàng. Ảnh sản phẩm mới chưa xong nên để tuần sau mình bàn.
      - speaker: David
        text: Fine. I will update the invitation and explain that both the date and the room have changed.
        vi: Được. Tôi sẽ sửa thư mời và nói rõ cả ngày lẫn phòng họp đều đã thay đổi.
      - speaker: Linh
        text: Could you ask everyone to reply? I do not want anyone waiting in the old room on Tuesday.
        vi: Bạn nhờ mọi người phản hồi được không? Tôi không muốn có ai đợi ở phòng cũ vào thứ Ba.
      - speaker: David
        text: Certainly. I will ask them to confirm by the end of today.
        vi: Được chứ. Tôi sẽ nhờ họ xác nhận trước cuối ngày hôm nay.
    dictation:
      - 2
      - 4
      - 8
      - 12
    questions:
      - type: MCQ
        prompt: Why does Linh ask to move the original meeting?
        options:
          - She has a client call
          - She is visiting the warehouse
          - She is on holiday
          - The sales report is missing
        answer: She has a client call
        explanationVi: Khách hàng cần Linh tham gia cuộc gọi lúc mười giờ thứ Ba, trùng lịch họp cũ.
      - type: MCQ
        prompt: Why is Tuesday afternoon unsuitable?
        options:
          - David is away
          - The office closes early
          - Mai will be at the warehouse
          - The client is unavailable
        answer: Mai will be at the warehouse
        explanationVi: Mai đến kho cả chiều thứ Ba và cần có mặt để giải thích số liệu hàng tồn.
      - type: MCQ
        prompt: Why do they reject the small upstairs room?
        options:
          - It is being painted
          - It is too small for six people
          - It has no windows
          - It costs too much
        answer: It is too small for six people
        explanationVi: Phòng chỉ đủ bốn người trong khi nhóm có sáu người.
      - type: MCQ
        prompt: What will they discuss next week instead?
        options:
          - The stock figures
          - The meeting agenda
          - The sales report
          - The product photographs
        answer: The product photographs
        explanationVi: Ảnh sản phẩm mới chưa hoàn thành nên được để sang tuần sau.
      - type: TRUE_FALSE
        prompt: Is the statement true or false?
        promptVi: Nhận định sau đúng hay sai theo bài nghe?
        statement: Linh will attach the sales report to the agenda.
        answer: true
        explanationVi: Linh nói sẽ đính kèm báo cáo bán hàng.
      - type: TRUE_FALSE
        prompt: Is the statement true or false?
        promptVi: Nhận định sau đúng hay sai theo bài nghe?
        statement: The team only needs to know that the room has changed.
        answer: false
        explanationVi: David sẽ thông báo cả ngày họp lẫn phòng họp thay đổi.
      - type: SHORT_ANSWER
        prompt: Which room will David book?
        accept:
          - twelve
          - "12"
          - room twelve
          - room 12
        explanationVi: David chọn phòng mười hai thay cho phòng nhỏ.
      - type: SHORT_ANSWER
        prompt: How many minutes will the meeting last?
        accept:
          - forty-five
          - forty five
          - "45"
          - forty-five minutes
          - 45 minutes
        explanationVi: Hai người thống nhất giới hạn cuộc họp trong bốn mươi lăm phút.
  - slug: choosing-an-evening-course
    title: Choosing an Evening Course
    titleVi: Chọn lớp học buổi tối
    topic: education
    accent: UK
    format: dialogue
    speakerCount: 2
    glossary: []
    segments:
      - speaker: Learner
        text: I am looking for an evening English course. I can read quite well, but I struggle to speak in
          meetings.
        vi: Tôi đang tìm một khóa tiếng Anh buổi tối. Tôi đọc khá tốt nhưng gặp khó khăn khi nói trong cuộc
          họp.
      - speaker: Adviser
        text: We offer general English and workplace communication. The second course gives you more
          practice with discussions and presentations.
        vi: Chúng tôi có tiếng Anh tổng quát và giao tiếp nơi làm việc. Khóa thứ hai cho bạn luyện thảo luận
          và thuyết trình nhiều hơn.
      - speaker: Learner
        text: That sounds useful. I finish work at six, so I would need a class that starts a little later.
        vi: Nghe có vẻ hữu ích. Tôi tan làm lúc sáu giờ nên cần lớp bắt đầu muộn hơn một chút.
      - speaker: Adviser
        text: The workplace course runs on Tuesdays and Thursdays from seven to eight thirty. It starts on
          the fifth of October.
        vi: Khóa giao tiếp nơi làm việc học thứ Ba và thứ Năm, từ bảy giờ đến tám giờ ba mươi. Khóa bắt đầu
          ngày năm tháng Mười.
      - speaker: Learner
        text: I can manage those evenings. How many students are usually in a class? I would rather avoid a
          very large group.
        vi: Tôi sắp xếp được những tối đó. Mỗi lớp thường có bao nhiêu học viên? Tôi muốn tránh lớp quá
          đông.
      - speaker: Adviser
        text: There are no more than twelve. You work in pairs regularly, and the teacher gives each student
          individual feedback.
        vi: Tối đa mười hai người. Bạn thường xuyên làm việc theo cặp và giáo viên nhận xét riêng cho từng
          học viên.
      - speaker: Learner
        text: How much does the course cost, and will I need to buy a textbook separately?
        vi: Khóa học giá bao nhiêu và tôi có cần mua giáo trình riêng không?
      - speaker: Adviser
        text: It is one hundred and eighty pounds for eight weeks. All the worksheets are included, and no
          textbook is required.
        vi: Một trăm tám mươi bảng cho tám tuần. Giá đã gồm toàn bộ phiếu bài tập và không cần giáo trình.
      - speaker: Learner
        text: I might have to travel for work occasionally. What happens if I miss a lesson?
        vi: Thỉnh thoảng tôi có thể phải đi công tác. Nếu bỏ lỡ một buổi thì sao?
      - speaker: Adviser
        text: We send the materials afterwards, but we do not record the discussions. You can ask the
          teacher about anything unclear.
        vi: Chúng tôi gửi tài liệu sau buổi học nhưng không ghi lại phần thảo luận. Bạn có thể hỏi giáo viên
          về phần chưa rõ.
      - speaker: Learner
        text: Before I decide, could I attend a trial lesson to see whether the level is right for me?
        vi: Trước khi quyết định, tôi có thể học thử để xem trình độ có phù hợp không?
      - speaker: Adviser
        text: Yes, there is a free trial next Thursday. I can reserve a place if you give me your email
          address.
        vi: Có, thứ Năm tới có buổi học thử miễn phí. Tôi có thể giữ chỗ nếu bạn cho địa chỉ email.
    dictation:
      - 2
      - 4
      - 8
      - 12
    questions:
      - type: MCQ
        prompt: What does the learner most want to improve?
        options:
          - Reading novels
          - Writing essays
