      - speaker: Agent
        text: Thank you. Please have the receipt ready so our technician can check whether the repair is
          covered by your guarantee.
        vi: Cảm ơn. Hãy chuẩn bị hóa đơn để kỹ thuật viên kiểm tra việc sửa chữa có được bảo hành không.
      - speaker: Customer
        text: I still have the email receipt. Can the technician come on Wednesday? I work from home that
          day.
        vi: Tôi vẫn giữ hóa đơn qua email. Kỹ thuật viên đến thứ Tư được không? Hôm đó tôi làm ở nhà.
      - speaker: Agent
        text: Our next Wednesday slot is between one and four in the afternoon. The technician will call
          thirty minutes before arriving.
        vi: Lịch còn trống vào thứ Tư là từ một đến bốn giờ chiều. Kỹ thuật viên sẽ gọi trước khi đến ba
          mươi phút.
