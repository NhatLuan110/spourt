  - slug: organising-a-river-cleanup
    title: Organising a River Cleanup
    titleVi: Tổ chức buổi nhặt rác ven sông
    topic: environment
    accent: UK
    format: dialogue
    speakerCount: 2
    glossary: []
    segments:
      - speaker: An
        text: We have eighteen people signed up for Saturday’s river cleanup. Shall we meet by the old
          bridge again?
        vi: Có mười tám người đăng ký buổi nhặt rác ven sông thứ Bảy. Mình lại gặp ở cầu cũ nhé?
      - speaker: Maya
        text: The path there is closed for repairs. Let us meet outside the rowing club, where there is
          space for everyone.
        vi: Lối đi ở đó đang đóng để sửa. Mình gặp bên ngoài câu lạc bộ chèo thuyền, chỗ đó đủ rộng cho mọi
          người.
      - speaker: An
        text: Good idea. We can start at nine and finish at eleven, before the riverside gets too busy.
        vi: Ý hay. Mình có thể bắt đầu lúc chín giờ và xong lúc mười một giờ, trước khi ven sông quá đông.
      - speaker: Maya
        text: I have asked the council for rubbish bags and gloves. Volunteers should bring their own water
          and wear strong shoes.
        vi: Tôi đã xin hội đồng địa phương túi rác và găng tay. Tình nguyện viên nên mang nước uống và đi
          giày chắc chắn.
      - speaker: An
        text: What should people do if they find broken glass? Last time someone nearly picked up a sharp
          bottle.
        vi: Nếu thấy kính vỡ thì mọi người nên làm gì? Lần trước có người suýt nhặt một chai sắc cạnh.
      - speaker: Maya
        text: Tell a team leader and leave it where it is. We will have trained staff with the right
          equipment for sharp items.
        vi: Báo cho trưởng nhóm và để nguyên ở đó. Sẽ có nhân viên được hướng dẫn và có dụng cụ phù hợp xử
          lý vật sắc nhọn.
      - speaker: An
        text: Shall we separate plastic bottles from the general waste? There are recycling bins behind the
          club.
        vi: Mình tách chai nhựa khỏi rác thường nhé? Có thùng tái chế sau câu lạc bộ.
      - speaker: Maya
        text: Yes, but only empty bottles accepted by those bins. I will put simple sorting instructions on
          each bag.
        vi: Có, nhưng chỉ chai rỗng thuộc loại các thùng đó nhận. Tôi sẽ dán hướng dẫn phân loại đơn giản
          lên từng túi.
      - speaker: An
        text: The forecast mentions heavy rain. Do we need a backup plan in case the river path becomes
          slippery?
        vi: Dự báo có nhắc đến mưa lớn. Mình cần phương án dự phòng nếu đường ven sông trơn không?
      - speaker: Maya
        text: If conditions are unsafe, we will postpone. I will text everyone by seven thirty on Saturday
          morning.
        vi: Nếu điều kiện không an toàn thì mình hoãn. Tôi sẽ nhắn cho mọi người trước bảy giờ ba mươi sáng
          thứ Bảy.
      - speaker: An
        text: Afterwards, could we take a group photograph to thank the volunteers? We should ask before
          including anyone.
        vi: Sau đó mình chụp ảnh chung để cảm ơn tình nguyện viên được không? Mình nên hỏi trước khi đưa ai
          vào ảnh.
      - speaker: Maya
        text: Absolutely. People who do not want to be photographed can step aside. I will explain that at
          the start.
        vi: Được chứ. Ai không muốn chụp có thể đứng sang một bên. Tôi sẽ nói rõ điều đó lúc bắt đầu.
