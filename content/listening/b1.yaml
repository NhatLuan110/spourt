  - slug: planning-a-community-exercise-class
    title: Planning a Community Exercise Class
    titleVi: Lên kế hoạch lớp vận động cộng đồng
    topic: health
    accent: UK
    format: dialogue
    speakerCount: 2
    glossary: []
    segments:
      - speaker: Organiser
        text: We would like to offer a gentle exercise class at the community centre. Several residents have
          asked for a morning session.
        vi: Chúng tôi muốn mở lớp vận động nhẹ ở trung tâm cộng đồng. Một số cư dân đã đề nghị học vào buổi
          sáng.
      - speaker: Instructor
        text: I could lead a beginner class on Mondays. It would include simple movements that people can do
          standing or sitting.
        vi: Tôi có thể hướng dẫn lớp cho người mới vào thứ Hai, gồm những động tác đơn giản có thể làm khi
          đứng hoặc ngồi.
      - speaker: Organiser
        text: That flexibility would be useful. Some residents are nervous because they have not joined any
          exercise class before.
        vi: Có lựa chọn như vậy sẽ hữu ích. Một số cư dân lo vì trước đây chưa từng tham gia lớp vận động.
      - speaker: Instructor
        text: We can explain that everyone works at their own pace. There will be no competition and no
          pressure to copy every movement.
        vi: Mình có thể giải thích rằng mỗi người tập theo khả năng riêng. Không thi đua và không ép ai làm
          theo mọi động tác.
      - speaker: Organiser
        text: Would ten in the morning suit you? The main hall is free then, and the entrance has a ramp.
        vi: Mười giờ sáng có phù hợp không? Lúc đó hội trường chính trống và lối vào có đường dốc.
      - speaker: Instructor
        text: That is ideal. I suggest forty minutes for the first session, with a short break in the
          middle.
        vi: Rất phù hợp. Tôi đề xuất buổi đầu bốn mươi phút, có nghỉ ngắn ở giữa.
      - speaker: Organiser
        text: We can provide chairs and drinking water. Should participants bring any equipment or wear
          special clothing?
        vi: Chúng tôi có thể chuẩn bị ghế và nước uống. Người tham gia cần mang dụng cụ hay mặc đồ đặc biệt
          không?
      - speaker: Instructor
        text: No equipment is needed. Comfortable clothes and suitable shoes are enough. I will send a short
          information sheet beforehand.
        vi: Không cần dụng cụ. Quần áo thoải mái và giày phù hợp là đủ. Tôi sẽ gửi tờ thông tin ngắn trước
          buổi học.
      - speaker: Organiser
        text: How many places should we offer? We want enough room for people to move without bumping into
          each other.
        vi: Mình nên nhận bao nhiêu người? Tôi muốn đủ chỗ để mọi người vận động mà không va vào nhau.
      - speaker: Instructor
        text: Let us start with fifteen. We can review the numbers after the first month rather than fill
          the hall immediately.
        vi: Bắt đầu với mười lăm người nhé. Mình có thể xem lại số lượng sau tháng đầu thay vì nhận kín hội
          trường ngay.
      - speaker: Organiser
        text: Agreed. The first session will be free. After that, we will ask for two pounds per class to
          cover the room costs.
        vi: Đồng ý. Buổi đầu miễn phí. Sau đó mỗi buổi thu hai bảng để trả chi phí phòng.
      - speaker: Instructor
        text: That sounds reasonable. Please ask people to book by phone so we know how many chairs to
          arrange.
        vi: Như vậy hợp lý. Hãy nhờ mọi người đăng ký qua điện thoại để mình biết cần xếp bao nhiêu ghế.
    dictation:
