        explanationVi: Maya nói sẽ hoãn nếu điều kiện không an toàn.
      - type: TRUE_FALSE
        prompt: Is the statement true or false?
        promptVi: Nhận định sau đúng hay sai theo bài nghe?
        statement: They plan to finish the cleanup at eleven.
        answer: true
        explanationVi: An đề xuất làm từ chín giờ đến mười một giờ.
      - type: TRUE_FALSE
        prompt: Is the statement true or false?
        promptVi: Nhận định sau đúng hay sai theo bài nghe?
        statement: Every volunteer must appear in the group photograph.
