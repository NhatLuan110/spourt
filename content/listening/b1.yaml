  - slug: giving-feedback-on-a-presentation
    title: Giving Feedback on a Presentation
    titleVi: Góp ý cho bài thuyết trình
    topic: work
    accent: UK
    format: dialogue
    speakerCount: 2
    glossary: []
    segments:
      - speaker: Presenter
        text: Thanks for watching my practice presentation. Did the explanation of our new booking system
          make sense to you?
        vi: Cảm ơn bạn đã xem tôi tập thuyết trình. Phần giải thích hệ thống đặt chỗ mới có dễ hiểu không?
      - speaker: Colleague
        text: Mostly, yes. The example with the customer was clear, but you introduced three technical terms
          before explaining them.
        vi: Phần lớn là có. Ví dụ về khách hàng rõ ràng, nhưng bạn đưa ra ba thuật ngữ chuyên môn trước khi
          giải thích.
      - speaker: Presenter
        text: I was worried about going over the time limit. I have only ten minutes, including the
          demonstration.
        vi: Tôi lo vượt thời gian cho phép. Tôi chỉ có mười phút, tính cả phần trình diễn.
      - speaker: Colleague
        text: You finished in eight minutes, so you have some room. A short definition for each term would
          help the audience.
        vi: Bạn kết thúc trong tám phút nên vẫn còn thời gian. Một định nghĩa ngắn cho mỗi thuật ngữ sẽ giúp
