          - There are too few volunteers
        answer: The path is being repaired
        explanationVi: Lối đi gần cầu cũ đang đóng để sửa chữa.
      - type: MCQ
        prompt: What should volunteers bring themselves?
        options:
          - Rubbish bags
          - Water
          - Glass containers
          - Sorting signs
        answer: Water
        explanationVi: Túi rác và găng tay được xin từ hội đồng; tình nguyện viên mang nước riêng.
      - type: MCQ
        prompt: What should volunteers do with broken glass?
