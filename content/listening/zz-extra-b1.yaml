  - slug: arranging-an-online-class-rehearsal
    title: Arranging an Online Class Rehearsal
    titleVi: Sắp xếp buổi tổng duyệt lớp học trực tuyến
    topic: education
    accent: US
    format: dialogue
    speakerCount: 2
    glossary: []
    segments:
      - speaker: David
        text: Hi Lisa, thanks for joining this quick test session before our important virtual lecture
          tomorrow morning at nine.
        vi: Chào Lisa, cảm ơn bạn đã tham gia buổi kiểm tra nhanh này trước buổi giảng ảo quan trọng của
          chúng ta vào sáng mai lúc chín giờ.
      - speaker: Lisa
        text: No problem, David. Let us make sure the presentation software, microphone, and camera operate
          without any unexpected technical glitches.
        vi: Không có gì, David. Hãy đảm bảo phần mềm thuyết trình, micro và máy ảnh hoạt động mà không gặp
          sự cố kỹ thuật bất ngờ nào.
      - speaker: David
        text: I will start by sharing my primary slides document on the main projector screen right now.
        vi: Tôi sẽ bắt đầu bằng cách chia sẻ tài liệu slide chính của mình trên màn hình máy chiếu chính
          ngay bây giờ.
      - speaker: Lisa
        text: Wait, the screen is completely black. The system security prompt says permission is denied for
          direct file sharing.
        vi: Đợi đã, màn hình hoàn toàn đen thui. Lời nhắc bảo mật hệ thống cho biết quyền bị từ chối đối với
          việc chia sẻ tệp trực tiếp.
      - speaker: David
        text: Oh no, that is a serious problem for our live audience. Let me restart the browser application
          immediately to fix it.
        vi: Ồ không, đó là một vấn đề nghiêm trọng đối với khán giả trực tiếp của chúng ta. Để tôi khởi động
          lại ứng dụng trình duyệt ngay lập tức để sửa lỗi.
      - speaker: Lisa
        text: While you restart, I will prepare the backup PDF file and upload it to our shared cloud
          folder.
        vi: Trong lúc bạn khởi động lại, tôi sẽ chuẩn bị tệp PDF dự phòng và tải nó lên thư mục đám mây
          chung của chúng ta.
      - speaker: David
        text: I am back online now after clearing my cache. Can you see my screen clearly with the updated
          slides visible?
        vi: Tôi đã trực tuyến trở lại sau khi xóa bộ nhớ đệm. Bạn có thấy màn hình của tôi rõ ràng với các
          slide được cập nhật không?
      - speaker: Lisa
        text: Yes, the slides look crisp, but the embedded video clip in slide five refuses to play
          properly.
        vi: Có, các slide hiện rất rõ, nhưng đoạn video được nhúng ở slide số năm vẫn chưa phát được bình
          thường.
      - speaker: David
        text: That is unfortunate. If the video fails during class, we need a reliable backup plan ready.
        vi: Thật là tiếc. Nếu video bị lỗi trong giờ học, chúng ta cần chuẩn bị sẵn một kế hoạch dự phòng
          đáng tin cậy.
      - speaker: Lisa
        text: I can stream the alternative video file directly from my backup laptop if your main audio feed
          fails completely.
        vi: Tôi có thể phát trực tuyến tệp video thay thế trực tiếp từ máy tính xách tay dự phòng của mình
          nếu nguồn âm thanh chính của bạn bị hỏng hoàn toàn.
      - speaker: David
        text: Excellent solution. Let us write down these emergency steps so we do not panic during live
          instruction.
        vi: Giải pháp tuyệt vời. Hãy viết ra các bước khẩn cấp này để chúng ta không bị hoảng loạn trong khi
          giảng dạy trực tiếp.
      - speaker: Lisa
        text: Agreed, I am saving the final backup procedure document right now. We are fully prepared for
          tomorrow's successful session!
        vi: Đồng ý, tôi đang lưu tài liệu quy trình dự phòng cuối cùng ngay bây giờ. Chúng ta đã chuẩn bị
          hoàn toàn cho buổi học thành công vào ngày mai!
