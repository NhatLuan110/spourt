        definitionVi: Bền vững; duy trì được lâu dài mà không phá hỏng môi trường.
        examples:
          - en: They farm in a sustainable way, without chemicals.
            vi: Họ canh tác theo cách bền vững, không dùng hoá chất.
          - en: Cheap flights are not a sustainable habit.
            vi: Bay giá rẻ liên tục không phải một thói quen bền vững.
