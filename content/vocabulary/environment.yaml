        definitionVi: Tái chế; xử lý vật liệu đã dùng để dùng lại được.
        examples:
          - en: We recycle paper, glass and plastic at home.
            vi: Ở nhà chúng tôi tái chế giấy, thuỷ tinh và nhựa.
          - en: Only a third of household waste is recycled here.
            vi: Chỉ một phần ba rác sinh hoạt ở đây được tái chế.
