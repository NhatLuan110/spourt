          - en: Industrial chimneys release thick black soot that pollutes the city air.
            vi: Các ống khói công nghiệp thải ra muội than đen đặc làm ô nhiễm không khí thành phố.
          - en: Tiny particles of soot can penetrate deep into human lungs.
            vi: Các hạt bồ hóng li ti có thể xâm nhập sâu vào phổi con người.
  - lemma: toxin
    cefr: B2
    ipaUs: /ˈtɑːk.sɪn/
    senses:
      - pos: NOUN
        definitionEn: A poisonous substance produced within living cells or organisms.
        definitionVi: Độc tố
        examples:
          - en: Dangerous industrial toxin spilled into the bay, killing hundreds of fish.
            vi: Độc tố công nghiệp nguy hiểm đã tràn ra vịnh, làm chết hàng trăm con cá.
          - en: The chemical toxin accumulated in the fatty tissues of predators.
            vi: Độc tố hóa học tích tụ trong các mô mỡ của động vật săn mồi.
  - lemma: overfishing
    cefr: B2
    ipaUs: /ˌoʊvərˈfɪʃɪŋ/
    senses:
      - pos: NOUN
        definitionEn: The catching of too many fish, depleting ocean populations.
        definitionVi: Sự đánh bắt hải sản quá mức
        examples:
          - en: Overfishing in this region has severely reduced local cod populations.
            vi: Việc đánh bắt quá mức ở vùng này đã làm giảm nghiêm trọng số lượng cá tuyết địa phương.
          - en: Strict quotas were introduced to prevent overfishing along the coast.
            vi: Các hạn ngạch nghiêm ngặt đã được đưa ra để ngăn chặn nạn đánh bắt quá mức dọc theo bờ biển.
  - lemma: poaching
    cefr: B2
    ipaUs: /ˈpoʊtʃɪŋ/
    senses:
      - pos: NOUN
        definitionEn: Illegal hunting or capturing of wild animals.
        definitionVi: Nạn săn bắt trộm động vật hoang dã
        examples:
          - en: Poaching threatens the survival of elephants and rhinos in Africa.
            vi: Nạn săn bắt trộm đang đe dọa sự sống còn của voi và tê giác ở châu Phi.
          - en: Rangers work hard to stop poaching in the national park.
            vi: Các kiểm lâm làm việc chăm chỉ để ngăn chặn nạn săn bắt trộm trong công viên quốc gia.
  - lemma: herbicide
    cefr: C1
    ipaUs: /ˈhɜːrbɪsaɪd/
    senses:
      - pos: NOUN
        definitionEn: A chemical substance used to kill unwanted plants or weeds.
        definitionVi: Thuốc diệt cỏ
        examples:
          - en: Farmers sprayed powerful herbicide across the fields to destroy weeds.
            vi: Nông dân đã phun thuốc diệt cỏ mạnh khắp các cánh đồng để tiêu diệt cỏ dại.
          - en: The toxic herbicide washed into nearby streams during heavy rain.
            vi: Thuốc diệt cỏ độc hại đã trôi vào các dòng suối gần đó trong trận mưa lớn.
  - lemma: estuary
    cefr: C1
    ipaUs: /ˈestʃuˌeri/
    senses:
      - pos: NOUN
        definitionEn: The wide part of a river where it meets the sea.
        definitionVi: Vùng cửa sông
        examples:
          - en: Many unique bird species feed within the muddy coastal estuary.
            vi: Nhiều loài chim độc đáo kiếm ăn trong vùng cửa sông ven biển lầy lội.
          - en: The polluted estuary damaged local fish habitats and delicate ecosystems.
            vi: Vùng cửa sông bị ô nhiễm đã làm tổn hại môi trường sống của cá và các hệ sinh thái mỏng manh.
  - lemma: tundra
    cefr: B2
    ipaUs: /ˈtʌndrə/
    senses:
      - pos: NOUN
        definitionEn: A vast, flat, treeless Arctic region where the subsoil is permanently frozen.
        definitionVi: Vùng đài nguyên
        examples:
          - en: Plants in the frozen tundra grow very slowly due to cold.
            vi: Thực vật ở vùng đài nguyên lạnh giá phát triển rất chậm do trời lạnh.
          - en: Climate change rapidly alters fragile ecosystems across the arctic tundra.
            vi: Biến đổi khí hậu đang làm thay đổi nhanh chóng các hệ sinh thái mong manh khắp vùng đài nguyên
              Bắc Cực.
  - lemma: savanna
    cefr: B2
    ipaUs: /səˈvænə/
    senses:
      - pos: NOUN
        definitionEn: A grassy plain in tropical and subtropical regions with few trees.
        definitionVi: Vùng thảo nguyên
        examples:
          - en: Lions hunt zebras across the vast African savanna during dry seasons.
            vi: Sư tử săn ngựa vằn trên khắp thảo nguyên rộng lớn của châu Phi trong mùa khô.
          - en: Wildfires frequently reshape the landscape of the dry tropical savanna.
            vi: Cháy rừng thường xuyên tạo hình lại cảnh quan của vùng thảo nguyên nhiệt đới khô cằn.
  - lemma: algae
    cefr: B2
    ipaUs: /ˈældʒiː/
    senses:
      - pos: NOUN
        definitionEn: Simple plant-like organisms that live in water or damp places.
        definitionVi: Tảo
        examples:
          - en: Thick green algae covered the surface of the stagnant pond.
            vi: Tảo xanh dày đặc phủ kín mặt ao tù nước đọng.
          - en: Excessive fertilizer runoff caused harmful algae blooms in the lake.
            vi: Lượng phân bón dư thừa đã gây ra hiện tượng tảo nở hoa độc hại ở hồ.
  - lemma: pollination
    cefr: B2
    ipaUs: /ˌpɑːləˈneɪʃn/
    senses:
      - pos: NOUN
        definitionEn: The transfer of pollen to a plant to allow fertilization.
        definitionVi: Sự thụ phấn
        examples:
          - en: Bees play a crucial role in the pollination of fruit trees.
            vi: Ong đóng vai trò quan trọng trong việc thụ phấn cho cây ăn quả.
          - en: Without natural pollination, many crops would fail to produce food.
            vi: Nếu không có sự thụ phấn tự nhiên, nhiều loại cây trồng sẽ không thể sản xuất lương thực.
  - lemma: hurricane
    cefr: B1
    ipaUs: /ˈhɜːrəkeɪn/
    senses:
      - pos: NOUN
        definitionEn: A violent storm with heavy rain and high winds.
        definitionVi: Bão cuồng phong
        examples:
          - en: A powerful hurricane destroyed hundreds of coastal homes last night.
            vi: Một cơn bão cuồng phong mạnh đã phá hủy hàng trăm ngôi nhà ven biển đêm qua.
          - en: Meteorologists tracked the dangerous hurricane as it approached the mainland.
            vi: Các nhà khí tượng học đã theo dõi cơn bão cuồng phong nguy hiểm khi nó tiến vào đất liền.
  - lemma: typhoon
    cefr: B1
    ipaUs: /taɪˈfuːn/
    senses:
      - pos: NOUN
        definitionEn: A violent tropical storm that occurs in the western Pacific.
        definitionVi: Bão nhiệt đới
        examples:
          - en: The seasonal typhoon brought torrential rain and severe coastal flooding.
            vi: Cơn bão theo mùa đã mang lại lượng mưa như trút nước và ngập lụt ven biển nghiêm trọng.
          - en: Fishermen secured their boats before the approaching typhoon hit land.
            vi: Ngư dân đã buộc chặt tàu thuyền trước khi cơn bão đổ bộ vào đất liền.
  - lemma: earthquake
    cefr: A2
    ipaUs: /ˈɜːrθkweɪk/
    senses:
      - pos: NOUN
        definitionEn: A sudden and violent shaking of the ground.
        definitionVi: Trận động đất
        examples:
          - en: A sudden earthquake damaged many old buildings in the city.
            vi: Một trận động đất bất ngờ đã làm hư hại nhiều tòa nhà cổ trong thành phố.
          - en: Scientists measured the magnitude of the deep underground earthquake.
            vi: Các nhà khoa học đã đo cường độ của trận động đất sâu dưới lòng đất.
  - lemma: mining
    cefr: B1
    ipaUs: /ˈmaɪnɪŋ/
    senses:
      - pos: NOUN
        definitionEn: The process or industry of obtaining coal or other minerals from the earth.
        definitionVi: Hoạt động khai thác mỏ
        examples:
          - en: Coal mining creates serious environmental problems and air pollution locally.
            vi: Khai thác than tạo ra các vấn đề ô nhiễm không khí và môi trường nghiêm trọng tại địa phương.
          - en: Illegal gold mining poisons local rivers with toxic chemical waste.
            vi: Khai thác vàng trái phép làm ô nhiễm các con sông địa phương bằng chất thải hóa học độc hại.
  - lemma: acidification
    cefr: C1
    ipaUs: /əˌsɪdɪfɪˈkeɪʃn/
    senses:
      - pos: NOUN
        definitionEn: The ongoing decrease in the pH of the Earth's oceans.
        definitionVi: Sự axit hóa
        examples:
          - en: Ocean acidification threatens coral reefs and marine shell structures.
            vi: Sự axit hóa đại dương đe dọa các rạn san hô và cấu trúc vỏ sinh vật biển.
          - en: Carbon emissions drive rapid acidification across global marine water bodies.
            vi: Lượng khí thải carbon thúc đẩy quá trình axit hóa nhanh chóng trên các vùng nước biển toàn cầu.
  - lemma: canopy
    cefr: B2
    ipaUs: /ˈkænəpi/
    senses:
      - pos: NOUN
        definitionEn: The high, broad layer of branches and leaves formed by closely spaced forest trees.
        definitionVi: Tán rừng
        examples:
          - en: Sunlight barely penetrates the thick green canopy of the rainforest.
            vi: Ánh nắng mặt trời hầu như không xuyên qua được tán lá xanh dày đặc của rừng mưa.
          - en: Monkeys leap skillfully through the upper canopy of tall trees.
            vi: Khỉ nhảy nhót khéo léo qua tán cây phía trên của những cây cao.
  - lemma: plankton
    cefr: B2
    ipaUs: /ˈplæŋktən/
    senses:
      - pos: NOUN
        definitionEn: Small organisms that drift in oceans and fresh water.
        definitionVi: Sinh vật phù du
        examples:
          - en: Tiny ocean plankton serves as the primary food for whales.
            vi: Sinh vật phù du nhỏ bé trong đại dương là nguồn thức ăn chính cho cá voi.
          - en: Warmer sea temperatures negatively affect the growth of marine plankton.
            vi: Nhiệt độ nước biển ấm hơn ảnh hưởng tiêu cực đến sự phát triển của sinh vật phù du biển.
  - lemma: salinity
    cefr: C1
    ipaUs: /səˈlɪnəti/
    senses:
      - pos: NOUN
        definitionEn: The concentration of salt in water or soil.
        definitionVi: Độ mặn
        examples:
          - en: High soil salinity prevents many common agricultural crops from growing.
            vi: Độ mặn của đất cao ngăn cản nhiều loại cây trồng nông nghiệp thông thường phát triển.
          - en: Scientists monitor water salinity levels inside the changing coastal bay.
            vi: Các nhà khoa học theo dõi mức độ độ mặn của nước bên trong vịnh ven biển đang thay đổi.
  - lemma: biosphere
    cefr: C1
    ipaUs: /ˈbaɪəsfɪr/
    senses:
      - pos: NOUN
        definitionEn: The regions of the surface, atmosphere, and hydrosphere inhabited by living organisms.
        definitionVi: Sinh quyển
        examples:
          - en: Human activities cause significant damage to the global natural biosphere.
            vi: Các hoạt động của con người gây ra thiệt hại đáng kể cho sinh quyển tự nhiên toàn cầu.
          - en: Scientists study how energy flows through Earth's complex biosphere daily.
            vi: Các nhà khoa học nghiên cứu cách năng lượng luân chuyển qua sinh quyển phức tạp của Trái Đất
              hàng ngày.
  - lemma: atmosphere
    cefr: B1
    ipaUs: /ˈætməsfɪr/
    senses:
      - pos: NOUN
        definitionEn: The envelope of gases surrounding the Earth or another planet.
        definitionVi: Bầu khí quyển
        examples:
          - en: Greenhouse gases trap heat inside the Earth's delicate warming atmosphere.
            vi: Khí nhà kính giữ nhiệt bên trong bầu khí quyển đang ấm lên mỏng manh của Trái Đất.
          - en: Thick clouds filled the stormy atmosphere before the rain started.
            vi: Những đám mây dày đặc lấp đầy bầu khí quyển giông bão trước khi trời bắt đầu mưa.
  - lemma: forest
    cefr: A1
    ipaUs: /ˈfɔːrɪst/
    senses:
      - pos: NOUN
        definitionEn: A large area covered chiefly with trees and undergrowth.
        definitionVi: Khu rừng
        examples:
          - en: Walking through the quiet green forest provides great mental relaxation.
            vi: Đi bộ qua khu rừng xanh yên tĩnh mang lại sự thư giãn tinh thần tuyệt vời.
          - en: Deforestation destroys vast areas of native forest every single year.
            vi: Phá rừng hủy hoại những khu rừng bản địa rộng lớn mỗi năm.
  - lemma: river
    cefr: A1
    ipaUs: /ˈrɪvər/
    senses:
      - pos: NOUN
        definitionEn: A large natural stream of water flowing in a channel to the sea.
        definitionVi: Dòng sông
        examples:
          - en: Clean water flows steadily down the winding mountain river channel.
            vi: Nguồn nước sạch chảy đều đặn xuống lòng sông núi uốn khúc.
          - en: Local factories dumped industrial waste directly into the flowing river.
            vi: Các nhà máy địa phương đã xả chất thải công nghiệp trực tiếp xuống dòng sông đang chảy.
  - lemma: ocean
    cefr: A1
    ipaUs: /ˈoʊʃən/
    senses:
      - pos: NOUN
        definitionEn: A very large expanse of salt water covering most of the Earth.
        definitionVi: đại dương
        examples:
          - en: The blue ocean is home to millions of unique marine species.
            vi: Đại dương xanh thẳm là nhà của hàng triệu loài sinh vật biển độc đáo.
          - en: Strong winds across the open ocean create huge waves today.
            vi: Những cơn gió mạnh trên khắp đại dương mở tạo ra những con sóng lớn hôm nay.
  - lemma: lake
    cefr: A1
    ipaUs: /leɪk/
    senses:
      - pos: NOUN
        definitionEn: A large body of fresh water surrounded by land.
        definitionVi: hồ
        examples:
          - en: We love walking around the quiet lake during sunset hours.
            vi: Chúng tôi rất thích đi dạo quanh hồ yên tĩnh trong những giờ hoàng hôn.
          - en: Clear blue water fills the deep mountain lake completely today.
            vi: Nước xanh trong vắt lấp đầy hoàn toàn hồ nước trên núi sâu hôm nay.
  - lemma: sea
    cefr: A1
    ipaUs: /siː/
    senses:
      - pos: NOUN
        definitionEn: The expanse of salt water that covers most of the earth's surface.
        definitionVi: biển
        examples:
          - en: Gulls fly high above the calm blue sea every morning.
            vi: Những con mòng biển bay cao trên mặt biển xanh lặng gió mỗi sáng.
          - en: Fish swim freely in the vast and deep open sea.
            vi: Cá bơi lội tự do trong vùng biển mở rộng lớn và sâu thẳm.
  - lemma: beach
    cefr: A1
    ipaUs: /biːtʃ/
    senses:
      - pos: NOUN
        definitionEn: A shore of a body of water covered by sand or pebbles.
        definitionVi: bãi biển
        examples:
          - en: Children build sandcastles on the sunny beach all afternoon long.
            vi: Trẻ em xây lâu đài cát trên bãi biển đầy nắng suốt cả buổi chiều.
          - en: Volunteers gathered to clean up trash along the public beach.
            vi: Các tình nguyện viên đã tập trung để dọn rác dọc theo bãi biển công cộng.
  - lemma: soil
    cefr: A2
    ipaUs: /sɔɪl/
    senses:
      - pos: NOUN
        definitionEn: The upper layer of earth in which plants grow.
        definitionVi: đất
        examples:
          - en: Rich soil provides essential nutrients for growing healthy garden vegetables.
            vi: Đất màu mỡ cung cấp các chất dinh dưỡng thiết yếu để trồng rau vườn khỏe mạnh.
          - en: Heavy rain can wash away loose soil from steep hills.
            vi: Mưa lớn có thể cuốn trôi lớp đất tơi xốp từ những ngọn đồi dốc.
  - lemma: tree
    cefr: A1
    ipaUs: /triː/
    senses:
      - pos: NOUN
        definitionEn: A woody perennial plant having a single main stem or trunk.
        definitionVi: cây
        examples:
          - en: A tall green tree provides cool shade on hot days.
            vi: Một cái cây xanh cao lớn tạo ra bóng mát dễ chịu vào những ngày nóng.
          - en: Birds build small nests high up in the old tree.
            vi: Chim chóc xây những chiếc tổ nhỏ ở trên cao trên cây cổ thụ.
  - lemma: plant
    cefr: A1
    ipaUs: /plænt/
    senses:
      - pos: NOUN
        definitionEn: A living organism of the kind that grows in a permanent site.
        definitionVi: thực vật
        examples:
          - en: Every indoor plant needs proper sunlight and regular weekly watering.
            vi: Mỗi loại thực vật trong nhà đều cần ánh sáng mặt trời phù hợp và tưới nước hàng tuần.
          - en: She bought a small green plant for her office desk.
            vi: Cô ấy đã mua một chậu cây xanh nhỏ cho bàn làm việc ở văn phòng.
  - lemma: animal
    cefr: A1
    ipaUs: /ˈænɪməl/
    senses:
      - pos: NOUN
        definitionEn: A living organism that feeds on organic matter, typically having senses and mobility.
        definitionVi: động vật
        examples:
          - en: Every wild animal deserves a safe and protected natural habitat.
            vi: Mỗi loài động vật hoang dã đều xứng đáng có một môi trường sống tự nhiên được bảo vệ an toàn.
          - en: The nature reserve protects many rare animal species from hunters.
            vi: Khu bảo tồn thiên nhiên bảo vệ nhiều loài động vật quý hiếm khỏi những kẻ săn trộm.
  - lemma: insect
    cefr: A2
    ipaUs: /ˈɪnsɛkt/
    senses:
      - pos: NOUN
        definitionEn: A small arthropod animal with six legs and generally one or two pairs of wings.
        definitionVi: côn trùng
        examples:
          - en: A tiny insect crawled quickly across the wooden picnic table.
            vi: Một con côn trùng nhỏ xíu bò nhanh qua chiếc bàn dã ngoại bằng gỗ.
          - en: Some beneficial insect species help pollinate flowers in our gardens.
            vi: Một số loài côn trùng có ích giúp thụ phấn cho hoa trong các khu vườn của chúng ta.
  - lemma: ranger
    cefr: B1
    ipaUs: /ˈreɪndʒər/
    senses:
      - pos: NOUN
        definitionEn: A person whose job is to manage and protect a forest or national park.
        definitionVi: kiểm lâm
        examples:
          - en: The forest ranger patrols the national park to stop poachers.
            vi: Nhân viên kiểm lâm tuần tra công viên quốc gia để ngăn chặn những kẻ săn trộm.
          - en: A friendly park ranger guided hikers along the mountain trail.
            vi: Một hướng dẫn viên kiểm lâm thân thiện đã dẫn đường cho những người đi leo núi.
  - lemma: litter
    cefr: B1
    ipaUs: /ˈlɪtər/
    senses:
      - pos: NOUN
        definitionEn: Rubbish carelessly dropped in public places.
        definitionVi: rác vứt bừa bãi
        examples:
          - en: Leaving plastic litter on the grass ruins our public parks.
            vi: Việc vứt rác nhựa bừa bãi trên bãi cỏ làm hủy hoại các công viên công cộng.
          - en: City officials imposed heavy fines for dropping street litter everywhere.
            vi: Các quan chức thành phố đã áp dụng mức phạt nặng vì hành vi vứt rác đường phố.
  - lemma: plastic
    cefr: A2
    ipaUs: /ˈplæstɪk/
    senses:
      - pos: ADJECTIVE
        definitionEn: Made of a synthetic material that can be molded into various shapes.
        definitionVi: bằng nhựa
        examples:
          - en: Many grocery stores have stopped providing single-use plastic bags.
            vi: Nhiều cửa hàng tạp hóa đã ngừng cung cấp túi nhựa dùng một lần.
          - en: Please recycle your empty plastic bottles in the blue bin.
            vi: Hãy tái chế những chai nhựa rỗng của bạn vào thùng đựng màu xanh.
  - lemma: reusable
    cefr: B1
    ipaUs: /riːˈjuːzəbəl/
    senses:
      - pos: ADJECTIVE
        definitionEn: Able to be used again or more than once.
        definitionVi: có thể tái sử dụng
        examples:
          - en: Using a reusable water bottle helps reduce daily plastic waste.
            vi: Sử dụng bình nước có thể tái sử dụng giúp giảm thiểu rác thải nhựa hàng ngày.
          - en: Shoppers should bring reusable bags when visiting the local supermarket.
            vi: Người mua sắm nên mang theo túi có thể tái sử dụng khi đến siêu thị địa phương.
  - lemma: reuse
    cefr: B1
    ipaUs: /riːˈjuːz/
    senses:
      - pos: VERB
        definitionEn: Use something again, especially in a different way or after converting.
        definitionVi: tái sử dụng
        examples:
          - en: Families can reuse glass jars to store homemade food items.
            vi: Các gia đình có thể tái sử dụng lọ thủy tinh để đựng các món ăn tự làm.
          - en: It is important to reduce, reuse, and recycle household waste daily.
            vi: Điều quan trọng là phải giảm thiểu, tái sử dụng và tái chế rác thải sinh hoạt hàng ngày.
  - lemma: cleanup
    cefr: B1
    ipaUs: /ˈkliːnʌp/
    senses:
      - pos: NOUN
        definitionEn: An act of making a place clean and tidy.
        definitionVi: sự dọn dẹp
        examples:
          - en: The neighborhood organized a weekend cleanup along the polluted river.
            vi: Khu phố đã tổ chức một buổi dọn dẹp vào cuối tuần dọc theo con sông bị ô nhiễm.
          - en: Volunteers gathered early Saturday morning for the beach cleanup event.
            vi: Các tình nguyện viên tập trung vào sáng sớm thứ Bảy cho sự kiện dọn dẹp bãi biển.
  - lemma: sanitation
    cefr: B2
    ipaUs: /ˌsænɪˈteɪʃən/
    senses:
      - pos: NOUN
        definitionEn: Conditions relating to public health, especially the provision of clean drinking water
          and adequate sewage disposal.
        definitionVi: hệ thống vệ sinh
        examples:
          - en: Good public sanitation prevents the spread of dangerous waterborne diseases.
            vi: Hệ thống vệ sinh công cộng tốt ngăn ngừa sự lây lan của các bệnh nguy hiểm qua đường nước.
          - en: The city council improved rural sanitation by building modern facilities.
            vi: Hội đồng thành phố đã cải thiện vệ sinh nông thôn bằng cách xây dựng các cơ sở hiện đại.
  - lemma: energy
    cefr: A2
    ipaUs: /ˈɛnərdʒi/
    senses:
      - pos: NOUN
        definitionEn: Power derived from the utilization of physical or chemical resources, especially to
          provide light and heat.
        definitionVi: năng lượng
        examples:
          - en: Solar power is a clean and renewable source of energy.
            vi: Năng lượng mặt trời là một nguồn năng lượng sạch và có thể tái tạo.
          - en: Turning off unused lights helps conserve electrical energy at home.
            vi: Tắt các đèn không sử dụng giúp tiết kiệm năng lượng điện ở nhà.
  - lemma: electricity
    cefr: A2
    ipaUs: /ɪˌlɛkˈtrɪsəti/
    senses:
      - pos: NOUN
        definitionEn: A form of energy resulting from the existence of charged particles.
        definitionVi: điện
        examples:
          - en: Lightning storms can sometimes knock out local electricity for hours.
            vi: Các cơn giông sét đôi khi có thể làm mất điện cục bộ trong nhiều giờ.
          - en: Modern homes rely heavily on electricity for daily appliances.
            vi: Các ngôi nhà hiện đại phụ thuộc nhiều vào điện cho các thiết bị hàng ngày.
  - lemma: coal
    cefr: B1
    ipaUs: /koʊl/
    senses:
      - pos: NOUN
        definitionEn: A combustible black rock used as a fossil fuel.
        definitionVi: than đá
        examples:
          - en: Burning fossil fuels like coal releases harmful greenhouse gases daily.
            vi: Đốt các nhiên liệu hóa thạch như than đá thải ra các khí nhà kính có hại hàng ngày.
          - en: Many older power plants generated electricity by burning coal.
            vi: Nhiều nhà máy điện cũ hơn đã sản xuất điện bằng cách đốt than đá.
