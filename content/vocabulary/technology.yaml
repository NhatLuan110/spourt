  - lemma: download
    cefr: A2
    frequencyRank: 4100
    ipaUs: /ˈdaʊnloʊd/
    ipaUk: /ˈdaʊnləʊd/
    syllables: down·load
    stressPattern: '10'
    subtopics: [internet]
    senses:
      - pos: VERB
        definitionEn: To copy a file from the internet onto your own device.
        definitionVi: Tải xuống; chép tệp từ internet về máy của mình.
        examples:
          - en: It took two minutes to download the whole album.
            vi: Mất hai phút để tải xuống cả album.
          - en: Do not download files from sites you do not trust.
            vi: Đừng tải tệp từ những trang bạn không tin tưởng.
        synonyms: [save]
