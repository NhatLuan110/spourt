        definitionEn: A file that has been copied from the internet.
        definitionVi: Tệp đã tải xuống.
        examples:
          - en: The download finished while I was making coffee.
            vi: Tệp tải xong trong lúc tôi pha cà phê.
          - en: Check your downloads folder for the receipt.
            vi: Kiểm tra thư mục tải xuống để tìm hoá đơn.

