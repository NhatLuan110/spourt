    ipaUs: /ˈbɪznəs/
    senses:
      - pos: NOUN
        definitionEn: The activity of making, buying, or selling goods or services for money.
        definitionVi: Việc kinh doanh
        examples:
          - en: He decided to open a small retail business in his hometown.
            vi: Anh ấy quyết định mở một doanh nghiệp bán lẻ nhỏ ở quê nhà.
          - en: Good customer service is essential for running a successful retail business.
            vi: Dịch vụ khách hàng tốt là điều cần thiết để điều hành một việc kinh doanh bán lẻ thành công.
