            vi: Các bác sĩ phải phẫu thuật sửa chữa dây chằng bị tổn thương để phục hồi khả năng di chuyển của
              chân.
  - lemma: skin
    cefr: A1
    ipaUs: /skɪn/
    senses:
      - pos: NOUN
        definitionEn: The natural outer covering of the human body.
        definitionVi: da
        examples:
          - en: Protect your sensitive skin from harsh sunlight using high SPF sunscreen.
            vi: Hãy bảo vệ làn da nhạy cảm của bạn khỏi ánh nắng gắt bằng kem chống nắng có chỉ số SPF cao.
          - en: A sudden rash on her skin indicated a mild allergic reaction.
            vi: Vết phát ban đột ngột trên da cho thấy cô ấy bị dị ứng nhẹ.
  - lemma: nerve
    cefr: B1
    ipaUs: /nɜrv/
    senses:
      - pos: NOUN
        definitionEn: A fiber transmitting impulses of sensation through the body.
        definitionVi: dây thần kinh
        examples:
          - en: The dentist hit a sensitive nerve while filling my aching tooth.
            vi: Nha sĩ đã chạm vào dây thần kinh nhạy cảm khi hàn chiếc răng đang đau của tôi.
          - en: Chronic back pain often results from a pinched nerve near the spine.
            vi: Đau lưng mãn tính thường do dây thần kinh bị chèn ép gần cột sống.
  - lemma: brain
    cefr: A2
    ipaUs: /breɪn/
    senses:
      - pos: NOUN
        definitionEn: The organ of soft nervous tissue inside the skull.
        definitionVi: não
        examples:
          - en: The human brain consumes a large amount of energy every single day.
            vi: Bộ não con người tiêu thụ một lượng lớn năng lượng mỗi ngày.
          - en: Doctors perform complex surgery to treat injuries deep inside the human brain.
            vi: Các bác sĩ thực hiện phẫu thuật phức tạp để điều trị chấn thương sâu bên trong bộ não con người.
  - lemma: disease
    cefr: B1
    ipaUs: /dɪˈziːz/
    senses:
      - pos: NOUN
        definitionEn: A disorder of structure or function in a human.
        definitionVi: bệnh tật
        examples:
          - en: Scientists work hard to find a lasting cure for this deadly disease.
            vi: Các nhà khoa học làm việc chăm chỉ để tìm ra phương pháp chữa trị lâu dài cho căn bệnh chết
              người này.
          - en: Regular physical exercise helps prevent chronic heart disease as you age.
            vi: Tập thể dục thường xuyên giúp ngăn ngừa bệnh tim mãn tính khi bạn già đi.
  - lemma: illness
    cefr: A2
    ipaUs: /ˈɪlnɪs/
    senses:
      - pos: NOUN
        definitionEn: A disease or period of sickness affecting the body.
        definitionVi: sự ốm đau
        examples:
          - en: She took a week off work to recover from a viral illness.
            vi: Cô ấy đã nghỉ làm một tuần để hồi phục sau một trận ốm do virus.
          - en: Mental illness requires as much professional care as physical health conditions.
            vi: Bệnh tâm thần đòi hỏi sự chăm sóc chuyên nghiệp nhiều như các tình trạng sức khỏe thể chất.
  - lemma: virus
    cefr: A2
    ipaUs: /ˈvaɪrəs/
    senses:
      - pos: NOUN
        definitionEn: An infective agent that typically consists of a nucleic acid molecule in a protein coat.
        definitionVi: vi-rút
        examples:
          - en: This new flu virus spreads rapidly through the local school community.
            vi: Loại virus cúm mới này lây lan nhanh chóng qua cộng đồng trường học địa phương.
          - en: Antibiotics cannot cure infections caused by a dangerous microscopic virus.
            vi: Thuốc kháng sinh không thể chữa khỏi các bệnh nhiễm trùng do một loại vi-rút vi mô nguy hiểm gây
              ra.
  - lemma: bacteria
    cefr: B1
    ipaUs: /bækˈtɪriə/
    senses:
      - pos: NOUN
        definitionEn: Microscopic living organisms that can cause disease or fermentation.
        definitionVi: vi khuẩn
        examples:
          - en: Harmful bacteria in spoiled food can cause severe stomach poisoning.
            vi: Vi khuẩn có hại trong thức ăn ôi thiu có thể gây ngộ độc dạ dày nghiêm trọng.
          - en: Doctors prescribe strong antibiotics to kill harmful bacteria inside the patient.
            vi: Bác sĩ kê đơn thuốc kháng sinh mạnh để tiêu diệt vi khuẩn có hại bên trong cơ thể bệnh nhân.
  - lemma: germ
    cefr: B2
    ipaUs: /dʒɜrm/
    senses:
      - pos: NOUN
        definitionEn: A microorganism that causes disease.
        definitionVi: mầm bệnh
        examples:
          - en: Wash your hands thoroughly with soap to remove every hidden germ.
            vi: Hãy rửa tay thật kỹ bằng xà phòng để loại bỏ mọi mầm bệnh ẩn giấu.
          - en: Children often pick up a germ while playing outside in dirt.
            vi: Trẻ em thường nhiễm mầm bệnh khi chơi đùa bên ngoài đất cát.
  - lemma: epidemic
    cefr: B2
    ipaUs: /ˌepɪˈdemɪk/
    senses:
      - pos: NOUN
        definitionEn: A widespread occurrence of an infectious disease in a community.
        definitionVi: dịch bệnh
        examples:
          - en: The government declared a national emergency to control the sudden flu epidemic.
            vi: Chính phủ tuyên bố tình trạng khẩn cấp quốc gia để kiểm soát dịch bệnh cúm bùng phát đột ngột.
          - en: Public health officials took urgent measures to stop the dangerous cholera epidemic.
            vi: Các quan chức y tế công cộng đã thực hiện các biện pháp khẩn cấp để ngăn chặn dịch bệnh tả nguy
              hiểm.
  - lemma: quarantine
    cefr: B2
    ipaUs: /ˈkwɔrəntin/
    senses:
      - pos: NOUN
        definitionEn: A state of isolation imposed to prevent the spread of disease.
        definitionVi: sự cách ly
        examples:
          - en: International travelers had to spend two weeks in strict quarantine upon arrival.
            vi: Du khách quốc tế phải dành hai tuần để cách ly nghiêm ngặt ngay sau khi đến nơi.
          - en: Pets brought into the country must complete a mandatory quarantine period.
            vi: Thú cưng mang vào nước này phải hoàn thành thời gian cách ly bắt buộc.
  - lemma: treatment
    cefr: B1
    ipaUs: /ˈtriːtmənt/
    senses:
      - pos: NOUN
        definitionEn: Medical care given to a patient for an illness or injury.
        definitionVi: sự điều trị
        examples:
          - en: Early cancer treatment significantly increases the chances of complete recovery.
            vi: Điều trị ung thư sớm làm tăng đáng kể cơ hội hồi phục hoàn toàn.
          - en: The hospital offers advanced medical treatment for patients with severe injuries.
            vi: Bệnh viện cung cấp phương pháp điều trị y tế tiên tiến cho bệnh nhân bị thương nặng.
  - lemma: healing
    cefr: C1
    ipaUs: /ˈhiːlɪŋ/
    senses:
      - pos: NOUN
        definitionEn: The process of making or becoming sound or healthy again.
        definitionVi: quá trình chữa lành
        examples:
          - en: Proper nutrition and rest accelerate the natural healing of broken bones.
            vi: Dinh dưỡng và nghỉ ngơi hợp lý thúc đẩy quá trình chữa lành tự nhiên của xương gãy.
          - en: Emotional healing after a major loss takes time and professional support.
            vi: Quá trình chữa lành cảm xúc sau một mất mát lớn cần có thời gian và sự hỗ trợ chuyên nghiệp.
  - lemma: remedy
    cefr: B2
    ipaUs: /ˈremədi/
    senses:
      - pos: NOUN
        definitionEn: A medicine or treatment for a disease or injury.
        definitionVi: phương thuốc
        examples:
          - en: Honey and lemon provide a traditional home remedy for a sore throat.
            vi: Mật ong và chanh cung cấp một phương thuốc dân gian truyền thống chữa đau họng.
          - en: She searched for a natural remedy to relieve her chronic headaches.
            vi: Cô ấy tìm kiếm một phương thuốc tự nhiên để giảm những cơn đau đầu mãn tính.
  - lemma: ointment
    cefr: B2
    ipaUs: /ˈɔɪntmənt/
    senses:
      - pos: NOUN
        definitionEn: A smooth substance rubbed on the skin for healing or as a cosmetic.
        definitionVi: thuốc mỡ
        examples:
          - en: Apply this soothing ointment twice daily to heal your skin rash.
            vi: Thoa loại thuốc mỡ làm dịu này hai lần mỗi ngày để chữa lành vết phát ban trên da.
          - en: The pharmacist recommended a medicated ointment for the painful burn.
            vi: Dược sĩ đã giới thiệu một loại thuốc mỡ y tế dành cho vết bỏng đau rát.
  - lemma: cream
    cefr: A2
    ipaUs: /kriːm/
    senses:
      - pos: NOUN
        definitionEn: A thick liquid or substance applied to the skin.
        definitionVi: kem bôi da
        examples:
          - en: Rub this moisturizing cream gently onto your dry hands every night.
            vi: Thoa nhẹ nhàng loại kem dưỡng ẩm này lên đôi tay khô của bạn mỗi tối.
          - en: The doctor prescribed a steroid cream to reduce the itchy inflammation.
            vi: Bác sĩ kê đơn một loại kem chứa steroid để giảm tình trạng viêm ngứa.
  - lemma: bandage
    cefr: A2
    ipaUs: /ˈbændɪdʒ/
    senses:
      - pos: NOUN
        definitionEn: A strip of woven material used to bind up a wound.
        definitionVi: băng y tế
        examples:
          - en: He wrapped a clean bandage around his injured bleeding finger.
            vi: Anh ấy quấn một dải băng y tế sạch quanh ngón tay bị thương đang chảy máu.
          - en: She applied a sterile bandage to cover the deep cut.
            vi: Cô ấy dán một miếng băng y tế vô trùng để che vết cắt sâu.
  - lemma: gauze
    cefr: C1
    ipaUs: /ɡɔːz/
    senses:
      - pos: NOUN
        definitionEn: A thin, transparent fabric used for dressings and bandages.
        definitionVi: vải gạc
        examples:
          - en: Cover the open wound with sterile gauze before taping it down.
            vi: Phủ lên vết thương hở bằng vải gạc vô trùng trước khi dán băng dính lại.
          - en: The surgeon used absorbent gauze to clean blood from the incision.
            vi: Bác sĩ phẫu thuật đã dùng vải gạc thấm hút để lau sạch máu ở vết mổ.
  - lemma: plaster
    cefr: B1
    ipaUs: /ˈplæstər/
    senses:
      - pos: NOUN
        definitionEn: A small adhesive strip used to cover minor cuts and wounds.
        definitionVi: băng cá nhân
        examples:
          - en: Put a small adhesive plaster over that tiny cut on your finger.
            vi: Hãy dán một miếng băng cá nhân nhỏ lên vết cắt tí hon trên ngón tay bạn.
          - en: She placed a colorful plaster on her son's scraped knee.
            vi: Cô ấy dán một miếng băng cá nhân đầy màu sắc lên đầu gối bị trầy xước của con trai.
  - lemma: stretcher
    cefr: B2
    ipaUs: /ˈstrɛtʃər/
    senses:
      - pos: NOUN
        definitionEn: An apparatus used for moving a sick or injured person.
        definitionVi: cáng cứu thương
        examples:
          - en: Paramedics carefully placed the injured skier onto a sturdy metal stretcher.
            vi: Các nhân viên y tế cẩn thận đặt vận động viên trượt tuyết bị thương lên một chiếc cáng cứu
              thương kim loại chắc chắn.
          - en: The rescue team carried the wounded hiker down the mountain on a stretcher.
            vi: Đội cứu hộ đã khiêng người đi bộ đường dài bị thương xuống núi bằng một chiếc cáng cứu thương.
  - lemma: wheelchair
    cefr: A2
    ipaUs: /ˈwiːl.tʃer/
    senses:
      - pos: NOUN
        definitionEn: A chair with wheels used by people who cannot walk.
        definitionVi: Xe lăn
        examples:
          - en: He had to use a wheelchair after breaking both of his legs.
            vi: Anh ấy phải dùng xe lăn sau khi bị gãy cả hai chân.
          - en: The hospital provides a wheelchair for elderly patients upon arrival.
            vi: Bệnh viện cung cấp xe lăn cho bệnh nhân lớn tuổi khi đến.
  - lemma: crutch
    cefr: B1
    ipaUs: /krʌtʃ/
    senses:
      - pos: NOUN
        definitionEn: A stick that you put under your arm to help you walk when injured.
        definitionVi: Nạng chống
        examples:
          - en: She walked across the room carefully using a single crutch.
            vi: Cô ấy cẩn thận bước qua phòng bằng một chiếc nạng chống.
          - en: He learned how to move around smoothly with a crutch.
            vi: Anh ấy đã học cách di chuyển trôi chảy bằng một chiếc nạng.
  - lemma: ambulance
    cefr: A2
    ipaUs: /ˈæm.bjə.ləns/
    senses:
      - pos: NOUN
        definitionEn: A vehicle equipped to take sick or injured people to the hospital.
        definitionVi: Xe cứu thương
        examples:
          - en: An ambulance rushed the severe accident victim to the emergency room.
            vi: Một chiếc xe cứu thương đã đưa nạn nhân tai nạn nặng đến phòng cấp cứu.
          - en: We heard the loud siren of an ambulance approaching the street.
            vi: Chúng tôi nghe thấy tiếng còi lớn của một chiếc xe cứu thương đang đến gần.
  - lemma: paramedic
    cefr: B1
    ipaUs: /ˌper.əˈmed.ɪk/
    senses:
      - pos: NOUN
        definitionEn: A trained medical professional who provides emergency care before hospital treatment.
        definitionVi: Nhân viên y tế cấp cứu
        examples:
          - en: The paramedic gave him oxygen while driving to the medical center.
            vi: Nhân viên y tế cấp cứu đã cho anh ấy thở oxy trong lúc lái xe đến trung tâm y tế.
          - en: A skilled paramedic can save lives during unexpected medical emergencies outside.
            vi: Một nhân viên y tế cấp cứu lành nghề có thể cứu mạng trong các trường hợp khẩn cấp bất ngờ bên
              ngoài.
  - lemma: surgeon
    cefr: B1
    ipaUs: /ˈsɝː.dʒən/
    senses:
      - pos: NOUN
        definitionEn: A doctor who is specially trained to perform operations in a hospital.
        definitionVi: Bác sĩ phẫu thuật
        examples:
          - en: The leading surgeon successfully completed the complex heart operation this morning.
            vi: Bác sĩ phẫu thuật hàng đầu đã hoàn thành thành công ca phẫu thuật tim phức tạp sáng nay.
          - en: She decided to train hard to become a qualified orthopedic surgeon.
            vi: Cô ấy quyết định luyện tập chăm chỉ để trở thành một bác sĩ phẫu thuật chỉnh hình đủ điều kiện.
  - lemma: dentist
    cefr: A1
    ipaUs: /ˈden.tɪst/
    senses:
      - pos: NOUN
        definitionEn: A doctor who is trained to examine and treat teeth and gums.
        definitionVi: Nha sĩ
        examples:
          - en: You should visit your dentist every six months for a routine cleaning.
            vi: Bạn nên đến gặp nha sĩ sáu tháng một lần để làm sạch định kỳ.
          - en: The friendly dentist explained every step before pulling out her bad tooth.
            vi: Nha sĩ thân thiện đã giải thích từng bước trước khi nhổ chiếc răng sâu của cô ấy.
  - lemma: specialist
    cefr: B1
    ipaUs: /ˈspeʃ.əl.ɪst/
    senses:
      - pos: NOUN
        definitionEn: A doctor who focuses on one particular area of medical science.
        definitionVi: Bác sĩ chuyên khoa
        examples:
          - en: My family doctor referred me to a heart specialist for further tests.
            vi: Bác sĩ gia đình đã giới thiệu tôi đến một bác sĩ chuyên khoa tim để kiểm tra thêm.
          - en: Finding the right medical specialist can take several weeks of waiting.
            vi: Việc tìm kiếm đúng bác sĩ chuyên khoa y tế có thể mất vài tuần chờ đợi.
  - lemma: pharmacist
    cefr: B1
    ipaUs: /ˈfɑːr.mə.sɪst/
    senses:
      - pos: NOUN
        definitionEn: A person who is professionally qualified to prepare and dispense medications.
        definitionVi: Dược sĩ
        examples:
          - en: The helpful pharmacist explained how to take the prescribed antibiotic safely.
            vi: Dược sĩ nhiệt tình đã giải thích cách uống thuốc kháng sinh theo toa một cách an toàn.
          - en: Always consult a pharmacist if you have questions about over-the-counter pills.
            vi: Luôn tham khảo ý kiến dược sĩ nếu bạn có thắc mắc về các loại thuốc không kê đơn.
  - lemma: checkup
    cefr: B1
    ipaUs: /ˈtʃek.ʌp/
    senses:
      - pos: NOUN
        definitionEn: A general medical examination to check your overall health status.
        definitionVi: Buổi khám sức khỏe định kỳ
        examples:
          - en: He goes for a physical checkup at the clinic once a year.
            vi: Anh ấy đi khám sức khỏe định kỳ tại phòng khám một lần mỗi năm.
          - en: The annual health checkup helps discover potential issues early on.
            vi: Buổi khám sức khỏe định kỳ hàng năm giúp phát hiện các vấn đề tiềm ẩn từ sớm.
  - lemma: screening
    cefr: B2
    ipaUs: /ˈskriː.nɪŋ/
    senses:
      - pos: NOUN
        definitionEn: Testing people for diseases before they show any physical symptoms.
        definitionVi: Sàng lọc bệnh
        examples:
          - en: Early cancer screening can significantly improve treatment outcomes for patients.
            vi: Sàng lọc ung thư sớm có thể cải thiện đáng kể kết quả điều trị cho bệnh nhân.
          - en: The community center offers free cholesterol screening for senior citizens.
            vi: Trung tâm cộng đồng cung cấp dịch vụ sàng lọc cholesterol miễn phí cho người cao tuổi.
  - lemma: first aid
    cefr: B1
    ipaUs: /ˈfɝːst.eɪd/
    senses:
      - pos: NOUN
        definitionEn: Basic medical treatment given to someone before a doctor arrives.
        definitionVi: Sơ cứu
        examples:
          - en: Knowing basic first-aid skills can help you save someone in danger.
            vi: Việc nắm vững các kỹ năng sơ cứu cơ bản có thể giúp bạn cứu ai đó đang gặp nguy hiểm.
          - en: The teacher applied first-aid to the student who scraped his knee.
            vi: Giáo viên đã thực hiện sơ cứu cho học sinh bị trầy đầu gối.
