    frequencyRank: 7000
    ipaUs: /ˈsɪmptəm/
    ipaUk: /ˈsɪmptəm/
    syllables: symp·tom
    stressPattern: '10'
    subtopics: [symptoms]
    senses:
      - pos: NOUN
        definitionEn: A sign in your body that shows you may be ill.
        definitionVi: Triệu chứng; dấu hiệu trên cơ thể cho thấy bạn có thể bị bệnh.
        examples:
          - en: A dry cough is the first symptom for many people.
            vi: Ho khan là triệu chứng đầu tiên ở nhiều người.
          - en: Tell the doctor about every symptom, even small ones.
            vi: Hãy kể với bác sĩ mọi triệu chứng, kể cả những dấu hiệu nhỏ.

