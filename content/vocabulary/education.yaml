  - lemma: eraser
    cefr: A1
    ipaUs: /ɪˈreɪsər/
    senses:
      - pos: NOUN
        definitionEn: An object used to rub out marks made by pencil or chalk.
        definitionVi: Cục tẩy
        examples:
          - en: He used a rubber eraser to correct mistakes in his math notebook.
            vi: Anh ấy đã dùng cục tẩy cao su để sửa những lỗi sai trong vở toán của mình.
          - en: Can you please pass me the blackboard eraser sitting on the desk?
            vi: Bạn có thể làm ơn đưa cho tôi cục tẩy bảng đen đang đặt trên bàn không?
  - lemma: backpack
    cefr: A1
    ipaUs: /ˈbækpæk/
    senses:
      - pos: NOUN
        definitionEn: A bag carried on the back using two straps.
        definitionVi: Ba lô
        examples:
          - en: Students carry heavy books inside a sturdy canvas backpack to school.
            vi: Học sinh mang sách nặng bên trong một chiếc ba lô vải bền đến trường.
          - en: He packed his laptop and clothes into a travel backpack for camping.
            vi: Anh ấy xếp máy tính xách tay và quần áo vào ba lô du lịch để cắm trại.
  - lemma: preschool
    cefr: A2
    ipaUs: /ˈpriːskuːl/
    senses:
      - pos: NOUN
        definitionEn: A school for children too young for elementary school.
        definitionVi: Trường mầm non
        examples:
          - en: My little daughter loves playing games with friends at her local preschool.
            vi: Con gái nhỏ của tôi rất thích chơi trò chơi với các bạn ở trường mầm non địa phương.
          - en: Teachers at the preschool focus on basic social skills and creative play.
            vi: Các giáo viên ở trường mầm non tập trung vào kỹ năng xã hội cơ bản và trò chơi sáng tạo.
  - lemma: academy
    cefr: B1
    ipaUs: /əˈkædəmi/
    senses:
      - pos: NOUN
        definitionEn: A school or college for special training or education.
        definitionVi: học viện
        examples:
          - en: She enrolled in a prestigious military academy last autumn.
            vi: Cô ấy đã ghi danh vào một học viện quân sự uy tín vào mùa thu năm ngoái.
          - en: The local art academy offers evening classes for adults.
            vi: Học viện nghệ thuật địa phương cung cấp các lớp học buổi tối cho người lớn.
  - lemma: institution
    cefr: B2
    ipaUs: /ˌɪnstɪˈtuʃən/
    senses:
      - pos: NOUN
        definitionEn: An established organization or foundation dedicated to education or public service.
        definitionVi: cơ quan / tổ chức giáo dục
        examples:
          - en: Higher education is a major financial institution in this city.
            vi: Giáo dục đại học là một cơ quan tài chính lớn ở thành phố này.
          - en: Every research institution must follow strict ethical guidelines.
            vi: Mọi tổ chức nghiên cứu phải tuân theo các hướng dẫn đạo đức nghiêm ngặt.
  - lemma: vocational
    cefr: B2
    ipaUs: /voʊˈkeɪʃənəl/
    senses:
      - pos: ADJECTIVE
        definitionEn: Providing skills and training needed for a particular job or occupation.
        definitionVi: thuộc về dạy nghề
        examples:
          - en: Students can choose vocational training instead of university degrees.
            vi: Học sinh có thể chọn đào tạo nghề thay vì bằng đại học.
          - en: The vocational school provides practical skills for young mechanics.
            vi: Trường dạy nghề cung cấp các kỹ năng thực tế cho những thợ máy trẻ.
  - lemma: rubric
    cefr: C1
    ipaUs: /ˈrubrɪk/
    senses:
      - pos: NOUN
        definitionEn: A guide listing specific criteria and scoring rules for grading student work.
        definitionVi: bảng tiêu chí chấm điểm
        examples:
          - en: Teachers use a detailed grading rubric to evaluate student essays.
            vi: Giáo viên sử dụng bảng tiêu chí chấm điểm chi tiết để đánh giá bài luận của học sinh.
          - en: Read the assignment rubric carefully before starting your project.
            vi: Hãy đọc kỹ bảng tiêu chí của bài tập trước khi bắt đầu dự án của bạn.
  - lemma: term
    cefr: A2
    ipaUs: /tɜrm/
    senses:
      - pos: NOUN
        definitionEn: A fixed period of time during which an educational institution holds classes.
        definitionVi: học kỳ
        examples:
          - en: Our school term ends just before the Christmas holidays.
            vi: Học kỳ ở trường của chúng tôi kết thúc ngay trước kỳ nghỉ Giáng sinh.
          - en: She plans to study abroad during the spring term.
            vi: Cô ấy dự định đi du học trong học kỳ mùa xuân.
  - lemma: recess
    cefr: A2
    ipaUs: /ˈrisɛs/
    senses:
      - pos: NOUN
        definitionEn: A short period of time between classes when children can play outside.
        definitionVi: giờ giải lao
        examples:
          - en: Children run and play games outside during school recess.
            vi: Trẻ em chạy nhảy và chơi trò chơi bên ngoài trong giờ giải lao ở trường.
          - en: The teacher called the students inside after morning recess.
            vi: Giáo viên gọi học sinh vào trong nhà sau giờ giải lao buổi sáng.
  - lemma: bullying
    cefr: B1
    ipaUs: /ˈbʊliɪŋ/
    senses:
      - pos: NOUN
        definitionEn: The behavior of someone who hurts or frightens weaker students repeatedly.
        definitionVi: nạn bắt nạt học đường
        examples:
          - en: Schools must implement strict policies to stop campus bullying.
            vi: Các trường học phải thực hiện các chính sách nghiêm ngặt để ngăn chặn nạn bắt nạt học đường.
          - en: Psychological bullying can severely harm a student's mental health.
            vi: Nạn bắt nạt tâm lý có thể làm tổn hại nghiêm trọng đến sức khỏe tinh thần của học sinh.
  - lemma: detention
    cefr: B2
    ipaUs: /dɪˈtɛnʃən/
    senses:
      - pos: NOUN
        definitionEn: A punishment where students must stay at school after normal hours.
        definitionVi: hình phạt ở lại trường
        examples:
          - en: He received an after-school detention for disrupting the math class.
            vi: Cậu ấy nhận hình phạt ở lại trường vì làm mất trật tự trong lớp toán.
          - en: Several students served detention on Friday afternoon for talking.
            vi: Một số học sinh phải chịu phạt ở lại trường vào chiều thứ Sáu vì nói chuyện.
  - lemma: suspension
    cefr: B2
    ipaUs: /səˈspɛnʃən/
    senses:
      - pos: NOUN
        definitionEn: A temporary exclusion of a student from school as a disciplinary punishment.
        definitionVi: quyết định đình chỉ học
        examples:
          - en: Fighting on campus often results in a temporary student suspension.
            vi: Đánh nhau trong khuôn viên trường thường dẫn đến việc đình chỉ học tạm thời.
          - en: The school board reviewed the policy regarding student suspension.
            vi: Hội đồng trường đã xem xét chính sách liên quan đến việc đình chỉ học của học sinh.
  - lemma: chalkboard
    cefr: A2
    ipaUs: /ˈtʃɔkˌbɔrd/
    senses:
      - pos: NOUN
        definitionEn: A dark vertical board mounted on a wall for writing on with chalk.
        definitionVi: bảng đen
        examples:
          - en: The teacher wrote important grammar rules on the chalkboard.
            vi: Giáo viên đã viết các quy tắc ngữ pháp quan trọng lên bảng đen.
          - en: Please clean the dusty chalkboard before the next lesson starts.
            vi: Hãy lau sạch chiếc bảng đen đầy bụi trước khi bài học tiếp theo bắt đầu.
  - lemma: dean
    cefr: C1
    ipaUs: /din/
    senses:
      - pos: NOUN
        definitionEn: An official in charge of a department or faculty in a university.
        definitionVi: trưởng khoa / chủ nhiệm khoa
        examples:
          - en: The faculty dean signed approval for my thesis proposal.
            vi: Trưởng khoa đã ký phê duyệt đề xuất luận văn của tôi.
          - en: Students can schedule a meeting with the dean on Tuesdays.
            vi: Sinh viên có thể sắp xếp một cuộc họp với trưởng khoa vào các ngày thứ Ba.
  - lemma: instruction
    cefr: B1
    ipaUs: /ɪnˈstrʌkʃən/
    senses:
      - pos: NOUN
        definitionEn: The act of teaching or providing knowledge and educational guidance.
        definitionVi: sự giảng dạy / hướng dẫn
        examples:
          - en: Clear classroom instruction helps students understand difficult concepts easily.
            vi: Sự hướng dẫn rõ ràng trên lớp giúp học sinh hiểu các khái niệm khó một cách dễ dàng.
          - en: Music instruction is an important part of primary education.
            vi: Sự hướng dẫn âm nhạc là một phần quan trọng trong giáo dục tiểu học.
  - lemma: educator
    cefr: B2
    ipaUs: /ˈɛdʒəˌkeɪtər/
    senses:
      - pos: NOUN
        definitionEn: A person who provides instruction or works professionally in education.
        definitionVi: nhà giáo dục
        examples:
          - en: Every dedicated educator strives to inspire their young students.
            vi: Mỗi nhà giáo dục tận tâm đều phấn đấu để truyền cảm hứng cho học sinh trẻ tuổi.
          - en: The conference gathered every prominent educator from the nation.
            vi: Hội nghị đã quy tụ mọi nhà giáo dục nổi tiếng từ khắp cả nước.
  - lemma: schooling
    cefr: B1
    ipaUs: /ˈskulɪŋ/
    senses:
      - pos: NOUN
        definitionEn: The education received at a school.
        definitionVi: việc học tập ở trường
        examples:
          - en: Compulsory schooling begins at age six in this country.
            vi: Việc học tập bắt buộc bắt đầu từ sáu tuổi ở đất nước này.
          - en: Her parents paid for private schooling throughout her childhood.
            vi: Cha mẹ cô ấy đã trả tiền cho việc học trường tư trong suốt thời thơ ấu của cô.
  - lemma: placement
    cefr: B2
    ipaUs: /ˈpleɪsmənt/
    senses:
      - pos: NOUN
        definitionEn: An arrangement for a student to gain practical work experience.
        definitionVi: việc bố trí thực tập / xếp lớp
        examples:
          - en: University career services helped him secure a summer job placement.
            vi: Dịch vụ hướng nghiệp của trường đại học đã giúp anh ấy đảm bảo một vị trí thực tập mùa hè.
          - en: Proper student placement ensures classes match their academic levels.
            vi: Việc xếp lớp học sinh phù hợp đảm bảo các lớp học khớp với trình độ học tập của họ.
  - lemma: internship
    cefr: B1
    ipaUs: /ˈɪntərnˌʃɪp/
    senses:
      - pos: NOUN
        definitionEn: A period of work experience offered by an organization for students.
        definitionVi: kỳ thực tập
        examples:
          - en: She completed a valuable digital marketing internship last summer.
            vi: Cô ấy đã hoàn thành một kỳ thực tập tiếp thị kỹ thuật số quý giá vào mùa hè năm ngoái.
          - en: Securing a good corporate internship boosts your graduate employment prospects.
            vi: Việc giành được một kỳ thực tập doanh nghiệp tốt sẽ thúc đẩy triển vọng việc làm sau tốt nghiệp.
  - lemma: nursery
    cefr: A2
    ipaUs: /ˈnɜrsəri/
    senses:
      - pos: NOUN
        definitionEn: A school for children who are too young for kindergarten.
        definitionVi: nhà trẻ
        examples:
          - en: Working parents send their toddlers to a local nursery daily.
            vi: Các bậc cha mẹ đi làm gửi trẻ em tập đi của họ đến nhà trẻ địa phương hàng ngày.
          - en: The bright nursery features many toys and colorful wall paintings.
            vi: Nhà trẻ sáng sủa có nhiều đồ chơi và các bức tranh tường đầy màu sắc.
  - lemma: homeschooling
    cefr: B2
    ipaUs: /ˈhoʊmˌskulɪŋ/
    senses:
      - pos: NOUN
        definitionEn: Educating children at home instead of sending them to a formal school.
        definitionVi: việc dạy học tại nhà
        examples:
          - en: More families are choosing homeschooling for greater curriculum flexibility.
            vi: Nhiều gia đình đang chọn việc dạy học tại nhà để có sự linh hoạt lớn hơn về chương trình học.
          - en: Successful homeschooling requires careful daily planning and parent dedication.
            vi: Việc dạy học tại nhà thành công đòi hỏi sự lên kế hoạch hàng ngày cẩn thận và sự tận tụy của phụ
              huynh.
  - lemma: portfolio
    cefr: B2
    ipaUs: /pɔrˈfoʊliˌoʊ/
    senses:
      - pos: NOUN
        definitionEn: A collection of a student's work representing their skills and achievements.
        definitionVi: hồ sơ năng lực
        examples:
          - en: Art students must present a creative portfolio during university interviews.
            vi: Sinh viên mỹ thuật phải trình bày một hồ sơ năng lực sáng tạo trong các cuộc phỏng vấn đại học.
          - en: Keep your professional teaching portfolio updated for future job applications.
            vi: Hãy giữ cho hồ sơ năng lực giảng dạy chuyên nghiệp của bạn được cập nhật cho các đơn xin việc
              tương lai.
  - lemma: credential
    cefr: C1
    ipaUs: /krɪˈdɛnʃəl/
    senses:
      - pos: NOUN
        definitionEn: A qualification or document proving someone is suitable for a job.
        definitionVi: chứng chỉ / văn bằng
        examples:
          - en: Teachers need a valid state credential to work legally.
            vi: Giáo viên cần có một chứng chỉ tiểu bang hợp lệ để làm việc hợp pháp.
          - en: A valid state credential is required to teach here.
            vi: Một chứng chỉ tiểu bang hợp lệ là bắt buộc để giảng dạy ở đây.
  - lemma: degree
    cefr: B1
    ipaUs: /dɪˈɡriː/
    senses:
      - pos: NOUN
        definitionEn: An official qualification awarded by a university after completing a course of study.
        definitionVi: Bằng cấp
        examples:
          - en: She is studying hard to earn a degree in computer science.
            vi: Cô ấy đang học tập chăm chỉ để lấy bằng cấp về khoa học máy tính.
          - en: He proudly displayed his university degree on the office wall.
            vi: Anh ấy tự hào trưng bày bằng cấp đại học trên tường văn phòng.
  - lemma: diploma
    cefr: B1
    ipaUs: /dɪˈploʊ.mə/
    senses:
      - pos: NOUN
        definitionEn: A certificate awarded by an educational institution for completing a specific course.
        definitionVi: Chứng chỉ
        examples:
          - en: She received a diploma in graphic design after one year.
            vi: Cô ấy nhận được chứng chỉ thiết kế đồ họa sau một năm.
          - en: He earned a nursing diploma from the local community college.
            vi: Anh ấy đã đạt được chứng chỉ điều dưỡng từ trường cao đẳng cộng đồng địa phương.
  - lemma: bachelor
    cefr: B2
    ipaUs: /ˈbætʃ.əl.ɚ/
    senses:
      - pos: NOUN
        definitionEn: Someone who has a first university degree.
        definitionVi: Cử nhân
        examples:
          - en: A bachelor degree takes usually four years at this university.
            vi: Bằng cử nhân thường mất bốn năm tại trường đại học này.
          - en: She worked hard to become a qualified bachelor of arts.
            vi: Cô ấy đã làm việc chăm chỉ để trở thành một cử nhân nghệ thuật đủ tiêu chuẩn.
  - lemma: master
    cefr: B2
    ipaUs: /ˈmæs.tɚ/
    senses:
      - pos: NOUN
        definitionEn: An advanced university degree or a person holding it.
        definitionVi: Thạc sĩ
        examples:
          - en: He plans to pursue a master degree in business administration.
            vi: Anh ấy dự định theo đuổi bằng thạc sĩ quản trị kinh doanh.
          - en: She achieved her master degree in linguistics last summer.
            vi: Cô ấy đã đạt được bằng thạc sĩ ngôn ngữ học vào mùa hè năm ngoái.
  - lemma: learning
    cefr: A2
    ipaUs: /ˈlɝː.nɪŋ/
    senses:
      - pos: NOUN
        definitionEn: The activity of obtaining knowledge or skills.
        definitionVi: Sự học tập
        examples:
          - en: Online learning provides flexibility for students with busy working schedules.
            vi: Việc học trực tuyến mang lại sự linh hoạt cho học sinh có lịch làm việc bận rộn.
          - en: Continuous learning is essential for career growth in modern society.
            vi: Việc học tập liên tục là rất cần thiết cho sự phát triển nghề nghiệp trong xã hội hiện đại.
  - lemma: pedagogy
    cefr: C1
    ipaUs: /ˈped.ə.ɡɑː.dʒi/
    senses:
      - pos: NOUN
        definitionEn: The method and practice of teaching.
        definitionVi: Sư phạm
        examples:
          - en: Modern pedagogy emphasizes student participation rather than just passive listening.
            vi: Sư phạm hiện đại nhấn mạnh sự tham gia của học sinh thay vì chỉ nghe thụ động.
          - en: The university offers an advanced course in language teaching pedagogy.
            vi: Trường đại học cung cấp một khóa học nâng cao về sư phạm dạy ngôn ngữ.
  - lemma: evaluation
    cefr: B2
    ipaUs: /ɪˌvæl.juˈeɪ.ʃən/
    senses:
      - pos: NOUN
        definitionEn: The act of judging or calculating the quality or importance of something.
        definitionVi: Sự đánh giá
        examples:
          - en: Teacher evaluation helps improve the quality of classroom instruction.
            vi: Sự đánh giá của giáo viên giúp cải thiện chất lượng giảng dạy trên lớp.
          - en: The final course evaluation showed high satisfaction rates among students.
            vi: Đánh giá khóa học cuối cùng cho thấy tỷ lệ hài lòng cao ở học sinh.
  - lemma: training
    cefr: A2
    ipaUs: /ˈtreɪ.nɪŋ/
    senses:
      - pos: NOUN
        definitionEn: The process of learning the skills you need for a particular job.
        definitionVi: Sự đào tạo
        examples:
          - en: The company provides professional training for all newly hired employees.
            vi: Công ty cung cấp đào tạo chuyên nghiệp cho tất cả nhân viên mới được tuyển dụng.
          - en: Technical training is a crucial requirement for this engineering position.
            vi: Đào tạo kỹ thuật là một yêu cầu quan trọng đối với vị trí kỹ sư này.
  - lemma: question
    cefr: A1
    ipaUs: /ˈkwes.tʃən/
    senses:
      - pos: NOUN
        definitionEn: A sentence or phrase used to find out information.
        definitionVi: Câu hỏi
        examples:
          - en: The teacher asked a difficult question about American history.
            vi: Giáo viên đã đặt ra một câu hỏi khó về lịch sử nước Mỹ.
          - en: Please raise your hand if you have a question.
            vi: Vui lòng giơ tay lên nếu bạn có câu hỏi.
  - lemma: answer
    cefr: A1
    ipaUs: /ˈæn.sɚ/
    senses:
      - pos: NOUN
        definitionEn: A reaction to a question, letter, or phone call.
        definitionVi: Câu trả lời
        examples:
          - en: She gave a brilliant answer during the final oral examination.
            vi: Cô ấy đã đưa ra một câu trả lời xuất sắc trong kỳ thi vấn đáp cuối kỳ.
          - en: He could not find the right answer to the math problem.
            vi: Anh ấy không thể tìm thấy câu trả lời đúng cho bài toán.
  - lemma: skill
    cefr: A2
    ipaUs: /skɪl/
    senses:
      - pos: NOUN
        definitionEn: An ability to do something well, usually gained through training or experience.
        definitionVi: Kỹ năng
        examples:
          - en: Communication skill is crucial for success in any modern workplace.
            vi: Kỹ năng giao tiếp rất quan trọng để thành công trong bất kỳ nơi làm việc hiện đại nào.
          - en: Every single skill requires patience and consistent practice to master.
            vi: Mỗi kỹ năng đều đòi hỏi sự kiên nhẫn và luyện tập kiên trì để làm chủ.
