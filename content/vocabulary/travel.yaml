      - pos: NOUN
        definitionEn: An establishment providing paid lodging, meals, and other services for travelers.
        definitionVi: Khách sạn
        examples:
          - en: They checked into a luxury hotel near the city center beach.
            vi: Họ đã nhận phòng tại một khách sạn sang trọng gần bãi biển trung tâm thành phố.
          - en: The conference guests reserved a nice hotel for three nights.
            vi: Các khách dự hội nghị đã đặt trước một khách sạn đẹp trong ba đêm.
  - lemma: motel
    cefr: A2
    ipaUs: /moʊˈtel/
    senses:
      - pos: NOUN
        definitionEn: A roadside hotel designed primarily for motorists, with parking near rooms.
        definitionVi: Nhà nghỉ ven đường
        examples:
          - en: Tired drivers stopped at a roadside motel to rest overnight.
            vi: Những tài xế mệt mỏi đã dừng chân tại một nhà nghỉ ven đường để nghỉ qua đêm.
