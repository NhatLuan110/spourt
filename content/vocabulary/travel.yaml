        definitionVi: Băng chuyền hành lý
        examples:
          - en: We waited by the baggage carousel for our suitcases.
            vi: Chúng tôi đứng đợi bên băng chuyền hành lý để lấy vali.
          - en: Your red backpack should appear on this carousel soon.
