      - pos: NOUN
        definitionEn: A person who operates the controls of an aircraft.
        definitionVi: Phi công
        examples:
          - en: The friendly pilot welcomed all passengers onto the flight.
            vi: Viên phi công thân thiện đã chào đón mọi hành khách lên chuyến bay.
          - en: Our pilot announced that we would land shortly.
            vi: Phi công của chúng tôi thông báo rằng chúng tôi sẽ hạ cánh sớm.
  - lemma: captain
    cefr: A2
    ipaUs: /ˈkæptən/
    senses:
      - pos: NOUN
        definitionEn: The person in command of a ship or an aircraft.
        definitionVi: Thuyền trưởng / Cơ trưởng
        examples:
          - en: The captain steered the ship safely through the storm.
            vi: Thuyền trưởng đã điều khiển con tàu vượt qua cơn bão một cách an toàn.
          - en: The captain spoke over the intercom about the weather.
            vi: Cơ trưởng đã nói qua hệ thống liên lạc nội bộ về thời tiết.
  - lemma: attendant
    cefr: A2
    ipaUs: /əˈtɛndənt/
    senses:
      - pos: NOUN
        definitionEn: A person whose job is to provide service to passengers on a plane or train.
        definitionVi: Nhân viên phục vụ
        examples:
          - en: A flight attendant offered us drinks shortly after takeoff.
            vi: Một tiếp viên hàng không đã mời chúng tôi đồ uống ngay sau khi cất cánh.
          - en: The train attendant checked every passenger's ticket carefully.
            vi: Nhân viên phục vụ trên tàu đã kiểm tra vé của mọi hành khách rất kỹ.
