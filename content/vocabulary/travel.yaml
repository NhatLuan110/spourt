            vi: Bạn có thể mua vé tàu tại quầy tự phục vụ tự động ở gần lối vào.
  - lemma: security
    cefr: A2
    ipaUs: /səˈkjʊr.ə.ti/
    senses:
      - pos: NOUN
        definitionEn: The state of being free from danger or threat, or the procedures to ensure it.
        definitionVi: an ninh
        examples:
          - en: Passengers must pass through airport security before entering the departure gates.
            vi: Hành khách phải đi qua khu an ninh sân bay trước khi bước vào các cổng khởi hành.
          - en: Strict security checks at the border help prevent illegal items from entering.
            vi: Các cuộc kiểm tra an ninh nghiêm ngặt ở biên giới giúp ngăn chặn các mặt hàng bất hợp pháp.
  - lemma: immigration
    cefr: B1
    ipaUs: /ˌɪmɪˈɡreɪʃn/
