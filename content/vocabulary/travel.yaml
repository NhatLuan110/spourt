        definitionVi: ban công
        examples:
          - en: She grows colorful flowers in pots on her apartment balcony.
            vi: Cô ấy trồng những bông hoa đầy màu sắc trong chậu ở ban công căn hộ.
          - en: We stood on the balcony to watch the evening sunset.
            vi: Chúng tôi đứng ở ban công để ngắm hoàng hôn buổi chiều.
