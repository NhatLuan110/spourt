      - pos: NOUN
        definitionEn: The place at a port, airport, or border where official checks are made on people
          entering a country.
        definitionVi: Khu vực kiểm tra nhập cảnh
        examples:
          - en: We spent an hour clearing immigration at the busy airport.
            vi: Chúng tôi mất một tiếng để làm thủ tục nhập cảnh tại sân bay đông đúc.
          - en: Please have your passport ready before you enter immigration.
            vi: Vui lòng chuẩn bị sẵn hộ chiếu trước khi bạn bước vào khu vực nhập cảnh.
  - lemma: declaration
    cefr: B2
    ipaUs: /ˌdɛkləˈreɪʃn/
    senses:
      - pos: NOUN
        definitionEn: A statement of taxable goods or things you are bringing into a country.
        definitionVi: Tờ khai hải quan
        examples:
          - en: He handed his customs declaration form to the officer.
            vi: Anh ấy đã nộp tờ khai hải quan của mình cho viên chức.
          - en: Making a false declaration at the border is illegal.
            vi: Khai báo gian dối tại biên giới là hành vi phạm pháp.
  - lemma: carousel
