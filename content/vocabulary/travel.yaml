      - pos: NOUN
        definitionEn: An instrument with a magnetic needle that shows direction.
        definitionVi: La bàn
        examples:
          - en: We used a compass to find our way in the deep woods.
            vi: Chúng tôi đã dùng một la bàn để tìm đường trong khu rừng sâu.
          - en: A reliable compass is essential for any serious mountain hiker.
            vi: Một chiếc la bàn đáng tin cậy là rất cần thiết cho bất kỳ người leo núi nào.
