        definitionVi: Buồng / Quầy nhỏ
        examples:
          - en: We bought our tickets at the small wooden booth.
            vi: Chúng tôi đã mua vé tại quầy bằng gỗ nhỏ.
          - en: The information booth was staffed by a helpful local guide.
            vi: Quầy thông tin được túc trực bởi một hướng dẫn viên địa phương nhiệt tình.
  - lemma: agency
