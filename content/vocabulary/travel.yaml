      - pos: NOUN
        definitionEn: The material used for paving roads and airport areas, or the surface itself.
        definitionVi: Nhựa đường, mặt đường nhựa
        examples:
          - en: Passengers walked across the hot tarmac to board the waiting plane.
            vi: Hành khách bước qua mặt đường nhựa nóng bỏng để lên chiếc máy bay đang chờ.
          - en: Ground staff parked the luggage cart directly on the open tarmac.
            vi: Nhân viên mặt đất đã đỗ xe đẩy hành lý trực tiếp trên bãi nhựa đường thoáng đãng.
  - lemma: backpack
    cefr: A1
    ipaUs: /ˈbækpæk/
    senses:
      - pos: NOUN
        definitionEn: A bag carried on the back using two straps.
        definitionVi: Ba lô
        examples:
