      - pos: NOUN
        definitionEn: A machine that carries people up and down in a tall building.
        definitionVi: Thang máy
        examples:
          - en: We took the elevator to the tenth floor to reach our room.
            vi: Chúng tôi đi thang máy lên tầng mười để đến phòng của mình.
          - en: The hotel elevator is currently out of service for repairs.
            vi: Thang máy của khách sạn hiện đang ngừng hoạt động để sửa chữa.
  - lemma: balcony
