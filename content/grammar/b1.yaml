        options:
          - has to
          - must
          - had to
          - have to
        answer: had to
        explanationVi: Nghĩa vụ do hoàn cảnh trong quá khứ dùng had to. Last night xác định thời gian đã kết thúc.
      - type: MCQ
        prompt: The forecast is uncertain; it ____ rain later.
        promptVi: Chọn phương án đúng.
        options:
          - mights
          - might to
          - might
          - is might
        answer: might
        explanationVi: Might diễn tả khả năng chưa chắc chắn và theo sau là động từ nguyên thể rain.
      - type: MCQ
        prompt: ____ you open this jar for me, please?
        promptVi: Chọn phương án đúng.
        options:
          - Does
          - Are
          - Have
          - Could
        answer: Could
        explanationVi: Could you + động từ nguyên thể là mẫu câu nhờ người khác giúp một cách lịch sự.
      - type: GAP_FILL
        prompt: I ____ (not / can) hear the announcement yesterday.
