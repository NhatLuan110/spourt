  - slug: modal-verbs
    title: Modal Verbs
    titleVi: Động từ khiếm khuyết
    summary: can, must, should, might — và vì sao chúng không bao giờ thêm -s.
    estimatedMinutes: 15
    xpReward: 30
    order: 5
    prerequisites: [present-simple]
    sections:
      - kind: theory
        title: Một nhóm động từ có luật riêng
        body: |
          Động từ khiếm khuyết đứng trước động từ chính và **không đổi hình bao giờ**:
          không `-s`, không `-ed`, không `to` phía sau.

          | Động từ | Nghĩa | Ví dụ |
          |---|---|---|
          | can / could | khả năng, xin phép | I **can** swim. |
          | must | bắt buộc (do người nói) | You **must** wear a helmet. |
          | have to | bắt buộc (do hoàn cảnh) | I **have to** work on Saturday. |
          | should | lời khuyên | You **should** see a doctor. |
          | may / might | có thể xảy ra | It **might** rain later. |
          | will / would | tương lai, lịch sự | **Would** you help me? |

          Phủ định thêm thẳng **not**, không cần do/does:
          She **cannot** come. / You **should not** worry.

          Câu hỏi đảo động từ khiếm khuyết lên đầu:
          **Can** you help me? — không phải *Do you can help me?*
      - kind: examples
        title: Ví dụ
        body: |
          - You **must** show your passport at the gate.
            *Bạn phải xuất trình hộ chiếu ở cửa.*
          - He **might** be at the library.
            *Có thể anh ấy đang ở thư viện.*
          - We **should** leave now if we want to be on time.
            *Chúng ta nên đi ngay nếu muốn đúng giờ.*
          - I **couldn't** find the file yesterday.
            *Hôm qua tôi không tìm được tệp đó.*
      - kind: tips
        title: must và have to khác nhau ở đâu
        body: |
          Cả hai đều là "phải", nhưng nguồn của sự bắt buộc khác nhau:

          - **must** — người nói tự thấy cần: I **must** call my mother.
          - **have to** — quy định hoặc hoàn cảnh bên ngoài: I **have to** wear
            a uniform at work.

          Phủ định thì khác hẳn nghĩa, đây là chỗ dễ sai nhất:

          | | Nghĩa |
          |---|---|
          | You **mustn't** park here. | **Cấm** đỗ xe ở đây |
          | You **don't have to** park here. | **Không cần** đỗ ở đây, đỗ chỗ khác cũng được |
      - kind: common-mistakes
        title: Lỗi người Việt hay mắc
        body: |
          | Sai | Đúng | Vì sao |
          |---|---|---|
          | She cans swim. | She **can** swim. | Khiếm khuyết không thêm -s |
          | He must to go. | He **must** go. | Sau must không có to |
          | Do you can help me? | **Can** you help me? | Không dùng do với khiếm khuyết |
          | You mustn't come if you are busy. | You **don't have to** come. | mustn't là cấm, không phải "không cần" |
          | I will can speak English. | I **will be able to** speak English. | Không đặt hai khiếm khuyết cạnh nhau |
    exercises:
      - type: MCQ
        prompt: "You ____ smoke in the hospital. It is forbidden."
        promptVi: Chọn phương án đúng.
        options: [mustn't, don't have to, shouldn't have to, needn't]
        answer: mustn't
        explanationVi: "It is forbidden nghĩa là cấm, nên dùng mustn't. don't have to
          chỉ có nghĩa không bắt buộc."
      - type: MCQ
        prompt: "It's Sunday, so I ____ get up early."
        promptVi: Chọn phương án đúng.
        options: [don't have to, mustn't, can't, shouldn't]
        answer: don't have to
        explanationVi: "Chủ nhật thì không bắt buộc dậy sớm, nhưng không ai cấm — nên
          dùng don't have to."
      - type: MCQ
        prompt: "____ you pass me the salt, please?"
        promptVi: Chọn phương án lịch sự nhất.
        options: [Could, Must, Should, Do]
        answer: Could
        explanationVi: "Could dùng để nhờ vả một cách lịch sự."
      - type: GAP_FILL
        prompt: "She ____ (not / can) come to the party last night."
        promptVi: Điền dạng quá khứ phủ định.
        answer: could not
        accept: ["could not", "couldn't"]
        explanationVi: "Quá khứ của can là could; phủ định thêm thẳng not."
      - type: TRUE_FALSE
        prompt: Câu sau đúng ngữ pháp hay sai?
        statement: He must to finish the report today.
        answer: false
        explanationVi: "Sai. Sau động từ khiếm khuyết không có to: He must finish."
      - type: REORDER
        prompt: Sắp xếp thành một câu đúng.
        chunks: ["You", "should not", "drink coffee", "after nine o'clock"]
        explanationVi: "should not đứng ngay sau chủ ngữ, trước động từ nguyên thể."
      - type: SHORT_ANSWER
        prompt: "Sửa câu sai: \"Do you can speak Japanese?\""
        accept: ["Can you speak Japanese", "Can you speak Japanese?"]
        explanationVi: "Câu hỏi với khiếm khuyết thì đảo chính nó lên đầu, không dùng do."
      - type: MCQ
        prompt: At the age of six, Eva ____ read music.
        promptVi: Chọn từ diễn tả khả năng trong quá khứ.
        options:
          - can
          - could
          - must
          - will
        answer: could
        explanationVi: At the age of six xác định khả năng trong quá khứ. Dùng could + động từ nguyên thể read.
      - type: MCQ
        prompt: Visitors ____ feed the animals. The sign says it is prohibited.
        promptVi: Chọn phương án đúng.
        options:
          - do not have to
          - need not
          - are not having to
          - must not
        answer: must not
        explanationVi: Prohibited nghĩa là bị cấm. Must not diễn tả sự cấm đoán, còn do not have to và need
          not chỉ nói không cần thiết.
      - type: MCQ
        prompt: The ticket is free, so you ____ pay to enter.
        promptVi: Chọn cụm từ có nghĩa không bắt buộc.
        options:
          - do not have to
          - should not
          - must not
          - cannot
        answer: do not have to
        explanationVi: Vé miễn phí nghĩa là không có nghĩa vụ trả tiền. Do not have to diễn tả việc không cần thiết.
      - type: MCQ
        prompt: You look exhausted. You ____ take a short break.
        promptVi: Chọn phương án đúng.
        options:
          - should to
          - should
          - must to
          - ought
        answer: should
        explanationVi: Lời khuyên dùng should + động từ nguyên thể. Ought cần có to, còn should không đi với to.
      - type: MCQ
        prompt: She can ____ the problem without a calculator.
        promptVi: Chọn phương án đúng.
        options:
          - solves
          - solving
          - solve
          - to solve
        answer: solve
        explanationVi: Sau can dùng động từ nguyên thể không to. Không thêm -s dù chủ ngữ là she.
      - type: MCQ
        prompt: ____ I use your charger for a minute?
        promptVi: Chọn phương án đúng.
        options:
          - Do
          - Am
          - Have
          - May
        answer: May
        explanationVi: May I + động từ nguyên thể là cách xin phép lịch sự.
      - type: MCQ
