        explanationVi: Yesterday chỉ quá khứ. Dạng phủ định của could là could not hoặc couldn't.
      - type: GAP_FILL
        prompt: Students ____ bring laptops; the school provides computers.
        promptVi: Điền dạng phủ định hiện tại của have to.
        answer: do not have to
        accept:
          - do not have to
          - don't have to
        explanationVi: Trường đã cung cấp máy tính nên học sinh không cần mang laptop. Do not have to khác
          với must not là bị cấm.
      - type: GAP_FILL
        prompt: You ____ (should / not / share) your password with strangers.
        promptVi: Dùng should để đưa ra lời khuyên phủ định.
        answer: should not share
        accept:
          - should not share
          - shouldn't share
        explanationVi: Should not + động từ nguyên thể dùng để khuyên không làm điều gì. Share giữ nguyên thể.
      - type: GAP_FILL
        prompt: ____ (can / your sister / swim) across this pool?
        promptVi: Điền cả cụm từ thành câu hỏi với can.
        answer: Can your sister swim
        accept:
          - Can your sister swim
        explanationVi: Câu hỏi về khả năng đảo can lên trước chủ ngữ. Không dùng does và không thêm -s vào swim.
      - type: GAP_FILL
        prompt: The lift is broken, so he ____ use the stairs today.
        promptVi: Điền dạng hiện tại của have to.
