        explanationVi: Sai. Câu hỏi với can không dùng does. Câu đúng là Can she play the violin?
        promptVi: Câu sau có đúng ngữ pháp không?
      - type: TRUE_FALSE
        prompt: Câu sau có đúng ngữ pháp không?
