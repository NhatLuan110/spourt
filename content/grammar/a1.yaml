# Ngữ pháp A1 — ba điểm khó đầu tiên với người Việt.
cefr: A1
lessons:
  - slug: present-simple
    title: Present Simple
    titleVi: Thì hiện tại đơn
    summary: Diễn tả thói quen, sự thật và lịch trình — và cái đuôi -s mà tiếng Việt không có.
    estimatedMinutes: 12
    xpReward: 25
    order: 1
    prerequisites: []
    sections:
      - kind: theory
        title: Cách dùng và cách chia
        body: |
          Hiện tại đơn dùng cho **thói quen**, **sự thật hiển nhiên** và **lịch trình cố định**.

          | Chủ ngữ | Động từ | Ví dụ |
          |---|---|---|
          | I / you / we / they | nguyên thể | I **work** in Hanoi. |
          | he / she / it | + **-s** | She **works** in Hanoi. |

          Câu phủ định và câu hỏi mượn trợ động từ **do / does**, và khi đó động từ
          chính quay về nguyên thể:

          - She **does not work** on Sunday. (không phải *does not works*)
          - **Does** she **work** on Sunday?

          Quy tắc thêm **-s**:

          - Phần lớn: `work → works`, `read → reads`
          - Tận cùng `-s, -sh, -ch, -x, -o`: thêm **-es** — `watch → watches`, `go → goes`
          - Phụ âm + `-y`: đổi thành **-ies** — `study → studies` (nhưng `play → plays`)
      - kind: examples
        title: Ví dụ trong ngữ cảnh
        body: |
          - My brother **teaches** English at a secondary school.
            *Anh trai tôi dạy tiếng Anh ở một trường cấp hai.*
          - Water **boils** at 100 degrees.
            *Nước sôi ở 100 độ.*
          - The train **leaves** at 6.30 every morning.
            *Tàu chạy lúc 6 giờ 30 mỗi sáng.*
          - I **don't drink** coffee after lunch.
            *Tôi không uống cà phê sau bữa trưa.*
      - kind: tips
        title: Mẹo nhớ
        body: |
          **"He, she, it — đừng quên -s."** Đây là câu thần chú đáng thuộc lòng, vì
          tiếng Việt không chia động từ theo chủ ngữ nên tai bạn không tự thấy thiếu.

          Trạng từ tần suất đứng **trước** động từ thường nhưng **sau** động từ `to be`:

          - She **always** arrives early.
          - She **is always** early.
      - kind: common-mistakes
        title: Lỗi người Việt hay mắc
        body: |
          | Sai | Đúng | Vì sao |
          |---|---|---|
          | She go to school. | She **goes** to school. | Chủ ngữ ngôi ba số ít cần -s |
          | He doesn't likes tea. | He doesn't **like** tea. | Sau `does` là động từ nguyên thể |
          | I am work in a bank. | I **work** in a bank. | Không dùng `to be` cùng động từ thường |
          | Do she live here? | **Does** she live here? | Ngôi ba số ít dùng `does` |
    exercises:
      - type: MCQ
        prompt: "My sister ____ in a hospital in Da Nang."
        promptVi: Chọn dạng đúng của động từ.
        options: [work, works, working, is work]
        answer: works
        explanationVi: "\"My sister\" là ngôi thứ ba số ít nên động từ thêm -s: works."
      - type: MCQ
        prompt: "____ your parents live in Hue?"
        promptVi: Chọn trợ động từ đúng.
        options: [Do, Does, Are, Is]
        answer: Do
        explanationVi: "\"Your parents\" là số nhiều nên dùng Do, không dùng Does."
      - type: GAP_FILL
        prompt: "He ____ (not / watch) television in the morning."
        promptVi: Điền dạng phủ định.
        answer: does not watch
        accept: ["does not watch", "doesn't watch"]
        explanationVi: "Phủ định ngôi ba số ít là does not + động từ nguyên thể. Chữ -es
          đã nằm ở does rồi nên watch giữ nguyên."
      - type: GAP_FILL
        prompt: "Lan ____ (study) English every evening."
        promptVi: Điền dạng đúng.
        answer: studies
        accept: [studies]
        explanationVi: "Phụ âm + -y đổi thành -ies: study → studies."
      - type: TRUE_FALSE
        prompt: Câu sau đúng ngữ pháp hay sai?
        statement: The shop opens at eight and close at ten.
        answer: false
        explanationVi: "Sai. Hai động từ cùng chủ ngữ \"the shop\" nên cả hai phải thêm
          -s: opens ... and closes."
      - type: REORDER
        prompt: Sắp xếp thành một câu đúng.
        chunks: ["My father", "never", "drinks", "coffee", "at night"]
        explanationVi: "Trạng từ tần suất never đứng ngay trước động từ thường: My father
          never drinks coffee at night."
      - type: SHORT_ANSWER
        prompt: "Viết câu hỏi cho câu trả lời: \"Yes, she works on Saturday.\" Bắt đầu bằng Does."
        accept: ["Does she work on Saturday", "Does she work on Saturday?"]
        explanationVi: "Sau Does, động từ trở về nguyên thể: Does she work on Saturday?"
      - type: MCQ
        prompt: My dog always ____ when the mailman arrives.
        promptVi: Chọn dạng đúng của động từ.
        options:
          - bark
          - barks
          - barking
          - is bark
        answer: barks
        explanationVi: '"My dog" là danh từ số ít (ngôi thứ ba số ít), do đó động từ "bark" cần thêm "-s"
          thành "barks".'
      - type: MCQ
        prompt: What time ____ the English class start?
        promptVi: Chọn trợ động từ thích hợp.
        options:
          - does
          - is
          - are
          - do
        answer: does
        explanationVi: '"The English class" là danh từ số ít, nên ta dùng trợ động từ "does" cho câu hỏi ở
          thì hiện tại đơn.'
      - type: MCQ
        prompt: We ____ have lunch at home on weekdays.
        promptVi: Chọn từ phủ định thích hợp.
        options:
          - not
          - aren't
          - doesn't
          - don't
        answer: don't
        explanationVi: Với chủ ngữ "We", ta dùng trợ động từ phủ định "don't" (do not) trước động từ nguyên thể "have".
      - type: MCQ
        prompt: She ____ very happy today.
        promptVi: Chọn động từ to be thích hợp.
        options:
          - am
          - is
          - are
          - be
        answer: is
        explanationVi: Động từ "to be" chia ở thì hiện tại đơn đi với chủ ngữ ngôi thứ ba số ít "She" là "is".
      - type: MCQ
        prompt: My cousins ____ to the gym every morning.
        promptVi: Chọn dạng đúng của động từ.
        options:
          - go
          - goes
          - going
          - goes to
        answer: go
        explanationVi: '"My cousins" là danh từ số nhiều (ngôi thứ ba số nhiều), nên động từ "go" giữ nguyên thể.'
      - type: MCQ
        prompt: He ____ his teeth three times a day.
        promptVi: Chọn dạng đúng của động từ.
        options:
          - brushs
          - brushes
          - brushing
          - brush
        answer: brushes
        explanationVi: Động từ tận cùng bằng "-sh" (brush) khi đi với chủ ngữ ngôi thứ ba số ít "He" phải
          thêm "-es" thành "brushes".
      - type: MCQ
        prompt: ____ you like chocolate ice cream?
        promptVi: Chọn trợ động từ thích hợp.
        options:
          - Are
          - Is
          - Does
          - Do
        answer: Do
        explanationVi: Với chủ ngữ "you", ta dùng trợ động từ "Do" để hỏi ở thì hiện tại đơn.
      - type: MCQ
        prompt: They ____ always on time for meetings.
        promptVi: Chọn từ thích hợp điền vào chỗ trống.
        options:
          - do
          - are
          - is
          - be
        answer: are
        explanationVi: Trạng từ tần suất "always" đứng sau động từ "to be". Với chủ ngữ "They", động từ "to
          be" chia là "are".
      - type: MCQ
        prompt: My mother ____ a new car, but she doesn't drive it.
        promptVi: Chọn dạng đúng của động từ.
        options:
          - have
          - has
          - haves
          - having
        answer: has
        explanationVi: Động từ bất quy tắc "have" chuyển thành "has" khi đi với chủ ngữ ngôi thứ ba số ít "My mother".
      - type: MCQ
        prompt: Where ____ your uncle work?
        promptVi: Chọn trợ động từ thích hợp.
        options:
          - do
          - is
          - are
          - does
        answer: does
        explanationVi: '"Your uncle" là ngôi thứ ba số ít, vì vậy ta dùng trợ động từ "does" trong câu hỏi Wh-.'
      - type: GAP_FILL
        prompt: My friend ____ (not / play) video games on weekdays.
        promptVi: Điền dạng phủ định thích hợp của động từ trong ngoặc.
        answer: does not play
        accept:
          - does not play
          - doesn't play
        explanationVi: Phủ định của ngôi thứ ba số ít "My friend" là "does not" (hoặc "doesn't") đi kèm động
          từ nguyên thể "play".
      - type: GAP_FILL
        prompt: The flight to London ____ (take off) at 9:00 PM tonight.
        promptVi: Điền dạng đúng của động từ trong ngoặc để chỉ lịch trình.
        answer: takes off
        accept:
          - takes off
        explanationVi: Lịch trình cố định dùng hiện tại đơn. "The flight" là số ít nên động từ "take" thêm
          "-s" thành "takes".
      - type: GAP_FILL
        prompt: I ____ (usually / get up) at 6 AM.
        promptVi: Điền trạng từ và động từ đúng vị trí.
        answer: usually get up
        accept:
          - usually get up
        explanationVi: Trạng từ tần suất "usually" đứng trước động từ thường "get up". Chủ ngữ "I" nên động
          từ giữ nguyên thể.
      - type: GAP_FILL
        prompt: My baby brother ____ (cry) when he is hungry.
        promptVi: Điền dạng đúng của động từ trong ngoặc.
        answer: cries
        accept:
          - cries
        explanationVi: Động từ "cry" có tận cùng là phụ âm + "y", ta đổi "y" thành "i" rồi thêm "es" thành
          "cries" khi đi với chủ ngữ số ít.
      - type: GAP_FILL
        prompt: We ____ (not / live) in a big city.
        promptVi: Điền dạng phủ định thích hợp của động từ trong ngoặc.
        answer: do not live
        accept:
          - do not live
          - don't live
        explanationVi: Phủ định của chủ ngữ "We" là "do not" (hoặc "don't") kết hợp động từ nguyên thể "live".
      - type: GAP_FILL
        prompt: Why ____ (you / want) to learn English?
        promptVi: Điền dạng câu hỏi thích hợp cho phần trong ngoặc.
        answer: do you want
        accept:
          - do you want
        explanationVi: 'Cấu trúc câu hỏi Wh- với chủ ngữ "you" là: Wh-word + do + chủ ngữ + động từ nguyên thể.'
      - type: TRUE_FALSE
        prompt: Câu sau có đúng ngữ pháp không?
        statement: She doesn't likes to drink cold water.
        answer: false
        explanationVi: "Sai. Sau trợ động từ phủ định \"doesn't\", động từ chính phải ở dạng nguyên thể
          không chia: \"She doesn't like...\"."
        promptVi: Câu sau có đúng ngữ pháp không?
      - type: TRUE_FALSE
        prompt: Câu sau có đúng ngữ pháp không?
        statement: My father flies to Tokyo twice a year.
        answer: true
        explanationVi: Đúng. Động từ "fly" tận cùng là phụ âm + "y" được đổi thành "flies" khi đi với chủ
          ngữ số ít "My father".
        promptVi: Câu sau có đúng ngữ pháp không?
      - type: REORDER
        prompt: Sắp xếp thành câu bắt đầu bằng "My sister" và kết thúc bằng "for school".
        promptVi: Sắp xếp các từ để tạo thành câu hoàn chỉnh.
        chunks:
          - My sister
          - is often
          - late
          - for school
        explanationVi: Trạng từ tần suất "often" đứng sau động từ "to be" (is) và trước tính từ (late).
      - type: REORDER
        prompt: Sắp xếp thành câu bắt đầu bằng "They" và kết thúc bằng "in winter".
        promptVi: Sắp xếp các từ để tạo thành câu hoàn chỉnh.
        chunks:
          - They
          - do not
          - go
          - to the beach
          - in winter
        explanationVi: "Cấu trúc phủ định hiện tại đơn: Chủ ngữ + do not + động từ nguyên thể + trạng ngữ
          chỉ nơi chốn + trạng ngữ chỉ thời gian."

  - slug: articles-a-an-the
    title: Articles - a, an, the
    titleVi: Mạo từ a, an, the
    summary: Điểm khó nhất với người Việt, vì tiếng Việt không có mạo từ.
    estimatedMinutes: 15
    xpReward: 30
    order: 2
    prerequisites: []
    sections:
      - kind: theory
        title: Ba lựa chọn, không phải hai
        body: |
          Mỗi lần đặt một danh từ vào câu, bạn chọn một trong **ba** khả năng:
          `a/an`, `the`, hoặc **không mạo từ**.

          **a / an — một cái nào đó, người nghe chưa biết là cái nào**

          - I bought **a** book yesterday. (người nghe chưa biết cuốn nào)
          - `a` trước **âm** phụ âm, `an` trước **âm** nguyên âm. Nghe âm, đừng nhìn chữ:
            **an** hour (h câm), **a** university (đọc là /juː/), **an** MBA (đọc /em/).

          **the — cả người nói và người nghe đều biết là cái nào**

          - I bought a book. **The** book is about Hanoi. (đã nhắc đến ở câu trước)
          - **The** sun, **the** moon — chỉ có một
          - **the** first, **the** best — thứ tự và so sánh nhất

          **Không mạo từ — danh từ số nhiều hoặc không đếm được, nói chung chung**

          - **Books** are expensive. (sách nói chung)
          - **Water** is free here.
      - kind: examples
        title: So sánh ba khả năng
        body: |
          - I want to buy **a** car. *(một cái xe nào đó)*
          - I want to buy **the** car we saw yesterday. *(chiếc cụ thể)*
          - I want to buy **cars** and sell them. *(xe nói chung)*

          Cùng một danh từ, ba nghĩa khác nhau. Đây là lý do không thể bỏ qua mạo từ.
      - kind: tips
        title: Hai câu hỏi tự đặt
        body: |
          1. **Danh từ này đếm được và số ít không?** Nếu có, bắt buộc phải có mạo từ
             hoặc từ hạn định (`my`, `this`, `each`...). Không bao giờ để trần.
          2. **Người nghe có biết mình đang nói cái nào không?** Có thì `the`,
             chưa thì `a/an`.

          Với tên riêng: nói chung **không** có `the` (Vietnam, Hanoi, Mr Nam), nhưng
          có `the` với sông, biển, dãy núi và tên nước số nhiều — **the** Mekong,
          **the** Philippines, **the** United States.
      - kind: common-mistakes
        title: Lỗi người Việt hay mắc
        body: |
          | Sai | Đúng | Vì sao |
          |---|---|---|
          | I am student. | I am **a** student. | Danh từ đếm được số ít phải có mạo từ |
          | I like the music. | I like music. | Nói chung chung thì không dùng the |
          | She plays the football. | She plays football. | Môn thể thao không có the |
          | He is an university student. | He is **a** university student. | university đọc /juːnɪ/, âm phụ âm |
          | I go to the school every day. | I go to school every day. | Đi học để học thì không có the |
    exercises:
      - type: MCQ
        prompt: "My uncle is ____ engineer at a construction company."
        promptVi: Chọn mạo từ đúng.
        options: [an, a, the, "(không mạo từ)"]
        answer: an
        explanationVi: "engineer bắt đầu bằng âm nguyên âm /e/ nên dùng an, và đây là
          lần đầu nhắc tới nên chưa dùng the."
      - type: MCQ
        prompt: "She is ____ best student in the class."
        promptVi: Chọn mạo từ đúng.
        options: [the, a, an, "(không mạo từ)"]
        answer: the
        explanationVi: "So sánh nhất luôn đi với the, vì chỉ có một người giỏi nhất."
      - type: MCQ
        prompt: "I don't drink ____ coffee in the evening."
        promptVi: Chọn phương án đúng.
        options: ["(không mạo từ)", a, an, the]
        answer: "(không mạo từ)"
        explanationVi: "coffee ở đây là danh từ không đếm được, nói chung chung, nên
          không cần mạo từ."
      - type: GAP_FILL
        prompt: "I saw ____ cat in the garden. ____ cat was black."
        promptVi: "Điền hai mạo từ, cách nhau bằng dấu cách."
        answer: a The
        accept: ["a The"]
        explanationVi: "Lần đầu nhắc tới dùng a; câu sau người nghe đã biết là con nào
          nên chuyển sang The."
      - type: TRUE_FALSE
        prompt: Câu sau đúng ngữ pháp hay sai?
        statement: My brother wants to be a doctor in the future.
        answer: true
        explanationVi: "Đúng. doctor là danh từ đếm được số ít nên cần a, và in the
          future là cụm cố định luôn có the."
      - type: TRUE_FALSE
        prompt: Câu sau đúng ngữ pháp hay sai?
        statement: He listens to the music every morning.
        answer: false
        explanationVi: "Sai. music ở đây là âm nhạc nói chung nên bỏ the. Chỉ dùng
          the music khi nói về một bản nhạc cụ thể."
      - type: SHORT_ANSWER
        prompt: "Sửa câu sai: \"She is teacher at a primary school.\""
        accept: ["She is a teacher at a primary school"]
        explanationVi: "teacher là danh từ đếm được số ít nên phải có a."
      - type: MCQ
        prompt: We need to buy ____ new refrigerator for the kitchen.
        promptVi: Chọn mạo từ bất định khi chưa nói đến chiếc tủ lạnh cụ thể nào.
        options:
          - a
          - an
          - the
          - (không mạo từ)
        answer: a
        explanationVi: Cụm new refrigerator chỉ một chiếc tủ lạnh chưa xác định. New bắt đầu bằng âm phụ âm
          /n/ nên dùng a.
      - type: MCQ
        prompt: Look at ____ moon! It is so bright tonight.
        promptVi: Chọn mạo từ đúng.
        options:
          - a
          - an
          - (không mạo từ)
          - the
        answer: the
        explanationVi: Người nói và người nghe cùng chỉ Mặt Trăng trên bầu trời của Trái Đất nên dùng the moon.
      - type: MCQ
        prompt: She has to wait for ____ hour before the meeting starts.
        promptVi: Chọn mạo từ đúng.
        options:
          - the
          - (không mạo từ)
          - an
          - a
        answer: an
        explanationVi: Chữ h trong hour không được phát âm, nên hour bắt đầu bằng âm nguyên âm và đi với an.
      - type: MCQ
        prompt: I love eating ____ apples. They are very healthy.
        promptVi: Chọn mạo từ đúng.
        options:
          - the
          - (không mạo từ)
          - a
          - an
        answer: (không mạo từ)
        explanationVi: apples là danh từ số nhiều chỉ chung chung (tôi thích ăn táo nói chung) nên không dùng mạo từ.
      - type: MCQ
        prompt: This is ____ first time I have visited Hanoi.
        promptVi: Chọn mạo từ đúng.
        options:
          - the
          - a
          - an
          - (không mạo từ)
        answer: the
        explanationVi: Trong this is the first time, dùng the trước first để chỉ lần đầu tiên. Không dùng a
          hoặc an trong cấu trúc này.
      - type: MCQ
        prompt: My cousin studies at ____ university in London, but I don't know which one.
        promptVi: Chọn mạo từ để chỉ một trường đại học chưa xác định.
        options:
          - an
          - the
          - (không mạo từ)
          - a
        answer: a
