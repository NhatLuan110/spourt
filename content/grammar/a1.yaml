  - slug: there-is-there-are
    title: There is / There are
    titleVi: Cấu trúc there is / there are
    summary: Cách nói "có" trong tiếng Anh, và vì sao dịch thẳng từ tiếng Việt lại sai.
    estimatedMinutes: 10
    xpReward: 20
    order: 3
    prerequisites: [present-simple]
    sections:
      - kind: theory
        title: Cấu trúc
        body: |
          Tiếng Việt nói "Có một quyển sách trên bàn" — chủ ngữ ẩn. Tiếng Anh bắt buộc
          phải có chủ ngữ hình thức **there**:

          - **There is** a book on the table. *(số ít / không đếm được)*
          - **There are** three books on the table. *(số nhiều)*

          Động từ chia theo danh từ **đứng ngay sau nó**, không theo `there`:

          - There **is** a chair and two tables. *(chair đứng trước → is)*
          - There **are** two tables and a chair. *(tables đứng trước → are)*

          Phủ định và nghi vấn:

          - There **isn't** any milk in the fridge.
          - **Is there** a bank near here?
      - kind: examples
        title: Ví dụ
        body: |
          - **There are** many motorbikes in Ho Chi Minh City.
            *Ở Thành phố Hồ Chí Minh có rất nhiều xe máy.*
          - **There is** a lot of traffic in the morning.
            *Buổi sáng có rất nhiều xe cộ.*
          - **Is there** a pharmacy on this street?
            *Trên phố này có hiệu thuốc không?*
      - kind: tips
        title: Mẹo nhớ
        body: |
          `there is/are` giới thiệu cái **mới**. Khi đã biết cái đó rồi thì dùng
          `it is` hoặc `they are`:

          - **There is** a new cafe on Ba Trieu street. **It is** very quiet.

          Với danh từ không đếm được luôn dùng **is**: there **is** some water,
          there **is** a lot of noise.
      - kind: common-mistakes
        title: Lỗi người Việt hay mắc
        body: |
          | Sai | Đúng | Vì sao |
          |---|---|---|
          | Have a book on the table. | **There is** a book on the table. | Đừng dịch thẳng "có" thành have |
          | There are a lot of traffic. | There **is** a lot of traffic. | traffic không đếm được |
          | There is many people here. | There **are** many people here. | people là số nhiều |
          | In my city has three parks. | **There are** three parks in my city. | Câu tiếng Anh cần chủ ngữ thật |
    exercises:
      - type: MCQ
        prompt: "____ a lot of noise in this street at night."
        promptVi: Chọn phương án đúng.
        options: [There is, There are, Have, It has]
        answer: There is
        explanationVi: "noise là danh từ không đếm được nên dùng There is."
      - type: MCQ
        prompt: "____ any eggs in the fridge?"
        promptVi: Chọn phương án đúng.
        options: [Are there, Is there, Do there, Have there]
        answer: Are there
        explanationVi: "eggs số nhiều nên dùng Are there; câu hỏi đảo there ra sau động từ."
      - type: GAP_FILL
        prompt: "____ ____ two hospitals and one school in my village."
        promptVi: "Điền hai từ."
        answer: There are
        accept: ["There are"]
        explanationVi: "Danh từ đứng ngay sau là two hospitals — số nhiều — nên dùng
          There are."
      - type: TRUE_FALSE
        prompt: Câu sau đúng ngữ pháp hay sai?
        statement: There is a chair and two tables in the room.
        answer: true
        explanationVi: "Đúng. Động từ chia theo danh từ đứng ngay sau nó là a chair,
          số ít, nên dùng is."
      - type: REORDER
        prompt: Sắp xếp thành một câu đúng.
        chunks: ["There aren't", "any good restaurants", "near", "my office"]
        explanationVi: "Phủ định số nhiều là There aren't, sau đó là cụm danh từ rồi
          giới từ chỉ nơi chốn."
      - type: SHORT_ANSWER
        prompt: "Sửa câu sai: \"In my house has four rooms.\""
        accept: ["There are four rooms in my house", "My house has four rooms"]
        explanationVi: "Câu tiếng Anh cần chủ ngữ thật. Hai cách đúng: There are four
          rooms in my house, hoặc My house has four rooms."
      - type: MCQ
        prompt: ____ some water in the bottle on the table.
        promptVi: Chọn phương án đúng.
        options:
          - There is
          - There are
          - It has
          - There isn't any
        answer: There is
        explanationVi: Water (nước) là danh từ không đếm được nên chúng ta dùng cấu trúc số ít 'There is'.
