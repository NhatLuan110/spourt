<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBFAF5" />
    <meta name="description" content="Sprout — Học tiếng Anh như chăm một cái cây." />
    <title>Sprout — Học tiếng Anh như chăm một cái cây</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Charis+SIL:wght@400;700&family=Fraunces:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        const theme = localStorage.getItem('sprout-theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Bật JavaScript trong trình duyệt để sử dụng Sprout.</noscript>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
