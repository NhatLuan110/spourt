name: Keep API awake

# Render's free plan sleeps after 15 idle minutes and the next visitor waits
# about a minute. A ping every few minutes keeps it warm. /healthz does not
# touch the database, so Neon can still suspend and stay within its free hours.
# GitHub may delay scheduled runs; the odd miss only means one slow first load.
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API
        env:
          API_URL: ${{ vars.PAGES_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "PAGES_API_URL is not set"; exit 0; fi
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 "${API_URL%/api/v1}/healthz"
